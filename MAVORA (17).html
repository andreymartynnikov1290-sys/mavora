    <button class="b w" data-a="ac-complete" data-course="${cid}" data-id="${l.id}">${done?'Completed ✓':'Mark complete (+10 XP)'}</button>
    ${i>0?`<button class="b s" data-a="ac-lesson" data-course="${cid}" data-l="${i-1}">Previous</button>`:''}
    ${i<c.lessons.length-1?`<button class="b s" data-a="ac-lesson" data-course="${cid}" data-l="${i+1}">Next</button>`:`<button class="b s" data-a="sbt" data-t="Practice">Take quiz</button>`}
  </div>
</div>`;
};

SP['academy:Practice'] = () => {
  const cid = S.acad.course || 'foundations';
  const c = CURRICULUM[cid];
  const quiz = c?.quiz || [];
  const ans = (S.acad.quiz && S.acad.quiz[cid]) || {};
  let score = 0, answered = 0;
  quiz.forEach((q,i)=>{ if(ans[i]!==undefined){ answered++; if(+ans[i]===q.a) score++; }});
  return `<h1>Practice · Quiz</h1>
<div class="ac-path">${Object.keys(CURRICULUM).map(id=>`<button class="b s ${id===cid?'on':''}" data-a="ac-open" data-course="${id}">${safe(CURRICULUM[id].title.split(' ')[0])}</button>`).join('')}</div>
<div class="ac-card" style="margin-bottom:12px"><b>${safe(c.title)}</b>
  <div class="mu">Score ${score}/${quiz.length}${answered<quiz.length?' · in progress':''}</div></div>
${quiz.map((q,i)=>{
  const a=ans[i];
  return `<div class="ac-lesson ac-quiz">
    <h4>${i+1}. ${safe(q.q)}</h4>
    <div class="row" style="flex-wrap:wrap">${q.opts.map((o,j)=>`<button class="b s ${a===j?'on':''}" data-a="ac-ans" data-course="${cid}" data-q="${i}" data-o="${j}">${safe(o)}</button>`).join('')}</div>
    ${a!==undefined?`<div class="${+a===q.a?'ac-done':'dn'}" style="margin-top:8px">${+a===q.a?'Correct':'Incorrect — review the lesson'}</div>`:''}
  </div>`;
}).join('')}
<div class="row" style="gap:8px;margin-top:10px">
  <button class="b s" data-a="ac-quiz-reset" data-course="${cid}">Reset quiz</button>
  <button class="b s" data-a="sbt" data-t="Lesson">Back to lessons</button>
</div>
<div class="c" style="margin-top:14px">
  <h3>Drills in the app</h3>
  <div class="row" style="flex-wrap:wrap;gap:8px">
    <button class="b s w" data-a="nav" data-m="discover">Market Overview</button>
    <button class="b s" data-a="nav" data-m="terminal" data-tab="Structure">Structure</button>
    <button class="b s" data-a="nav" data-m="terminal" data-tab="Risk">Risk calc</button>
    <button class="b s" data-a="nav" data-m="account">Journal</button>
  </div>
</div>`;
};

SP['academy:Progress'] = () => {
  const t = totalProgress();
  return `<h1>Academy · Progress</h1>
<div class="ac-card"><div class="row sp"><b>Completion</b><span>${t.pct}%</span></div>
  <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+t.pct||0))}%"></span></div>
  <div class="r2"><span>Lessons done</span><b>${t.d}/${t.n}</b></div>
  <div class="r2"><span>XP</span><b>${S.acad.xp||0}</b></div>
</div>
<div class="ac-grid" style="margin-top:12px">${Object.entries(CURRICULUM).map(([id,c])=>{
  const p=courseProgress(id);
  return `<div class="ac-card"><h3>${safe(c.title)}</h3><div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+p.pct||0))}%"></span></div>
    <span class="mu">${p.d}/${p.n} · ${safe(c.level)}</span>
    <button class="b s" data-a="ac-open" data-course="${id}" style="margin-top:8px">Continue</button></div>`;
}).join('')}</div>`;
};

SP['academy:Glossary'] = () => {
  const terms = [
    ['OHLCV','Open, high, low, close, volume — basic candle data.'],
    ['HTF / LTF','Higher / lower timeframe. Bias vs execution.'],
    ['Invalidation','Price level where the trade idea is wrong — usually the stop basis.'],
    ['VWAP','Volume-weighted average price — institutional reference, not magic.'],
    ['OI','Open interest — outstanding derivative contracts.'],
    ['Funding','Periodic payment between longs and shorts on perps.'],
    ['CVD / Delta','Cumulative volume delta / aggressive buy vs sell proxy.'],
    ['Expectancy','Average net PnL per trade over a series.'],
    ['Profit factor','Gross profits ÷ gross losses.'],
    ['Slippage','Difference between expected and filled price.'],
    ['NO TRADE','Valid outcome when checklist fails.']
  ];
  return `<h1>Academy · Glossary</h1>
<div class="ac-grid">${terms.map(([t,d])=>`<div class="ac-card"><h3>${safe(t)}</h3><p class="mu" style="line-height:1.45;margin:0">${safe(d)}</p></div>`).join('')}</div>`;
};

SP['academy:Certificates'] = () => {
  const ready = Object.entries(CURRICULUM).filter(([id])=>courseProgress(id).pct===100);
  return `<h1>Academy · Certificates</h1>
<p class="mu">Local completion badges for this browser profile. Not accredited credentials.</p>
<div class="ac-grid">${Object.entries(CURRICULUM).map(([id,c])=>{
  const p=courseProgress(id);
  const ok=p.pct===100;
  return `<div class="ac-card">
    <h3>${safe(c.title)}</h3>
    <div class="mu">${ok?'Requirements met':'Complete all lessons ('+p.d+'/'+p.n+')'}</div>
    <button class="b s ${ok?'w':''}" data-a="ac-cert" data-course="${id}" ${ok?'':'disabled'} style="margin-top:10px">${ok?'View certificate':'Locked'}</button>
  </div>`;
}).join('')}</div>`;
};

PG.academy = () => SP['academy:Path']();
function acad(){ return SP['academy:Path'](); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'ac-open') {
    S.acad.course = b.dataset.course; S.acad.lesson = 0;
    S.sb = S.sb || {}; S.sb.academy = 'Courses';
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-lesson') {
    S.acad.course = b.dataset.course; S.acad.lesson = +b.dataset.l;
    S.sb = S.sb || {}; S.sb.academy = 'Lesson';
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-complete') {
    acadMark(b.dataset.course, b.dataset.id);
    if (typeof note === 'function') note('Lesson complete · +10 XP');
    render();
  }
  if (a === 'ac-ans') {
    S.acad.quiz = S.acad.quiz || {};
    S.acad.quiz[b.dataset.course] = S.acad.quiz[b.dataset.course] || {};
    S.acad.quiz[b.dataset.course][b.dataset.q] = +b.dataset.o;
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-quiz-reset') {
    if (S.acad.quiz) delete S.acad.quiz[b.dataset.course];
    try { sv(); } catch(err) {} render();

<style id="mavora-social-v2-css">
.so-grid{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:14px}
.so-card{background:linear-gradient(165deg,#121212,#0a0a0a);border:1px solid #262626;border-radius:16px;padding:14px;margin-bottom:12px}
.so-card h3{margin:0 0 6px;font-size:14px}
.so-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.so-tag{font-size:10px;border:1px solid #333;border-radius:99px;padding:2px 8px;color:#aaa}
.so-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.so-composer textarea{width:100%;min-height:72px;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:12px;color:#eee;padding:10px;font:inherit;resize:vertical}
.so-side .so-card{position:sticky;top:8px}
.so-user{font-weight:600}
.so-time{color:#666;font-size:11px}
.so-body{color:#c8c8c8;font-size:13px;line-height:1.5;margin:0}
.so-cm{border-top:1px solid #1a1a1a;margin-top:10px;padding-top:8px}
.so-cm .r2{font-size:12px;color:#999}
.so-empty{text-align:center;padding:28px;color:#666}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.co-card{background:linear-gradient(165deg,#121212,#0a0a0a);border:1px solid #262626;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.co-card h3{margin:0;font-size:15px}
@media(max-width:900px){.so-grid{grid-template-columns:1fr}}
</style>
<script id="mavora-social-v2">
(()=>{
'use strict';
const safe=v=>(typeof esc==='function'?esc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const $id=id=>document.getElementById(id);
const nowTs=()=>new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ---------- state ---------- */
S.posts=Array.isArray(S.posts)?S.posts:[];
S.com=Array.isArray(S.com)?S.com:[];
S.fol=Array.isArray(S.fol)?S.fol:[];
S.ms=S.ms&&typeof S.ms==='object'?S.ms:{};
S.prof=S.prof||{n:(S.pf&&S.pf.n)||'You',s:(S.pf&&S.pf.s)||'Trader',b:(S.pf&&S.pf.bio)||''};
S.so=S.so||{filter:'all',ideaDir:'',q:'',topic:'all'};
S.co=S.co||{tabRoom:null,rooms:{}};

if(!S.posts.length){
  S.posts=[
    {id:1,u:'trader_alpha',t:'BTC holds structure above prior day low. Waiting for 1H acceptance before continuation.',tk:'BTC',dir:'Long',st:'Active',likes:12,liked:0,saved:0,cm:['Agree on invalidation below the low.'],ts:'demo'},
    {id:2,u:'quant_mia',t:'ETH funding elevated — not a short by itself. Watching for structure break first.',tk:'ETH',dir:'Short',st:'Draft',likes:5,liked:0,saved:0,cm:[],ts:'demo'}
  ];
}
if(!S.com.length){
  S.com=[
    {id:1,n:'Day Traders',j:1,d:'Intraday setups, risk and session review',members:128,topic:'intraday'},
    {id:2,n:'Order Flow Lab',j:0,d:'Delta, CVD, footprint discussions',members:86,topic:'flow'},
    {id:3,n:'Long-term Holders',j:0,d:'Multi-week bias and portfolio construction',members:210,topic:'swing'},
    {id:4,n:'AI Quant Club',j:0,d:'Agents, rules and paper research',members:64,topic:'ai'}
  ];
}

SUB.social=['Feed','Explore','Ideas','Saved','Messages','Following','Profile','Activity'];
SUB.community=['Discover','My','Rooms','Events','Leaderboard','Create'];

function meName(){return (S.prof&&S.prof.n)||(S.pf&&S.pf.n)||'You';}
function postById(id){return (S.posts||[]).find(p=>+p.id===+id);}
function comById(id){return (S.com||[]).find(c=>+c.id===+id);}

function soCard(p){
  const mine=(p.u||'').startsWith('You')||p.u===meName()||(p.u||'').startsWith('Вы');
  const cm=(p.cm||[]).map(c=>`<div class="r2">${safe(typeof c==='string'?c:(c.u+': '+c.t))}</div>`).join('');
  return `<article class="so-card" data-pid="${p.id}">
    <div class="so-meta">
      <span class="so-user">${safe(p.u)}</span>
      <span class="so-tag">${safe(p.tk||'—')}</span>
      <span class="so-tag">${safe(p.dir||'—')}</span>
      <span class="so-tag">${safe(p.st||'Active')}</span>
      <span class="so-time">${safe(p.ts||'')}</span>
    </div>
    <p class="so-body">${safe(p.t)}</p>
    <div class="so-actions">
      <button type="button" class="b s ${p.liked?'on':''}" data-a="so-like" data-id="${p.id}">♥ ${p.likes||0}</button>
      <button type="button" class="b s ${p.saved?'on':''}" data-a="so-save" data-id="${p.id}">Save</button>
      <button type="button" class="b s" data-a="so-status" data-id="${p.id}">Status</button>
      <button type="button" class="b s w" data-a="sel" data-s="${safe(p.tk||'BTC')}">Terminal</button>
      ${mine?`<button type="button" class="b s r" data-a="so-del" data-id="${p.id}">Delete</button>`:''}
    </div>
    <div class="so-cm">${cm||'<div class="mu" style="font-size:12px">No comments</div>'}
      <div class="row" style="margin-top:8px;gap:6px">
        <input id="cm${p.id}" placeholder="Comment…" style="flex:1">
        <button type="button" class="b s w" data-a="so-cmt" data-id="${p.id}">Reply</button>
      </div>
    </div>
  </article>`;
}

function soComposer(){
  const syms=(typeof AS!=='undefined'?AS:[{s:'BTC'},{s:'ETH'}]).map(a=>a.s);
  return `<div class="so-card so-composer">
    <textarea id="so-pt" placeholder="Thesis, invalidation, risk note…"></textarea>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">
      <select id="so-pk">${syms.map(s=>`<option ${s===(S.sel||'BTC')?'selected':''}>${s}</option>`).join('')}</select>
      <select id="so-pd"><option>Long</option><option>Short</option><option>Neutral</option></select>
      <select id="so-st"><option>Active</option><option>Draft</option><option>Watch</option></select>
      <button type="button" class="b w" data-a="so-post">Publish idea</button>
    </div>
    <p class="mu" style="margin:8px 0 0;font-size:11px">Local feed only · not a live social network · DEMO peers</p>
  </div>`;
}

function soSidebar(){
  const trending=[...(typeof AS!=='undefined'?AS:[])].slice().sort((a,b)=>Math.abs((b.p/b.o-1)||0)-Math.abs((a.p/a.o-1)||0)).slice(0,5);
  const saved=(S.posts||[]).filter(p=>p.saved).length;
  return `<div class="so-side">
    <div class="so-card">
      <h3>Filters</h3>
      <div class="row" style="flex-wrap:wrap;gap:6px">
        ${['all','Long','Short','saved'].map(f=>`<button type="button" class="b s ${S.so.filter===f?'on':''}" data-a="so-filter" data-f="${f}">${f}</button>`).join('')}
      </div>
      <input id="so-q" placeholder="Search ideas…" value="${safe(S.so.q||'')}" style="width:100%;margin-top:8px">
      <button type="button" class="b s" style="margin-top:6px" data-a="so-search">Search</button>
    </div>
    <div class="so-card">
      <h3>Trending tickers</h3>
      ${trending.map(a=>`<div class="r2"><b>${safe(a.s)}</b><button type="button" class="b s" data-a="sel" data-s="${safe(a.s)}">Open</button></div>`).join('')||'<span class="mu">—</span>'}
    </div>
    <div class="so-card">
      <h3>Your desk</h3>
      <div class="r2"><span>Ideas</span><b>${(S.posts||[]).filter(p=>(p.u||'').startsWith('You')||p.u===meName()||(p.u||'').startsWith('Вы')).length}</b></div>
      <div class="r2"><span>Saved</span><b>${saved}</b></div>
      <div class="r2"><span>Following</span><b>${(S.fol||[]).length}</b></div>
      <button type="button" class="b s w" style="margin-top:8px" data-a="nav" data-m="community">Community</button>
    </div>
  </div>`;
}

function filteredPosts(){
  let list=[...(S.posts||[])];
  const f=S.so.filter||'all';
  if(f==='Long'||f==='Short') list=list.filter(p=>p.dir===f);
  if(f==='saved') list=list.filter(p=>p.saved);
  const q=(S.so.q||'').toLowerCase();
  if(q) list=list.filter(p=>(p.t+p.u+p.tk+p.dir).toLowerCase().includes(q));
  return list;
}

SP['social:Feed']=()=>`<h1>Social · Feed</h1>
<div class="so-grid">
  <div>${soComposer()}${filteredPosts().map(soCard).join('')||'<div class="so-empty">No posts — publish a thesis</div>'}</div>
  ${soSidebar()}
</div>`;

SP['social:Explore']=()=>{
  const list=[...(S.posts||[])].slice().sort((a,b)=>(b.likes||0)-(a.likes||0));
  return `<h1>Social · Explore</h1>
  <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:6px">
    <button type="button" class="b s ${!S.xf?'on':''}" data-a="so-xf" data-s="">All</button>
    ${(typeof AS!=='undefined'?AS:[]).slice(0,8).map(a=>`<button type="button" class="b s ${S.xf===a.s?'on':''}" data-a="so-xf" data-s="${a.s}">${a.s}</button>`).join('')}
  </div>
  <div class="so-grid"><div>${list.filter(p=>!S.xf||p.tk===S.xf).map(soCard).join('')||'<div class="so-empty">Nothing ranked yet</div>'}</div>${soSidebar()}</div>`;
};

SP['social:Ideas']=()=>{
  const dir=S.so.ideaDir||'';
  const list=(S.posts||[]).filter(p=>!dir||p.dir===dir);
  return `<h1>Social · Trading Ideas</h1>
  <div class="row" style="margin-bottom:12px;gap:6px">${['','Long','Short','Neutral'].map(x=>`<button type="button" class="b s ${dir===x?'on':''}" data-a="so-idea-dir" data-d="${x}">${x||'All'}</button>`).join('')}</div>
  ${soComposer()}
  ${list.map(soCard).join('')||'<div class="so-empty">No ideas in this filter</div>'}`;
};

SP['social:Saved']=()=>{
  const list=(S.posts||[]).filter(p=>p.saved);
  return `<h1>Social · Saved</h1>${list.map(soCard).join('')||'<div class="so-empty">Save ideas from Feed to build a review list</div>'}`;
};

SP['social:Messages']=()=>{
  const contacts=['trader_alpha','quant_mia','macro_vera', ...(S.fol||[])];
  const uniq=[...new Set(contacts)];
  const k=S.mc||uniq[0];
  const msgs=(S.ms[k]||[]);
  return `<h1>Social · Messages</h1>
  <div class="so-grid">
    <div class="so-card">
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">${uniq.map(u=>`<button type="button" class="b s ${u===k?'on':''}" data-a="so-chat" data-u="${safe(u)}">${safe(u)}</button>`).join('')}</div>
      <div class="mg" style="min-height:180px;max-height:320px;overflow:auto">${msgs.map(m=>`<div class="r2 ${m.me?'':'mu'}"><b>${m.me?'You':safe(k)}</b><span>${safe(m.t)}</span></div>`).join('')||'<div class="so-empty">No messages — local only</div>'}</div>
      <div class="row" style="margin-top:8px;gap:6px"><input id="so-mi" placeholder="Message…" style="flex:1"><button type="button" class="b w" data-a="so-msg">Send</button></div>
    </div>
    <div class="so-card"><h3>Note</h3><p class="mu" style="line-height:1.45">DM is local simulation. No server, no delivery to real users.</p>
      <h3 style="margin-top:12px">Watchlist quick</h3>
      ${(S.wl||[]).map(s=>`<div class="r2"><b>${safe(s)}</b><button type="button" class="b s" data-a="sel" data-s="${safe(s)}">Terminal</button></div>`).join('')||'<span class="mu">Empty watchlist</span>'}
    </div>
  </div>`;
};

SP['social:Following']=()=>{
  const people=['trader_alpha','quant_mia','macro_vera','flow_ken','risk_ada'];
  return `<h1>Social · Following</h1>
  <div class="co-grid">${people.map(u=>{
    const on=(S.fol||[]).includes(u);
    return `<div class="co-card"><h3>${safe(u)}</h3><p class="mu">DEMO profile</p>
      <button type="button" class="b s ${on?'':'w'}" data-a="so-fol" data-u="${safe(u)}">${on?'Following · unfollow':'Follow'}</button>
      <button type="button" class="b s" data-a="so-chat" data-u="${safe(u)}">Message</button></div>`;
  }).join('')}</div>
  <p class="mu" style="margin-top:12px">Following list is local. Posts from DEMO authors stay in Feed.</p>`;
};

SP['social:Profile']=()=>{
  const p=S.prof||{};
  const mine=(S.posts||[]).filter(x=>(x.u||'').startsWith('You')||x.u===meName()||(x.u||'').startsWith('Вы'));
  return `<h1>Social · Profile</h1>
  <div class="so-grid">
    <div class="so-card">
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <input id="so-pn" value="${safe(p.n||'')}" placeholder="Display name">
        <input id="so-ps" value="${safe(p.s||'')}" placeholder="Focus (e.g. order flow)">
      </div>
      <textarea id="so-pb" rows="3" style="width:100%;margin-top:8px" placeholder="Bio">${safe(p.b||'')}</textarea>
      <button type="button" class="b w" style="margin-top:8px" data-a="so-prof">Save profile</button>
      <p class="mu" style="margin-top:8px">Local profile · not published online</p>
    </div>
    <div class="so-card"><h3>Stats</h3>
      <div class="r2"><span>Published ideas</span><b>${mine.length}</b></div>
      <div class="r2"><span>Likes received</span><b>${mine.reduce((s,x)=>s+(+x.likes||0),0)}</b></div>
      <div class="r2"><span>Following</span><b>${(S.fol||[]).length}</b></div>
    </div>
  </div>
  <h3 style="margin-top:14px">Your ideas</h3>
  ${mine.map(soCard).join('')||'<div class="so-empty">No posts yet</div>'}`;
};

SP['social:Activity']=()=>{
  const acts=[];
  (S.posts||[]).forEach(p=>{
    if(p.liked) acts.push({t:'Liked idea',d:p.t.slice(0,60),ts:p.ts});
    if(p.saved) acts.push({t:'Saved idea',d:p.t.slice(0,60),ts:p.ts});
  });
  (S.fol||[]).forEach(u=>acts.push({t:'Following',d:u,ts:''}));
  return `<h1>Social · Activity</h1>
  <div class="so-card">${acts.map(a=>`<div class="r2"><span><b>${safe(a.t)}</b> · ${safe(a.d)}</span><span class="so-time">${safe(a.ts||'')}</span></div>`).join('')||'<div class="so-empty">Actions will appear here</div>'}</div>`;
};

PG.social=()=>SP['social:Feed']();
function feed(){return SP['social:Feed']();}

/* ---------- Community ---------- */
function coCard(c){
  return `<div class="co-card">
    <div class="so-meta"><span class="so-tag">${safe(c.topic||'general')}</span>
      ${c.j?'<span class="so-tag">Joined</span>':''}</div>
    <h3>${safe(c.n)}</h3>
    <p class="mu" style="flex:1;line-height:1.45;margin:0">${safe(c.d)}</p>
    <div class="r2"><span>Members</span><b>${safe(c.members||'—')}</b></div>
    <div class="so-actions">
      <button type="button" class="b s ${c.j?'':'w'}" data-a="co-join" data-id="${c.id}">${c.j?'Leave':'Join'}</button>
      <button type="button" class="b s" data-a="co-room" data-id="${c.id}">Open room</button>
    </div>
  </div>`;
}

SP['community:Discover']=()=>{
  const topic=S.co.topic||'all';
  let list=[...(S.com||[])];
  if(topic!=='all') list=list.filter(c=>(c.topic||'')===topic||(c.d||'').toLowerCase().includes(topic));
  return `<h1>Community · Discover</h1>
  <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:6px">
    ${['all','intraday','flow','swing','ai'].map(t=>`<button type="button" class="b s ${topic===t?'on':''}" data-a="co-topic" data-t="${t}">${t}</button>`).join('')}
    <button type="button" class="b s w" data-a="sbt" data-t="Create">Create</button>
  </div>
  <div class="co-grid">${list.map(coCard).join('')||'<div class="so-empty">No communities</div>'}</div>
  <p class="mu" style="margin-top:12px">Communities are local DEMO groups for workflow — not a hosted network.</p>`;
};

SP['community:My']=()=>{
  const list=(S.com||[]).filter(c=>c.j);
  return `<h1>Community · My groups</h1>
  <div class="co-grid">${list.map(coCard).join('')||'<div class="so-empty">Join a group in Discover</div>'}</div>`;
};

SP['community:Rooms']=()=>{
  const id=S.co.tabRoom || ((S.com||[]).find(c=>c.j)||S.com[0]||{}).id;
  const c=comById(id);
  if(!c) return `<h1>Community · Rooms</h1><div class="so-empty">No room selected</div>`;
  S.co.rooms=S.co.rooms||{};
  const room=S.co.rooms[id]=S.co.rooms[id]||{msgs:[
    {u:'system',t:`Welcome to ${c.n}. Share process, not signals as advice.`,ts:'demo'}
  ]};
  return `<h1>Community · Room</h1>
  <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px">
    ${(S.com||[]).map(x=>`<button type="button" class="b s ${+x.id===+id?'on':''}" data-a="co-room" data-id="${x.id}">${safe(x.n)}</button>`).join('')}
  </div>
  <div class="so-card">
    <h3>${safe(c.n)}</h3>
    <p class="mu">${safe(c.d)}</p>
    <div style="max-height:320px;overflow:auto;margin:12px 0">${room.msgs.map(m=>`<div class="r2"><b>${safe(m.u)}</b><span>${safe(m.t)}</span><span class="so-time">${safe(m.ts||'')}</span></div>`).join('')}</div>
    <div class="row" style="gap:6px"><input id="co-msg" placeholder="Message the room…" style="flex:1">
      <button type="button" class="b w" data-a="co-send" data-id="${id}">Send</button></div>
  </div>`;
};

SP['community:Events']=()=>{
  const events=[
    {t:'Session open review',d:'Daily · structure + risk before London/NY',when:'Weekdays'},
    {t:'Journal clinic',d:'Share process screenshots (local notes)',when:'Weekly'},
    {t:'Order flow workshop',d:'DEMO agenda · CVD & book checklist',when:'Weekend'}
  ];
  return `<h1>Community · Events</h1>
  <div class="co-grid">${events.map(e=>`<div class="co-card"><h3>${safe(e.t)}</h3><p class="mu">${safe(e.d)}</p>
    <span class="so-tag">${safe(e.when)}</span>
    <button type="button" class="b s" data-a="co-rsvp" data-t="${safe(e.t)}">RSVP (local)</button></div>`).join('')}</div>
  <p class="mu" style="margin-top:12px">Events are templates stored in this browser only.</p>`;
};

SP['community:Leaderboard']=()=>`<h1>Community · Leaderboard</h1>
<div class="so-card"><p class="mu">DEMO figures — not verified live results. Real leaderboards need audited accounts.</p>
<table style="width:100%"><thead><tr><th>#</th><th>Trader</th><th>Win rate</th><th>Note</th></tr></thead>
<tbody>
<tr><td>1</td><td>trader_alpha</td><td>61%</td><td class="mu">DEMO</td></tr>
<tr><td>2</td><td>quant_mia</td><td>57%</td><td class="mu">DEMO</td></tr>
<tr><td>3</td><td>macro_vera</td><td>54%</td><td class="mu">DEMO</td></tr>
</tbody></table></div>`;

SP['community:Create']=()=>`<h1>Community · Create</h1>
<div class="so-card" style="max-width:480px">
  <input id="co-cn" placeholder="Name" style="width:100%;margin-bottom:8px">
  <input id="co-cd" placeholder="Description" style="width:100%;margin-bottom:8px">
  <select id="co-ct" style="width:100%;margin-bottom:8px">
    <option value="intraday">intraday</option><option value="flow">flow</option>
    <option value="swing">swing</option><option value="ai">ai</option><option value="general">general</option>
  </select>
  <button type="button" class="b w" data-a="co-create">Create group</button>
  <p class="mu" style="margin-top:8px">Created locally and auto-joined.</p>
</div>`;

PG.community=()=>SP['community:Discover']();
function comm(){return SP['community:Discover']();}

/* ---------- handlers ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='so-post'){
    const t=($id('so-pt')||$id('pt'))?.value?.trim();
    if(!t) return;
    S.posts.unshift({
      id:Date.now(), u:meName()||'You', t,
      tk:($id('so-pk')||$id('pk'))?.value||S.sel||'BTC',
      dir:($id('so-pd')||$id('pd'))?.value||'Long',
      st:($id('so-st')?.value)||'Active',
      likes:0,liked:0,saved:0,cm:[],ts:nowTs()
    });
    try{sv()}catch(err){}
    if(typeof note==='function') note('Idea published (local)');
    render(); return;
  }
  if(a==='so-like'){const p=postById(b.dataset.id); if(!p)return; p.liked^=1; p.likes=(+p.likes||0)+(p.liked?1:-1); try{sv()}catch(err){} render(); return;}
  if(a==='so-save'){const p=postById(b.dataset.id); if(!p)return; p.saved^=1; try{sv()}catch(err){} render(); return;}
  if(a==='so-status'){const p=postById(b.dataset.id); if(!p)return; const o=['Draft','Active','Watch','Closed','Invalidated']; p.st=o[(o.indexOf(p.st)+1)%o.length]; try{sv()}catch(err){} render(); return;}
  if(a==='so-del'){S.posts=S.posts.filter(p=>+p.id!==+b.dataset.id); try{sv()}catch(err){} render(); return;}
  if(a==='so-cmt'){
    const p=postById(b.dataset.id); if(!p)return;
    const inp=$id('cm'+b.dataset.id); const t=inp?.value?.trim(); if(!t)return;
    p.cm=p.cm||[]; p.cm.push({u:meName(),t}); if(inp)inp.value=''; try{sv()}catch(err){} render(); return;
  }
  if(a==='so-filter'){S.so.filter=b.dataset.f; try{sv()}catch(err){} render(); return;}
  if(a==='so-search'){S.so.q=$id('so-q')?.value||''; try{sv()}catch(err){} render(); return;}
  if(a==='so-xf'){S.xf=b.dataset.s||''; try{sv()}catch(err){} render(); return;}
  if(a==='so-idea-dir'){S.so.ideaDir=b.dataset.d||''; try{sv()}catch(err){} render(); return;}
  if(a==='so-chat'){S.mc=b.dataset.u; S.sb=S.sb||{}; S.sb.social='Messages'; try{sv()}catch(err){} render(); return;}
  if(a==='so-msg'){
    const k=S.mc||'trader_alpha'; const t=$id('so-mi')?.value?.trim()||$id('mi')?.value?.trim(); if(!t)return;
    S.ms[k]=S.ms[k]||[]; S.ms[k].push({me:1,t,ts:nowTs()}); if($id('so-mi'))$id('so-mi').value=''; try{sv()}catch(err){} render(); return;
  }
  if(a==='so-fol'){
    const u=b.dataset.u; S.fol=S.fol||[];

});
