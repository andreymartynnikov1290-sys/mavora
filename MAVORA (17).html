.hero{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:186px;overflow:hidden;isolation:isolate}.hero-copy{position:relative;z-index:3;min-width:0}.hero-sky{position:absolute;right:clamp(12px,4vw,70px);top:0;width:min(38%,480px);height:100%;min-width:230px;display:grid;place-items:center;perspective:850px;transform-style:preserve-3d;cursor:pointer;touch-action:pan-y;outline:none}.sky-stage{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .25s ease;overflow:hidden}.sky-haze{position:absolute;inset:0;background:radial-gradient(ellipse at 58% 46%,var(--sky-glow, #c9c9c91b),transparent 58%);transition:background 1.8s ease}.sky-orbit{position:absolute;width:178px;height:178px;right:15%;top:50%;transform:translateY(-50%) rotateX(64deg) rotateZ(-22deg);border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 35px #ffffff08;transition:opacity 1s}.sky-orbit:after{content:"";position:absolute;inset:19px;border:1px solid #ffffff0d;border-radius:50%}.sky-body{position:absolute;width:82px;height:82px;right:29%;top:50%;margin-top:-41px;border-radius:50%;transform:translateZ(55px);transition:opacity 1.25s,transform 1.5s,filter 1.5s;box-shadow:inset -16px -13px 22px #0006,0 0 32px var(--orb-glow,#d9d9d920)}.sky-sun{background:radial-gradient(circle at 32% 28%,#fff 0,#e9e6df 20%,#c9c7c1 56%,#777 100%);opacity:1}.sky-moon{background:radial-gradient(circle at 35% 28%,#fff 0,#dcdde0 38%,#a5a8ad 70%,#62656b 100%);opacity:0;transform:translate3d(0,24px,20px) scale(.78)}.sky-moon:before,.sky-moon:after{content:"";position:absolute;border-radius:50%;background:#77777725;box-shadow:inset 2px 2px 5px #0002}.sky-moon:before{width:17px;height:17px;left:19px;top:26px}.sky-moon:after{width:10px;height:10px;right:18px;top:48px}.sky-cloud{position:absolute;z-index:4;width:140px;height:28px;border-radius:50px;background:linear-gradient(180deg,#e7e7e7,#969696);filter:drop-shadow(0 10px 13px #0008);opacity:.68;transform:translateZ(75px);transition:opacity 1.2s,transform 1.4s,background 1.5s}.sky-cloud:before,.sky-cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.sky-cloud:before{width:58px;height:58px;left:20px;bottom:3px}.sky-cloud:after{width:76px;height:76px;left:57px;bottom:0}.sky-cloud.c1{right:7%;top:34%;transform:translateZ(72px) rotate(-12deg) scale(.84)}.sky-cloud.c2{right:31%;top:63%;transform:translateZ(20px) rotate(9deg) scale(.64);opacity:.34}.sky-stars{position:absolute;inset:0;opacity:0;transition:opacity 1.4s;transform:translateZ(15px)}.sky-stars i{position:absolute;width:3px;height:3px;background:#e9e9e9;border-radius:50%;box-shadow:0 0 9px #fff8}.sky-stars i:nth-child(1){left:16%;top:25%}.sky-stars i:nth-child(2){left:55%;top:17%;width:2px;height:2px}.sky-stars i:nth-child(3){right:15%;top:70%}.sky-stars i:nth-child(4){left:39%;bottom:16%;width:2px;height:2px}.hero-sky[data-phase="night"] .sky-sun,.hero-sky[data-phase="dawn"] .sky-sun{opacity:0;transform:translate3d(-22px,25px,0) scale(.7)}.hero-sky[data-phase="night"] .sky-moon,.hero-sky[data-phase="dawn"] .sky-moon{opacity:1;transform:translate3d(0,0,65px) scale(1)}.hero-sky[data-phase="night"] .sky-stars{opacity:.9}.hero-sky[data-phase="night"] .sky-cloud{background:linear-gradient(180deg,#aaa,#666);opacity:.3}.hero-sky[data-phase="dawn"] .sky-haze{--sky-glow:#b8b0a42b}.hero-sky[data-phase="sunset"] .sky-sun{filter:sepia(.2);box-shadow:inset -16px -13px 22px #0006,0 0 46px #d6c7b33b}.hero-sky .sky-caption{position:absolute;bottom:12px;right:10px;color:#777;font:9px/1.2 system-ui;letter-spacing:.2em;z-index:5;opacity:.7}.hero-sky:focus-visible{outline:1px solid #aaa;outline-offset:-10px;border-radius:20px}

 function analyticsHTML(m){const r=m.rsi,rs=r===null?'—':fmt(r,1),rsiLabel=r===null?'нет данных':r>=70?'Перекупленность':r<=30?'Перепроданность':'Нейтрально';const f=m.prem===null?'—':pct(m.prem*100);const fundClass=m.prem===null?'':m.prem>0?'dn':'up';const oi=m.oi===null?'—':fmt(m.oi,0)+' '+m.symbol.replace('USDT','');const ls=m.ls===null?'—':fmt(m.ls,2)+' : 1';const imp=m.impulse?fmt(m.impulse,2)+'×':'—';const impLabel=m.impulse>=2?'Объёмный импульс':m.impulse>=1.4?'Повышенный объём':'Обычный объём';const z=m.zones;return`<div class="row sp"><h2 style="margin:0">${m.symbol} · Market Pulse</h2><span class="pulse-badge"><span class="live-dot"></span>LIVE · ${m.at}</span></div><div class="mktgrid">${metricCard('RSI · 14',rs,rsiLabel,r!==null&&r>=70?'dn':r!==null&&r<=30?'up':'')}${metricCard('Funding · Binance',f,'Perpetual funding rate',fundClass)}${metricCard('Open Interest',oi,'Текущий открытый интерес')}${metricCard('Long / Short',ls,'Global accounts · 1h')}${metricCard('Объём последней свечи',imp,impLabel,m.impulse>=2?'up':'')}${metricCard('Изменение 1h',m.change===null?'—':pct(m.change),'Последняя закрытая/текущая свеча',m.change>=0?'up':'dn')}</div><div class="analytics-grid"><section class="c"><h3>Поддержка и сопротивление <span class="tag">1h · pivot zones</span></h3><div class="signalrow"><b class="up">Поддержка</b><span>${z.sup.map(x=>fmt(x.p,2)).join(' · ')||'Нет подтверждённых pivot-зон'}</span></div><div class="signalrow"><b class="dn">Сопротивление</b><span>${z.res.map(x=>fmt(x.p,2)).join(' · ')||'Нет подтверждённых pivot-зон'}</span></div><p class="source-note">Расчёт MAVORA по публичным свечам Binance Futures. Это локальные технические уровни, не данные TradingView напрямую.</p></section><section class="c"><h3>Liquidation Map <span class="tag">CoinGlass</span></h3><p>Тепловая карта ликвидаций доступна на странице CoinGlass. Данные API CoinGlass требуют API-ключ и соответствующий тариф; в этом автономном HTML мы не имитируем карту.</p><a class="source-link" target="_blank" rel="noopener" href="https://www.coinglass.com/pro/futures/LiquidationMap?symbol=${encodeURIComponent(m.symbol.replace('USDT',''))}">Открыть карту ликвидаций CoinGlass ↗</a><p class="source-note">Источник карты: CoinGlass. Внешняя страница может не разрешать отображение внутри iframe.</p></section></div><p class="source-note">Источники: Binance USDⓈ-M Futures public REST (funding, open interest, long/short, candles). Обновление по запросу. Не является сигналом или рекомендацией.</p>`}
 async function injectPulse(){const target=$id('mavora-pulse');if(!target)return;target.innerHTML='<div class="c mu">Загрузка публичных рыночных метрик…</div>';try{const m=await liveMetrics(S.sel);target.innerHTML=analyticsHTML(m)}catch(e){target.innerHTML='<div class="c"><b>Рыночные метрики временно недоступны</b><p class="source-note">Проверьте подключение к Binance Futures API. Значения не подменяются демо-данными.</p></div>'}}
 // Make Discover's primary market view richer while retaining original filters/table.
 const oldDisc=disc;disc=function(){return oldDisc()+`<section class="c" style="margin-top:14px"><div class="row sp"><h3>Live Market Pulse</h3><button class="b s" data-a="pulse-refresh">Обновить метрики</button></div><div id="mavora-pulse"></div></section><section class="c" style="margin-top:14px"><h3>Источники данных</h3><div class="row"><span class="tag">Binance Spot · ticker</span><span class="tag">Binance Futures · funding / OI</span><span class="tag">TradingView · charts & screener</span><span class="tag">CoinGlass · liquidation map</span></div><p class="source-note">Метка LIVE ставится только после успешного ответа API. TradingView виджеты загружаются напрямую; содержимое iframe не парсится.</p></section>`};

 SP['terminal:Derivatives']=()=>`<h1>${S.sel} · Derivatives</h1><div id="mavora-pulse"></div><div class="analytics-grid"><div class="c"><h3>Funding & Open Interest</h3><p>Funding rate, текущий open interest и long/short ratio подгружаются из публичных Binance Futures endpoints.</p></div><div class="c"><h3>Ликвидации</h3><p>Карта кластеров ликвидаций — внешний CoinGlass, не поддельный график.</p><a class="source-link" target="_blank" rel="noopener" href="https://www.coinglass.com/pro/futures/LiquidationMap?symbol=${encodeURIComponent(S.sel)}">CoinGlass Liquidation Map ↗</a></div></div>`;
 const oldRender2=render;render=function(){oldRender2();if((S.mod==='discover'&&cs()==='Markets')||(S.mod==='terminal'&&(cs()==='Overview'||cs()==='Derivatives'))){injectPulse();if(S.mod==='terminal'&&cs()==='Overview'){const el=$id('mavora-tv-overview');if(el)tvmount(el,'advanced-chart',{autosize:true,symbol:'BINANCE:'+S.sel+'USDT',interval:'60',theme:'dark',style:'1',locale:'ru',backgroundColor:'#000000',allow_symbol_change:true})}}};
 // Discover news from public RSS, through a CORS relay only; display publisher + original link.
 SP['discover:News']=()=>`<h1>Crypto News · RSS</h1><div class="row sp"><span class="source-note">Публичные RSS: CoinDesk, Cointelegraph, Decrypt</span><button class="b s" data-a="news-refresh">Обновить ленту</button></div><div id="mavora-news" class="c" style="margin-top:12px">Загрузка открытых RSS…</div><p class="source-note">Показываются заголовки, краткие описания и ссылки на оригинальные публикации. Права и условия источников сохраняются.</p>`;
 async function loadNews(){const el=$id('mavora-news');if(!el)return;el.textContent='Загружаем RSS-источники…';const feeds=[['CoinDesk','https://www.coindesk.com/arc/outboundfeeds/rss/'],['Cointelegraph','https://cointelegraph.com/rss'],['Decrypt','https://decrypt.co/feed']];let items=[];for(const [name,url] of feeds){try{const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url);const r=await fetch(proxy,{cache:'no-store'});if(!r.ok)continue;const xml=new DOMParser().parseFromString(await r.text(),'text/xml');for(const n of [...xml.querySelectorAll('item')].slice(0,8)){const title=n.querySelector('title')?.textContent?.trim(),link=n.querySelector('link')?.textContent?.trim(),date=n.querySelector('pubDate')?.textContent?.trim(),desc=n.querySelector('description')?.textContent?.replace(/<[^>]*>/g,'').trim();if(title&&link)items.push({name,title,link,date,desc})}}catch(e){}}
 items.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));el.innerHTML=items.slice(0,24).map(n=>`<div class="news-item"><div class="row sp"><span class="tag">${safe(n.name)}</span><small class="mu">${safe(n.date?new Date(n.date).toLocaleString('ru'):'')}</small></div><b><a href="${safe(n.link)}" target="_blank" rel="noopener">${safe(n.title)}</a></b>${n.desc?`<p class="mu">${safe(n.desc.slice(0,280))}</p>`:''}</div>`).join('')||'<p>RSS-парсер не получил данные. Возможно, CORS relay недоступен или источник ограничил запрос. Не подменяем новости вымышленными публикациями.</p>';}
 const oldRender3=render;render=function(){oldRender3();if(S.mod==='discover'&&cs()==='News')loadNews();if(S.mod==='data')sourceCheck()};
 // Add action handling without disturbing the original delegated click handlers.
 document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='pulse-refresh'){injectPulse();}if(b.dataset.a==='news-refresh'){loadNews();}if(b.dataset.a==='sources-refresh'){sourceCheck();}});
 // Keep Discover table and watchlist refreshed from current public Binance spot ticker data.

 // Section-specific improvements: honest source status, useful live panels, and clear demo boundaries.
 const oldDC=dc;dc=function(){return`<h1>Data Center</h1><div class="mktgrid">${metricCard('Binance Spot','Public REST','Ticker · 24h volume · klines')}${metricCard('Binance Futures','Public REST','Funding · OI · long/short')}${metricCard('TradingView','Embedded','Charts / screener widgets')}${metricCard('CoinGlass','External / API key','Liquidation heatmap')}</div><div class="gr"><section class="c"><h3>Проверка источников</h3><div id="mavora-source-status"><div class="signalrow"><span>Binance Spot REST</span><span class="pulse-badge">Проверка…</span></div><div class="signalrow"><span>Binance Futures REST</span><span class="pulse-badge">Проверка…</span></div><div class="signalrow"><span>TradingView embed</span><span class="pulse-badge">Загружается в графиках</span></div><div class="signalrow"><span>RSS headlines</span><span class="pulse-badge">При открытии Discover → News</span></div></div><button class="b s" data-a="sources-refresh">Проверить соединение</button><p class="source-note">Публичные REST endpoints не требуют ключа для рыночных данных, но имеют rate limits. Приватные балансы и live execution требуют backend и API credentials.</p></section><section class="c"><h3>Event log</h3>${(S.log||[]).slice(0,30).map(l=>`<div class="r2 mu">${safe(l)}</div>`).join('')||emp('Лог пуст')}<p class="source-note">Ошибки загрузки и пользовательские события записываются локально.</p></section></div><section class="c" style="margin-top:14px"><h3>Документация источников</h3><div class="row"><a class="source-link" href="https://developers.binance.com/docs/binance-spot-api-docs" target="_blank" rel="noopener">Binance Spot API ↗</a><a class="source-link" href="https://developers.binance.com/docs/derivatives/usds-margined-futures/market-data/rest-api" target="_blank" rel="noopener">Binance Futures API ↗</a><a class="source-link" href="https://www.tradingview.com/widget-docs/" target="_blank" rel="noopener">TradingView Widgets ↗</a><a class="source-link" href="https://docs.coinglass.com/" target="_blank" rel="noopener">CoinGlass API ↗</a></div></section>`};
 async function sourceCheck(){const el=$id('mavora-source-status');if(!el)return;const checks=[['Binance Spot REST',API+'/ping'],['Binance Futures REST',FAPI+'/ping']];el.innerHTML='';for(const [name,url] of checks){const start=performance.now();try{const r=await fetch(url,{cache:'no-store'});el.insertAdjacentHTML('beforeend',`<div class="signalrow"><span>${safe(name)}</span><span class="tag ${r.ok?'up':'dn'}">${r.ok?'CONNECTED · '+Math.round(performance.now()-start)+' ms':'HTTP '+r.status}</span></div>`)}catch(e){el.insertAdjacentHTML('beforeend',`<div class="signalrow"><span>${safe(name)}</span><span class="tag dn">OFFLINE / CORS</span></div>`)}}}
 const oldPort=port;port=function(){const eqv=eq(),closed=(S.journal||[]).filter(t=>t.status==='Closed'),net=closed.reduce((a,t)=>a+(typeof jcalc==='function'?jcalc(t):0),0),wins=closed.filter(t=>typeof jcalc==='function'&&jcalc(t)>0).length,exposure=(S.pos||[]).reduce((a,x)=>a+x.q*P(x.s),0);return`<h1>Portfolio · PAPER</h1><div class="mktgrid">${metricCard('Equity', '$'+f(eqv),'Симуляционный счёт')}${metricCard('Realized PnL','$'+f(net),'По закрытым записям Trade Journal',net>=0?'up':'dn')}${metricCard('Win rate',closed.length?(wins/closed.length*100).toFixed(1)+'%':'—','Trade Journal')}${metricCard('PAPER exposure','$'+f(exposure),'Номинальная экспозиция открытых позиций')}</div><div class="gr"><div class="c"><h3>Риск-контроль</h3><div class="signalrow"><span>Позиции PAPER</span><b>${(S.pos||[]).length}</b></div><div class="signalrow"><span>Экспозиция / equity</span><b>${eqv?fmt(exposure/eqv*100,1)+'%':'—'}</b></div><div class="signalrow"><span>Правило</span><b>Риск задаётся SL и размером позиции</b></div><p class="source-note">PAPER и записи журнала — локальные данные, не баланс биржи. Текущая версия не подключена к реальному исполнению ордеров.</p></div><div class="c"><h3>Открытые PAPER-позиции</h3>${(S.pos||[]).map(x=>`<div class="signalrow"><span>${safe(x.side)} ${safe(x.s)} · ${fmt(x.q,6)}</span><b class="${cl(pnl(x))}">${f(pnl(x))}</b></div>`).join('')||emp('Открытых PAPER-позиций нет')}<button class="b s" data-a="nav" data-m="terminal">Перейти в Terminal</button></div></div><div class="c" style="margin-top:14px"><h3>Trade Journal</h3><div class="row"><span class="tag">${closed.length} закрытых</span><span class="tag">${(S.journal||[]).filter(t=>t.status==='Open').length} открытых</span><button class="b s w" data-a="sbt" data-t="Journal">Открыть журнал</button></div></div>`};
 const oldAI=ai;ai=function(){return oldAI()+`<div class="c" style="margin-top:14px"><h3>AI Pipeline · фактический статус</h3><p>Текущие агенты MAVORA выполняют локальные технические расчёты и последовательность правил. Это не подключённая LLM, не автономная multi-agent orchestration и не исполнитель биржевых ордеров.</p><div class="row"><span class="tag">Candles / indicators</span><span class="tag">Rule-based analysis</span><span class="tag">Paper-only</span></div><p class="source-note">В результатах анализа должны показываться тикер, таймфрейм, время данных и состояние источника. Если данные недоступны — вывод не генерируется из случайных цен.</p></div>`};

 // Explicit app state indicator and user data backup actions in Settings.
 const oldSett=sett;sett=function(){return oldSett()+`<div class="c" style="margin-top:14px"><h3>Автосохранение</h3><div class="row"><span class="tag up">LOCAL · автоматически</span><span class="source-note">Сохраняются настройки, заметки, watchlist, журнал сделок, позиции PAPER, курсы и пользовательские записи в localStorage браузера.</span><button class="b s" data-a="save-now">Сохранить сейчас</button><button class="b s" data-a="backup-json">Скачать резервную копию</button><button class="b s" data-a="restore-json">Восстановить из JSON</button><input id="mavora-restore-file" type="file" accept="application/json,.json" hidden></div><p class="source-note">Импорт заменит текущее локальное состояние данными выбранной копии. Перед импортом рекомендуется скачать свежий бэкап.</p></div>`};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='save-now'){saveNow();note('Данные сохранены локально');}if(b.dataset.a==='backup-json'){saveNow();const blob=new Blob([JSON.stringify({format:'MAVORA_BACKUP',version:1,exportedAt:new Date().toISOString(),state:S},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MAVORA-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(b.dataset.a==='restore-json')$id('mavora-restore-file')?.click()});
 document.addEventListener('change',async e=>{if(e.target.id!=='mavora-restore-file'||!e.target.files?.[0])return;const file=e.target.files[0];try{const backup=JSON.parse(await file.text()),state=backup?.state;if(!state||typeof state!=='object'||Array.isArray(state))throw new Error('Неверный формат резервной копии');if(!confirm('Восстановить MAVORA из выбранной копии? Текущее состояние будет заменено.'))return;S=Object.assign(JSON.parse(JSON.stringify(D)),state);sv();saveNow();note('Резервная копия восстановлена');render();}catch(err){alert('Не удалось восстановить копию: '+(err.message||'ошибка чтения файла'))}finally{e.target.value=''}});

 function rsi(a,n=14){if(a.length<n+1)return null;let g=0,l=0;for(let i=1;i<=n;i++){let d=a[i]-a[i-1];g+=Math.max(0,d);l+=Math.max(0,-d)}g/=n;l/=n;for(let i=n+1;i<a.length;i++){let d=a[i]-a[i-1];g=(g*(n-1)+Math.max(0,d))/n;l=(l*(n-1)+Math.max(0,-d))/n}return l===0?100:100-100/(1+g/l)}

 async function loadRegime(){const s=sym(),pairs=[['1D','1d'],['4H','4h'],['1H','1h'],['15m','15m']];const out=await Promise.all(pairs.map(async([name,tf])=>{const c=await klines(s,tf,160),cl=c.map(x=>x.c),last=cl.at(-1),e20=ema(cl.slice(-100),20),e50=ema(cl.slice(-120),50),e200=ema(cl,200),rr=rsi(cl),aa=atr(c);let trend=last>e20&&e20>e50?'BULLISH':last<e20&&e20<e50?'BEARISH':'RANGE / MIXED';return{name,tf,last,e20,e50,e200,rsi:rr,atr:aa,trend,change:c.length?(last/c.at(-2).c-1)*100:null}}));const bull=out.filter(x=>x.trend==='BULLISH').length,bear=out.filter(x=>x.trend==='BEARISH').length;const consensus=bull>=3?'Преимущество покупателей':bear>=3?'Преимущество продавцов':'Смешанный режим — снижать агрессию';$('pro-regime').innerHTML=card('1 · Multi-timeframe Market Regime',`<div class="pro-metrics">${metric('Согласование ТФ',bull>=3?'LONG bias':bear>=3?'SHORT bias':'MIXED',bull+' bullish · '+bear+' bearish')}${metric('Сценарий',consensus,'EMA20 / EMA50')}${metric('Актив',s,'Binance USDⓈ-M candles')}</div>${table(['ТФ','Тренд','RSI 14','ATR','Изм. свечи'],out.map(x=>[x.name,badge(x.trend,x.trend==='BULLISH'?'live':x.trend==='BEARISH'?'err':'warn'),fmt(x.rsi,1),fmt(x.atr,4),sign(x.change)]))}`, 'Сигнал тренда строится по EMA20/50 и RSI. Это фильтр режима, не команда входа.');return out}

 async function loadLevels(){const s=sym(),c=await klines(s,'4h',160),last=c.at(-1).c,prev=c.slice(-80,-1),day=await klines(s,'1d',3),pivot=[];for(let i=2;i<c.length-2;i++){if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h)pivot.push({p:c[i].h,type:'R',t:c[i].t});if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l)pivot.push({p:c[i].l,type:'S',t:c[i].t})}function clusters(type){const sorted=pivot.filter(x=>x.type===type&&(type==='R'?x.p>last:x.p<last)).sort((a,b)=>type==='R'?a.p-b.p:b.p-a.p),res=[];for(const x of sorted){const found=res.find(z=>Math.abs(z.price-x.p)/x.p<.0025);if(found){found.count++;found.price=(found.price*(found.count-1)+x.p)/found.count}else res.push({price:x.p,count:1,time:x.t})}return res.slice(0,5)}const sup=clusters('S'),res=clusters('R'),d=day[0];$('pro-levels').innerHTML=card('3 · Market Structure, Swing Levels & Range',`<div class="pro-metrics">${metric('Цена',fmt(last,last<1?6:2),s)}${metric('Вчера High',fmt(d.h,d.h<1?6:2),'Daily candle')}${metric('Вчера Low',fmt(d.l,d.l<1?6:2),'Daily candle')}</div><div class="pro-grid"><div><h4 class="up">Поддержка · 4H pivots</h4>${sup.map(x=>`<div class="pro-zone"><span>${fmt(x.price,2)} ${x.count>1?badge('cluster '+x.count):''}</span><b>${fmt((last-x.price)/last*100,2)}%</b></div>`).join('')||'Нет подтверждённых зон'}</div><div><h4 class="dn">Сопротивление · 4H pivots</h4>${res.map(x=>`<div class="pro-zone"><span>${fmt(x.price,2)} ${x.count>1?badge('cluster '+x.count):''}</span><b>${fmt((x.price-last)/last*100,2)}%</b></div>`).join('')||'Нет подтверждённых зон'}</div></div>`,'Pivot levels — алгоритмические зоны из свечей, а не гарантированные уровни. Подтверждай их объёмом и реакцией цены.')}

 async function loadDeriv(){const s=sym(),[p,oi,ls,taker]=await Promise.all([get(FUT+'/premiumIndex?symbol='+s,18000),get(FUT+'/openInterest?symbol='+s,18000),get(FD+'/globalLongShortAccountRatio?symbol='+s+'&period=1h&limit=1',45000).catch(()=>null),get(FD+'/ takerlongshortRatio'.replace(' ', '')+'?symbol='+s+'&period=1h&limit=1',45000).catch(()=>null)]);const funding=+p.lastFundingRate,rate=ls?.[0]?.longShortRatio,oiVal=+oi.openInterest;let prev=cache.get(FUT+'/openInterest?symbol='+s);$('pro-deriv').innerHTML=card('5 · Futures Positioning & Carry',`<div class="pro-metrics">${metric('Funding',sign(funding*100), 'Binance · next '+(p.nextFundingTime?new Date(p.nextFundingTime).toLocaleTimeString('ru'):'—'),funding>0?'dn':'up')}${metric('Open Interest',fmt(oiVal,2)+' '+s.replace('USDT',''),'Contracts / current')}${metric('Long / Short',rate?fmt(rate,3)+' : 1':'—','Global accounts · 1h')}${metric('Taker buy/sell',taker?.[0]?fmt(+taker[0].buySellRatio,3):'—','1h ratio')}${metric('Mark price',fmt(+p.markPrice,2),'Index '+fmt(+p.indexPrice,2))}${metric('Next funding',p.nextFundingTime?new Date(p.nextFundingTime).toLocaleTimeString('ru'):'—','UTC/local browser')}</div>`,'OI — абсолютный показатель контракта; для оценки роста/снижения OI нужна история. Funding не означает, что рынок обязательно пойдёт против переполненной стороны.')}
 async function loadLiquid(){const base=sym().replace('USDT','');let depth=null;try{depth=await get(FUT+'/depth?symbol='+sym()+'&limit=100',10000)}catch(e){}const bids=(depth?.bids||[]).slice(0,20),asks=(depth?.asks||[]).slice(0,20),bidUsd=bids.reduce((a,x)=>a+(+x[0])*(+x[1]),0),askUsd=asks.reduce((a,x)=>a+(+x[0])*(+x[1]),0),imb=bidUsd+askUsd?(bidUsd-askUsd)/(bidUsd+askUsd)*100:null;const book=depth?`<div class="pro-metrics">${metric('Bid depth · top 20','$'+fmt(bidUsd,0),'notional')}${metric('Ask depth · top 20','$'+fmt(askUsd,0),'notional')}${metric('Depth imbalance',imb===null?'—':sign(imb),'snapshot',imb>0?'up':'dn')}</div><div class="pro-grid"><div><h4 class="up">Top bids</h4>${bids.slice(0,8).map(x=>`<div class="pro-zone"><span>${fmt(+x[0],2)}</span><b>${fmt(+x[1],4)}</b></div>`).join('')}</div><div><h4 class="dn">Top asks</h4>${asks.slice(0,8).map(x=>`<div class="pro-zone"><span>${fmt(+x[0],2)}</span><b>${fmt(+x[1],4)}</b></div>`).join('')}</div></div>`:'<p class="pro-error">Order book недоступен. Значения не подставлены.</p>'; $('pro-liquid').innerHTML=card('6 · Live Order Book & Liquidation Risk',`${book}<div class="pro-grid" style="margin-top:12px"><div><h4>Карта ликвидаций</h4><p>Модельные кластеры и тепловая карта требуют отдельного провайдера/лицензии. MAVORA не рисует карту из случайных данных.</p><a class="pro-btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://www.coinglass.com/pro/futures/LiquidationMap?symbol=${encodeURIComponent(base)}">Открыть CoinGlass map ↗</a></div><div><h4>Risk checklist</h4><p>Сверь ближайшие swing-зоны, стоп, размер позиции, funding, глубину книги и возможный slippage.</p><a class="pro-btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://www.coinglass.com/LiquidationData">Liquidation data ↗</a></div></div>`,'Binance depth — моментальный снимок одной площадки; видимые лимитные заявки могут отменяться. Это не гарантированная поддерж async function ensureTop100(force){
  const now = Date.now();
  if (!force && window.__MKT_TOP.length >= 80 && now - window.__MKT_TOP_AT < 45000) return window.__MKT_TOP;
  try {
    const r = await fetch('https://api.binance.com/api/v3/ticker/24hr', {cache:'no-store'});

    const STB = /^(USDC|FDUSD|TUSD|USDP|DAI|BUSD|EUR|EURI|USD1|AEUR|XUSD|PAXG|WBTC|USDT)$/;

    window.__MKT_TOP_AT = now;

    try {
      if (typeof TOP !== 'undefined') { TOP.length = 0; TOP.push(...window.__MKT_TOP); }
      if (typeof ALL !== 'undefined') { ALL.length = 0; ALL.push(...rows); }
    } catch(e) {}
    return window.__MKT_TOP;
  } catch(e) {
    if (window.__MKT_TOP.length) return window.__MKT_TOP;
    if (typeof TOP !== 'undefined' && TOP.length) return TOP;
    return [];
  }
}

  if (window.__MKT_TOP && window.__MKT_TOP.length) return window.__MKT_TOP;

}

function breadth(rows){if(!rows.length)return null;const n=rows.length,up=rows.filter(x=>+x.ch>0).length,down=rows.filter(x=>+x.ch<0).length,sUp=rows.filter(x=>+x.ch>=5).length,sDn=rows.filter(x=>+x.ch<=-5).length,avg=rows.reduce((a,x)=>a+(+x.ch||0),0)/n,vol=rows.reduce((a,x)=>a+(+x.v||0),0);return {n,up,down,flat:n-up-down,sUp,sDn,avg,vol,upPct:up/n*100,downPct:down/n*100};}

async function loadCore(force=false){
  const now=Date.now();if(!force&&S.mktData.global&&now-(S.mktData.t||0)<75000)return S.mkt;
  const [global,fng,btcK,ethK]=await Promise.all([jget('https://api.coingecko.com/api/v3/global'),jget('https://api.alternative.me/fng/?limit=1'),jget('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=30'),jget('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1d&limit=30')]);
  const atrOf=rows=>{if(!Array.isArray(rows)||rows.length<15)return null;const tr=[];for(let i=1;i<rows.length;i++){const h=+rows[i][2],l=+rows[i][3],pc=+rows[i-1][4];tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}const atr=tr.slice(-14).reduce((a,b)=>a+b,0)/14,last=+rows[rows.length-1][4];return {atr,atrPct:last?atr/last*100:null,last,ch7:rows[rows.length-8]?(last/+rows[rows.length-8][4]-1)*100:null,ch30:rows[0]?(last/+rows[0][4]-1)*100:null};};
  S.mktData={t:now,global:global?.data||null,fng:fng?.data?.[0]||null,btc:atrOf(btcK),eth:atrOf(ethK),majors:S.mktData.majors};try{sv();}catch(e){}return S.mktData;
}

async function renderAssetLab(sym){

  const ema=(a,n)=>{if(!a.length)return null;let e=a[0],k=2/(n+1);for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e;};
  const rsi=(a,n=14)=>{if(a.length<n+1)return null;let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];g+=Math.max(0,d);l+=Math.max(0,-d);}g/=n;l/=n;for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+Math.max(0,d))/n;l=(l*(n-1)+Math.max(0,-d))/n;}return l===0?100:100-100/(1+g/l);};

      let tr=0,n=Math.min(14,c.length-1);for(let i=c.length-n;i<c.length;i++){const prev=c[i-1]?.c??c[i].c;tr+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-prev),Math.abs(c[i].l-prev));}

      for(let i=2;i<c.length-2;i++){if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h)pivH.push(c[i].h);if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l)pivL.push(c[i].l);}
      return {tf,last,e20,e50,rsi:rsi(closes),atr,trend,res:pivH.filter(v=>v>last).sort((a,b)=>a-b).slice(0,2),sup:pivL.filter(v=>v<last).sort((a,b)=>b-a).slice(0,2),hi:Math.max(...c.slice(-20).map(x=>x.h)),lo:Math.min(...c.slice(-20).map(x=>x.l))};

    const funding=pm?+pm.lastFundingRate*100:null,ok=tfs.filter(x=>!x.err);
    const biasScore=ok.reduce((a,x)=>a+(x.trend==='BULLISH'?1:x.trend==='BEARISH'?-1:0),0);
    const bias=biasScore>=2?'Bullish bias':biasScore<=-2?'Bearish bias':'Mixed / range',t4=ok.find(x=>x.tf==='4h')||ok[0];
    body.innerHTML=`<div class="row sp" style="margin-bottom:10px"><div class="row" style="gap:10px;align-items:center">${coinIcon(s,32)}<b style="font-size:24px">${safe(s)}</b><span class="tag">${safe(bias)}</span></div><div class="mu">Futures · ${ts()}</div></div>
<div class="mktgrid">${metric('Last',t4?fmtN(t4.last,t4.last<1?5:2):'—','4H')}${metric('Funding',funding!=null?signPct(funding):'—','Perp',funding>0.05?'dn':funding<-0.05?'up':'')}${metric('OI',oi?fmtN(+oi.openInterest,0):'—','Contracts')}${metric('4H ATR %',t4?.atr!=null?fmtN(t4.atr,2)+'%':'—','Vol')}</div>

/* TradingView — robust mount */
function mountTV(el,name,cfg){
  if(!el)return;
  el.innerHTML='';el.className='tradingview-widget-container';
  const wrap=document.createElement('div');wrap.className='tradingview-widget-container__widget';wrap.style.cssText='height:100%;width:100%';el.appendChild(wrap);
  const s=document.createElement('script');
  s.src='https://s3.tradingview.com/external-embedding/embed-widget-'+name+'.js';
  s.type='text/javascript';s.async=true;s.textContent=JSON.stringify(cfg);
  s.onerror=()=>{showTVFallback(el);};
  el.appendChild(s);
  setTimeout(()=>{if(!el.querySelector('iframe')) showTVFallback(el);},5000);
}
function showTVFallback(el){
  if(el.dataset.fb)return;el.dataset.fb='1';
  const sym=(S.sel||'BTC').toUpperCase().replace(/USDT$/,'')+'USDT';
  el.innerHTML=`<div style="padding:20px"><h3>TradingView widget unavailable</h3>

<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:12px">
<a class="b w" target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=BINANCE%3A${safe(sym)}">Open chart ${safe(sym)} ↗</a>
<a class="b s" target="_blank" rel="noopener" href="https://www.tradingview.com/symbols/BINANCE-${safe(sym)}/">Symbol page ↗</a>
<a class="b s" target="_blank" rel="noopener" href="https://www.tradingview.com/screener/crypto/">Crypto screener ↗</a>
</div></div>`;
}

<style id="mavora-sky-v2-css">
/* Compact clocks — never cover the sky art */
.hero{align-items:center; min-height:200px}
.hero-sky{right:clamp(8px,3vw,48px); width:min(34%,420px); min-width:150px; top:0; bottom:auto; height:100%}
.sky-stage{display:grid; place-items:center; width:100%; height:100%}
.sky-icon-wrap{position:relative; width:min(150px,28vw); height:min(150px,28vw); transform-style:preserve-3d; transition:transform .3s ease}
.sky-icon{position:absolute; inset:0; opacity:0; transform:scale(.92) translateZ(-12px); transition:opacity .55s ease, transform .55s ease; pointer-events:none; filter:drop-shadow(0 18px 28px rgba(0,0,0,.65))}
.sky-icon svg{width:100%; height:100%; display:block; overflow:visible}
.hero-sky[data-phase="dawn"] .sky-icon.dawn,
.hero-sky[data-phase="day"] .sky-icon.day,
.hero-sky[data-phase="sunset"] .sky-icon.sunset,
.hero-sky[data-phase="night"] .sky-icon.night{opacity:1; transform:scale(1) translateZ(24px)}
/* hide old decorative layers */
.sky-orbit,.sky-body,.sky-cloud,.sky-stars,.sky-haze{display:none!important}
.sky-caption{display:none!important}

/* Thin session strip under hero copy, full width of hero — not on top of icon */
.session-bar{
  position:relative; z-index:5; width:100%; flex:0 0 100%; order:3;
  display:flex; gap:6px; flex-wrap:nowrap; margin-top:10px; padding-top:0;
  border:0; background:transparent;
}
.session-chip{
  flex:1; min-width:0; background:rgba(12,12,12,.85); border:1px solid #252525;
  border-radius:10px; padding:6px 10px; backdrop-filter:blur(8px);
}
.session-chip small{display:block; color:#7a7a7a; font-size:9px; letter-spacing:.08em; text-transform:uppercase; line-height:1.2}
.session-chip b{display:block; font-size:13px; margin-top:2px; font-variant-numeric:tabular-nums; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.session-chip .sub{display:block; color:#666; font-size:10px; margin-top:1px; font-weight:400; text-transform:none; letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.session-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; background:#3a3a3a; vertical-align:middle}
.session-dot.live{background:#62d394; box-shadow:0 0 8px #62d39499}

@media(max-width:650px){
  .hero{min-height:168px}
  .hero-sky{width:36%; min-width:100px}
  .sky-icon-wrap{width:88px; height:88px}
  .session-bar{gap:4px}
  .session-chip{padding:5px 7px; border-radius:8px}
  .session-chip small{font-size:8px}
  .session-chip b{font-size:11px}
  .session-chip .sub{display:none}
}
</style>

function moscowPhase(){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const h = +(parts.find(x=>x.type==='hour')?.value||0);
  const m = +(parts.find(x=>x.type==='minute')?.value||0);
  const t = h + m/60;
  if (t >= 5.5 && t < 8) return 'dawn';
  if (t >= 8 && t < 17) return 'day';
  if (t >= 17 && t < 20.5) return 'sunset';
  return 'night';
}

function fmtTZ(tz){
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date());
}
function hourIn(tz){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  return +(parts.find(x=>x.type==='hour')?.value||0);
}
function sessionInfo(){
  const utcH = hourIn('UTC');
  const tokyo = utcH >= 0 && utcH < 9;
  const london = utcH >= 7 && utcH < 16;
  const ny = utcH >= 13 && utcH < 22;
  let name = 'Asia / Quiet';
  if (london && ny) name = 'London–NY';
  else if (ny) name = 'New York';
  else if (london) name = 'London';
  else if (tokyo) name = 'Tokyo / Asia';
  const bits = [];
  if (tokyo) bits.push('TKO');
  if (london) bits.push('LDN');
  if (ny) bits.push('NY');
  if (!bits.length) bits.push('Crypto 24/7');
  return {name, open: bits.join(' · '), active: tokyo||london||ny};
}

function sessionBarHTML(){
  const s = sessionInfo();
  return `<div class="session-bar" id="sessionBar">
    <div class="session-chip"><small>MSK</small><b id="clk-msk">${fmtTZ('Europe/Moscow')}</b></div>
    <div class="session-chip"><small>New York</small><b id="clk-ny">${fmtTZ('America/New_York')}</b></div>
    <div class="session-chip"><small>Session</small><b id="clk-sess"><span class="session-dot ${s.active?'live':''}"></span>${s.name}</b><span class="sub" id="clk-sess-sub">${s.open}</span></div>
  </div>`;
}

function syncClocks(){
  const msk = document.getElementById('clk-msk');
  const ny = document.getElementById('clk-ny');
  const sess = document.getElementById('clk-sess');
  const sub = document.getElementById('clk-sess-sub');
  if (msk) msk.textContent = fmtTZ('Europe/Moscow');
  if (ny) ny.textContent = fmtTZ('America/New_York');
  if (sess) {
    const s = sessionInfo();
    sess.innerHTML = `<span class="session-dot ${s.active?'live':''}"></span>${s.name}`;
    if (sub) sub.textContent = s.open;
  }
}

function syncHeroSky(){
  /* static logo — no day/night phase */
  const el=document.getElementById('heroSky');
  if(!el)return;
  el.dataset.phase='logo';
}

function injectSessionBar(){
  if (S.mod !== 'home') return;
  const hero = document.querySelector('#pg .hero');
  if (!hero) return;
  // ensure flex column-ish for bar at bottom of hero
  hero.style.flexWrap = 'wrap';
  if (!document.getElementById('sessionBar')) {
    hero.insertAdjacentHTML('beforeend', sessionBarHTML());
  } else syncClocks();
}

window.skyScene = skyScene;

const _r = render;
render = function(){
  _r();
  if (S.mod === 'home') {
    const sky = document.getElementById('heroSky');
    if (sky && !sky.querySelector('.sky-icon-wrap')) sky.outerHTML = skyScene();
    syncHeroSky();
    injectSessionBar();
  }
};

setInterval(() => { syncHeroSky(); syncClocks(); }, 1000);
setTimeout(() => { syncHeroSky(); injectSessionBar(); }, 80);
})();
</script>


<style id="mavora-account-v2-css">
.acc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}

.acc-table{width:100%;border-collapse:collapse;font-size:12px}

.acc-pill.on{background:#fff;color:#000;border-color:#fff}
.acc-privacy .acc-blur{filter:blur(7px);user-select:none}
@media(max-width:900px){.acc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

const money = (n, d=2) => Number.isFinite(+n) ? ((+n < 0 ? '-' : '') + '$' + Math.abs(+n).toLocaleString('en-US', {maximumFractionDigits: d})) : '—';
const pct = n => Number.isFinite(+n) ? ((+n >= 0 ? '+' : '') + (+n).toFixed(2) + '%') : '—';
const cls = n => +n > 0 ? 'up' : +n < 0 ? 'dn' : 'mu';
const nd = 'Insufficient data';

// Tabs per ТЗ — keep Journal, drop profile/security/API; Positions via links only

S.accUI = S.accUI || {period: '30D', chartMode: 'equity', privacy: 0, from: '', to: ''};

function jClosed() {
  return (S.journal || []).filter(t => t.status === 'Closed' && +t.entry > 0 && +t.qty > 0);
}
function jPnL(t) {
  if (typeof jcalc === 'function') return jcalc(t);
  const dir = t.side === 'Long' ? 1 : -1;
  return ((+t.exit || 0) - (+t.entry || 0)) * (+t.qty || 0) * dir - (+t.fees || 0);
}
function jDate(t) {
  const d = (t.date || t.created || '').toString();
  const x = Date.parse(d);
  return Number.isFinite(x) ? x : 0;
}
function periodStart(key) {
  const now = Date.now();
  const day = 86400000;
  if (key === 'Today') { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  if (key === '7D') return now - 7 * day;
  if (key === '30D') return now - 30 * day;
  if (key === '90D') return now - 90 * day;
  if (key === '1Y') return now - 365 * day;
  if (key === 'Custom' && S.accUI.from) return Date.parse(S.accUI.from) || 0;
  return 0; // All
}
function periodEnd(key) {
  if (key === 'Custom' && S.accUI.to) return Date.parse(S.accUI.to) || Date.now();
  return Date.now();
}
function tradesInPeriod(key) {
  const a = periodStart(key), b = periodEnd(key);
  return jClosed().filter(t => {
    const x = jDate(t);
    if (!x) return key === 'All';
    return x >= a && x <= b;
  }).sort((x, y) => jDate(x) - jDate(y));
}
function paperEquity() {
  if (typeof eq === 'function') { try { return +eq(); } catch(e) {} }
  const bal = +(S.bal ?? 10000);
  return bal + (S.pos || []).reduce((s, x) => s + (typeof pnl === 'function' ? (+pnl(x)||0) : 0), 0);
}
function walletBalance() { return +(S.bal ?? 10000); }
function unrealized() {
  return (S.pos || []).reduce((s, x) => s + (typeof pnl === 'function' ? pnl(x) : 0), 0);
}
function realizedAll() {
  return jClosed().reduce((s, t) => s + jPnL(t), 0);
}
function feesSum(tr) { return tr.reduce((s, t) => s + (+t.fees || 0), 0); }

function stats(tr) {
  if (!tr.length) return null;
  const pnls = tr.map(jPnL);
  const wins = pnls.filter(x => x > 0);
  const loss = pnls.filter(x => x < 0);
  const grossW = wins.reduce((a, b) => a + b, 0);
  const grossL = Math.abs(loss.reduce((a, b) => a + b, 0));
  const net = pnls.reduce((a, b) => a + b, 0);
  const rs = tr.filter(t => +t.risk > 0).map(t => jPnL(t) / +t.risk);
  let eq = 0, peak = 0, maxDD = 0, curDD = 0;
  pnls.forEach(p => { eq += p; peak = Math.max(peak, eq); maxDD = Math.max(maxDD, peak - eq); curDD = peak - eq; });
  let streak = 0, maxStreak = 0, curStreak = 0;
  pnls.forEach(p => {
    if (p < 0) { curStreak++; maxStreak = Math.max(maxStreak, curStreak); }
    else curStreak = 0;
  });
  streak = curStreak;
  return {
    n: tr.length,
    wins: wins.length,
    loss: loss.length,
    winRate: wins.length / tr.length * 100,
    pf: grossL ? grossW / grossL : (grossW ? Infinity : null),
    expect: net / tr.length,
    avgWin: wins.length ? grossW / wins.length : null,
    avgLoss: loss.length ? -grossL / loss.length : null,
    avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null,
    net,
    maxDD,
    curDD,
    peak,
    best: Math.max(...pnls),
    worst: Math.min(...pnls),
    fees: feesSum(tr),
    maxStreak,
    streak,
    pnls
  };
}

function groupBy(tr, keyFn) {
  const g = {};
  tr.forEach(t => {
    const k = keyFn(t) || '—';
    (g[k] = g[k] || []).push(t);
  });
  return Object.entries(g).map(([k, arr]) => {
    const s = stats(arr);
    return {k, n: arr.length, net: s?.net ?? 0, wr: s?.winRate ?? null, pf: s?.pf ?? null, avgR: s?.avgR ?? null};
  }).sort((a, b) => b.net - a.net);
}

function equitySeries(tr, startBal) {
  let eq = startBal;
  const pts = [{t: 0, v: eq, label: 'start'}];
  tr.forEach((t, i) => {
    eq += jPnL(t);
    pts.push({t: i + 1, v: eq, label: (t.symbol || '') + ' ' + (t.date || '').slice(0, 10)});
  });
  return pts;
}

function chartSVG(pts, mode) {
  if (!pts || pts.length < 2) return `<div class="acc-empty">${nd} for equity curve</div>`;
  const vals = pts.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const w = 600, h = 160, pad = 8;
  const poly = pts.map((p, i) => {
    const x = pad + i * (w - 2 * pad) / (pts.length - 1);
    const y = h - pad - ((p.v - min) / span) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  // max DD segment annotation via peak tracking
  return `<svg class="acc-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="var(--ac,#cdb9ff)" stroke-width="2" points="${poly}"/>
  </svg>
  <div class="acc-row acc-note">
    <span>Start ${money(pts[0].v)}</span>
    <span>End ${money(pts[pts.length-1].v)}</span>
    <span class="${cls(pts[pts.length-1].v - pts[0].v)}">${money(pts[pts.length-1].v - pts[0].v)}</span>
  </div>`;
}

function periodPills(active) {
  return ['Today', '7D', '30D', '90D', '1Y', 'All'].map(p =>
    `<button class="acc-pill ${active === p ? 'on' : ''}" data-a="acc-period" data-p="${p}">${p}</button>`

}

function metricCard(title, value, hint, color) {
  const blur = S.accUI.privacy ? 'acc-blur' : '';
  return `<div class="acc-metric"><small>${title}</small><strong class="${blur} ${color || ''}">${value}</strong><span class="hint">${hint || ''}</span></div>`;
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], {type: mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportCSV() {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const head = ['date', 'symbol', 'side', 'entry', 'exit', 'qty', 'fees', 'strategy', 'risk', 'pnl', 'status'];
  const lines = [head.join(',')];
  tr.forEach(t => {
    lines.push([t.date, t.symbol, t.side, t.entry, t.exit, t.qty, t.fees, t.strategy, t.risk, jPnL(t), t.status]
      .map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(','));
  });
  downloadText('MAVORA-journal-' + per + '.csv', lines.join('\n'), 'text/csv');
  if (typeof note === 'function') note('Report CSV exported (' + tr.length + ' trades)');
}

function exportJSON() {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const st = stats(tr);
  const payload = {
    format: 'MAVORA_ACCOUNT_REPORT', version: 1, period: per, exportedAt: new Date().toISOString(),
    summary: st, trades: tr
  };
  downloadText('MAVORA-report-' + per + '.json', JSON.stringify(payload, null, 2), 'application/json');
  if (typeof note === 'function') note('Report JSON exported');
}

function exportSummary() {
  const per = S.accUI.period || '30D';
  const st = stats(tradesInPeriod(per));
  const text = st
    ? `MAVORA Account ${per}\nTrades: ${st.n}\nNet: ${money(st.net)}\nWin rate: ${st.winRate.toFixed(1)}%\nPF: ${st.pf == null ? '—' : st.pf === Infinity ? '∞' : st.pf.toFixed(2)}\nMax DD: ${money(-st.maxDD)}\nFees: ${money(st.fees)}`
    : `MAVORA Account ${per}\nInsufficient data`;
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text);
  if (typeof note === 'function') note('Summary copied');
  else alert(text);

function calcPB(){
  const bal = +($id('pb-bal')?.value || 0);
  const rp = +($id('pb-rp')?.value || 0);
  const en = +($id('pb-en')?.value || 0);
  const st = +($id('pb-st')?.value || 0);
  const tp = +($id('pb-tp')?.value || 0);
  const lev = Math.max(1, +($id('pb-lv')?.value || 1));
  const fee = +($id('pb-fee')?.value || 0) / 100;
  const slip = +($id('pb-sl')?.value || 0) / 100;
  S.pb.risk = {bal, riskPct: rp, entry: en, stop: st, target: tp, lev, fee: fee*100, slip: slip*100};
  try { sv(); } catch(e) {}
  const box = $id('pb-res');
  if (!box) return;
  if (!(bal > 0 && rp > 0 && en > 0 && st > 0) || en === st) {
    box.innerHTML = '<span class="pb-no">Need valid equity, risk %, entry and stop.</span>';
    return;
  }
  const risk$ = bal * (rp / 100);
  const dist = Math.abs(en - st);
  const qty = risk$ / dist;
  const notional = qty * en;
  const margin = notional / lev;
  // crude liq estimate for isolated linear: entry * (1 - 1/lev) for long
  const long = en > st;
  const liq = long ? en * (1 - 1 / lev) : en * (1 + 1 / lev);
  const feeCost = notional * fee * 2;
  const slipCost = notional * slip;
  const rr = tp > 0 ? Math.abs(tp - en) / dist : null;
  const netRisk = risk$ + feeCost * (risk$ / (notional || 1)) ; // rough
  box.innerHTML = `
    <div><b>Cash risk</b>: ${money(risk$)} (${rp}% of equity)</div>
    <div><b>Stop distance</b>: ${dist.toPrecision(6)}</div>
    <div><b>Position size</b>: ${qty.toPrecision(6)} units · notional ${money(notional)}</div>
    <div><b>Margin @ ${lev}x</b>: ${money(margin)}</div>
    <div><b>Approx. liq (naive)</b>: ${liq.toPrecision(6)} · verify on venue</div>
    <div><b>Fees (RT est.)</b>: ${money(feeCost)} · slip est. ${money(slipCost)}</div>
    ${rr != null ? `<div><b>R:R to target</b>: ${rr.toFixed(2)}</div>` : ''}
    <div class="mu" style="margin-top:6px">Correlate with existing positions before adding risk. Daily loss limit is a process rule — set it in Journal discipline, not here.</div>`;
}
function $id(id){ return document.getElementById(id); }

  const a = b.dataset.a;

  if (a === 'pb-check') {
    S.pb.checks = S.pb.checks || {};
    S.pb.checks[b.dataset.id] = b.checked ? 1 : 0;
    try{sv()}catch(err){}
    // update style without full render if possible
    const lab = b.closest('.pb-check');
    if (lab) lab.classList.toggle('done', !!b.checked);
  }
  if (a === 'pb-calc') calcPB();
  if (a === 'pb-go') {
    S.mod = b.dataset.mod;
    S.sb = S.sb || {};
    S.sb[S.mod] = b.dataset.tab;
    if (b.dataset.tab === 'Pro Desk') S.sb.terminal = 'Pro Desk';
    try{sv()}catch(err){}
    render();
  }
  if (b.dataset.pro === '1' && a === 'nav' && b.dataset.m === 'terminal') {
    S.sb = S.sb || {}; S.sb.terminal = 'Pro Desk';
  }
});

// Persist checkbox change on change event too
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('input[data-a="pb-check"]')) {
    S.pb.checks = S.pb.checks || {};
    S.pb.checks[e.target.dataset.id] = e.target.checked ? 1 : 0;

  }
});

async function renderStructure(){
  const body = $id('tm-struct'); if(!body) return;
  const sym = (S.sel||'BTC').toUpperCase().replace(/USDT$/,'')+'USDT';
  const tfMap = {'1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'};
  const tf = tfMap[S.tf] || '1h';
  body.innerHTML = '<div class="c mu">Fetching klines…</div>';
  const rows = await jget(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=120`);
  if(!rows){
    // fallback local candles
    const local = typeof cndl==='function' ? cndl(S.sel,S.tf) : null;
    if(!local){ body.innerHTML='<div class="c mu">No data. Check network.</div>'; return; }
    body.innerHTML = structureFromLocal(local);
    return;
  }
  const c = rows.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
  body.innerHTML = structureFromBars(c, tf);
}

function ema(arr,n){ if(arr.length<n)return null; let e=arr.slice(0,n).reduce((a,b)=>a+b,0)/n; const k=2/(n+1); for(let i=n;i<arr.length;i++) e=arr[i]*k+e*(1-k); return e; }
function structureFromBars(c, tf){
  const closes=c.map(x=>x.c), last=closes.at(-1);
  const e20=ema(closes,20), e50=ema(closes,50);
  const trend = last>e20 && e20>e50 ? 'BULLISH structure bias' : last<e20 && e20<e50 ? 'BEARISH structure bias' : 'RANGE / mixed';
  let tr=0; const n=Math.min(14,c.length-1);
  for(let i=c.length-n;i<c.length;i++){ const prev=c[i-1].c; tr+=Math.max(c[i].h-c[i].l, Math.abs(c[i].h-prev), Math.abs(c[i].l-prev)); }
  const atr=tr/n, atrPct=last?atr/last*100:0;
  const pivH=[], pivL=[];
  for(let i=2;i<c.length-2;i++){
    if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h) pivH.push(c[i].h);
    if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l) pivL.push(c[i].l);
  }
  const res=pivH.filter(v=>v>last).sort((a,b)=>a-b).slice(0,3);
  const sup=pivL.filter(v=>v<last).sort((a,b)=>b-a).slice(0,3);
  // simple VWAP proxy: typical price volume weighted last 24 bars
  let pv=0, vv=0; c.slice(-24).forEach(x=>{ const tp=(x.h+x.l+x.c)/3; pv+=tp*x.v; vv+=x.v; });
  const vwap = vv?pv/vv:null;
  return `<div class="tm-grid">
    ${metric('Last', fmtN(last, last<1?5:2))}
    ${metric('Bias', trend, trend.includes('BULL')?'up':trend.includes('BEAR')?'dn':'')}
    ${metric('EMA20', fmtN(e20,4))}
    ${metric('EMA50', fmtN(e50,4))}
    ${metric('ATR14', fmtN(atr,4)+' · '+fmtN(atrPct,2)+'%')}
    ${metric('VWAP~24', vwap!=null?fmtN(vwap,4):'—', '')}
  </div>
  <div class="tm-split" style="margin-top:12px">
    <div class="c"><h3>Resistance · ${safe(tf)}</h3>
      ${res.map(v=>`<div class="r2 dn"><span>${fmtN(v,4)}</span><span>${signPct((v-last)/last*100)}</span></div>`).join('')||'<span class="mu">—</span>'}
      <p class="tm-note">Swing pivots (2-bar). Confirm with volume reaction.</p>
    </div>
    <div class="c"><h3>Support · ${safe(tf)}</h3>
      ${sup.map(v=>`<div class="r2 up"><span>${fmtN(v,4)}</span><span>${signPct((last-v)/last*100)}</span></div>`).join('')||'<span class="mu">—</span>'}
      <p class="tm-note">Invalidation often beyond structure low/high + buffer (ATR).</p>
    </div>
  </div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
    <button class="b s w" data-a="sbt" data-t="Charts">Charts</button>
    <button class="b s" data-a="sbt" data-t="Flow">Flow confirm</button>
    <button class="b s" data-a="sbt" data-t="Risk">Risk / size</button>
  </div>`;
}
function structureFromLocal(c){
  return structureFromBars(c.map(x=>({...x,v:1})), S.tf||'1h');
}

async function renderBook(){
  const body=$id('tm-book'); if(!body) return;
  const sym=(S.sel||'BTC').toUpperCase().replace(/USDT$/,'')+'USDT';
  const depth = await jget(`https://fapi.binance.com/fapi/v1/depth?symbol=${sym}&limit=15`);

    body.innerHTML=`<div class="c mu">Depth API offline. Charts tab shows simulated book.</div>
      <button class="b s" data-a="sbt" data-t="Charts">Charts book</button>`;
    return;
  }
  const bids=depth.bids||[], asks=depth.asks||[];
  const bestB=+bids[0]?.[0]||0, bestA=+asks[0]?.[0]||0;
  const mid=bestB&&bestA?(bestB+bestA)/2:0;
  const spread=bestA&&bestB?bestA-bestB:0;
  const spreadBps=mid?spread/mid*10000:0;
  const sumQ=levels=>levels.reduce((s,x)=>s+(+x[1]||0),0);
  const bidQ=sumQ(bids), askQ=sumQ(asks);
  body.innerHTML=`<div class="tm-grid">
    ${metric('Best bid', fmtN(bestB, bestB<1?5:2), 'up')}
    ${metric('Best ask', fmtN(bestA, bestA<1?5:2), 'dn')}
    ${metric('Spread', fmtN(spread,4)+' · '+fmtN(spreadBps,2)+' bps')}

@keyframes mavFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes mavPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes mavSpin{to{transform:rotateY(360deg)}}
.mav-enter{animation:mavFadeUp .35s ease both}
.mav-live{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;color:#9a9a9a}
.mav-live i{width:6px;height:6px;border-radius:50%;background:#62d394;box-shadow:0 0 8px #62d39499;animation:mavPulse 1.6s ease infinite}
.mav-chip{border:1px solid #2a2a2a;background:#0c0c0c;border-radius:999px;padding:4px 10px;font-size:11px;color:#bbb}
.mav-card{background:linear-gradient(165deg,#121212,#0a0a0a);border:1px solid #262626;border-radius:16px;padding:14px;transition:border-color .2s,transform .2s}
.mav-card:hover{border-color:#3a3a3a}
.mav-grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mav-grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mav-mono{font-variant-numeric:tabular-nums}

/* 3D Market Pulse sphere */
.pulse3d-wrap{perspective:900px;height:280px;display:grid;place-items:center;position:relative}
.pulse3d{width:180px;height:180px;border-radius:50%;position:relative;transform-style:preserve-3d;animation:mavSpin 18s linear infinite;background:radial-gradient(circle at 35% 30%,#fff 0%,#8a8a8a 25%,#2a2a2a 60%,#050505 100%);box-shadow:0 0 60px #ffffff14, inset -20px -20px 40px #000a, inset 12px 12px 24px #fff2}
.pulse3d:hover{animation-play-state:paused}
.pulse3d-ring{position:absolute;inset:-18px;border:1px solid #ffffff22;border-radius:50%;transform:rotateX(70deg)}
.pulse3d-ring2{position:absolute;inset:-36px;border:1px solid #ffffff12;border-radius:50%;transform:rotateX(70deg) rotateZ(30deg)}
.pulse3d-label{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#888;letter-spacing:.12em}

/* Heatmap */
.heat-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.heat-cell{border-radius:8px;padding:10px 6px;min-height:72px;cursor:pointer;border:1px solid #ffffff10;transition:transform .15s,border-color .15s;text-align:center}
.heat-cell:hover{transform:scale(1.04);border-color:#fff3;z-index:1}
.heat-cell b{display:block;font-size:12px}
.heat-cell span{display:block;font-size:10px;margin-top:4px}

/* Radar */
.radar-list .r2{padding:8px 0;border-bottom:1px solid #1a1a1a;animation:mavFadeUp .3s ease both}
.radar-sev{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid #333}

/* Correlation */
.corr-table{border-collapse:collapse;font-size:11px;width:100%}
.corr-table th,.corr-table td{padding:6px;text-align:center;border:1px solid #1e1e1e}
.corr-table th{color:#888;font-weight:500}

/* Multi workspace */
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:420px}
.ws-panel{background:#0a0a0a;border:1px solid #252525;border-radius:14px;padding:10px;min-height:200px;position:relative}
.ws-panel h4{margin:0 0 8px;font-size:12px;color:#999;font-weight:500}
@media(max-width:800px){.ws-grid{grid-template-columns:1fr}}

/* Agents HQ */
.agent-hq{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.agent-node{border:1px solid #2a2a2a;border-radius:16px;padding:14px;background:#0c0c0c;position:relative;overflow:hidden}
.agent-node:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 0%,#ffffff08,transparent 50%);pointer-events:none}
.agent-st{font-size:10px;letter-spacing:.1em}

/* Strategy builder */
.sb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.sb-row select,.sb-row input{background:#111;border:1px solid #2a2a2a;color:#eee;border-radius:10px;padding:8px;font:inherit}

/* Replay */
.replay-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.replay-bar input[type=range]{flex:1;min-width:120px;accent-color:#ccc}
</style>

SP['discover:Heatmap']=()=>{
  setTimeout(renderHeatmap,40);

<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">${liveBadge('BINANCE 24h')}<span class="mav-chip">Size ≈ volume</span><span class="mav-chip">Color ≈ change</span>
<button class="b s w" data-a="hm-refresh">Refresh</button></div>
<div id="hm-body" class="mav-enter"><div class="c mu">Loading tickers…</div></div>`;
};
async function renderHeatmap(){
  const body=$id('hm-body'); if(!body)return;
  body.innerHTML='<div class="c mu">Fetching…</div>';
  let rows=[];
  if(typeof ensureTop100==='function') rows=await ensureTop100(true);
  if(!rows||!rows.length){
    const raw=await jget('https://api.binance.com/api/v3/ticker/24hr');
    if(raw) rows=raw.filter(x=>/USDT$/.test(x.symbol)&&!/UP|DOWN|BEAR|BULL/.test(x.symbol))
      .map(x=>({s:x.symbol.replace('USDT',''),ch:+x.priceChangePercent,v:+x.quoteVolume,p:+x.lastPrice}))
      .sort((a,b)=>b.v-a.v).slice(0,64);
  } else rows=rows.slice(0,64);
  if(!rows.length){body.innerHTML='<div class="c mu">No data</div>';return}
  const maxV=Math.max(...rows.map(x=>+x.v||0),1);
  body.innerHTML=`<div class="heat-map">${rows.map(x=>{
    const ch=+x.ch||0;
    const inten=Math.min(1,Math.abs(ch)/8);
    const bg=ch>=0?`rgba(80,160,110,${0.15+inten*0.55})`:`rgba(160,70,70,${0.15+inten*0.55})`;
    const fs=11+Math.floor((+x.v/maxV)*6);
    return `<div class="heat-cell" style="background:${bg};font-size:${fs}px" data-a="sel" data-s="${safe(x.s)}" title="${safe(x.s)} ${pct(ch)} vol ${fmt((+x.v||0)/1e6,1)}M">
      <b>${safe(x.s)}</b><span class="${cls(ch)}">${pct(ch)}</span></div>`;
  }).join('')}</div>
  <p class="mu" style="margin-top:10px">Click cell → select asset for Terminal. LIVE Binance quote volume ranking.</p>`;
}

/* ========== TRADING RADAR ========== */
SP['discover:Radar']=()=>{
  setTimeout(renderRadar,40);
  return `<h1 class="mav-enter">Trading Radar</h1>
<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">${liveBadge('SCAN')}<button class="b s w" data-a="radar-refresh">Rescan</button>
<button class="b s" data-a="sbt" data-t="Heatmap">Heatmap</button></div>
<div id="radar-body" class="mav-enter c"><div class="mu">Scanning anomalies…</div></div>`;
};
async function renderRadar(){
  const body=$id('radar-body'); if(!body)return;
  const events=[];
  let rows=[];
  if(typeof ensureTop100==='function') rows=await ensureTop100();
  if(!rows.length){
    const raw=await jget('https://api.binance.com/api/v3/ticker/24hr');
    if(raw) rows=raw.filter(x=>x.symbol.endsWith('USDT')).map(x=>({s:x.symbol.replace('USDT',''),ch:+x.priceChangePercent,v:+x.quoteVolume,p:+x.lastPrice}));
  }
  const vs=rows.map(x=>+x.v||0).sort((a,b)=>a-b);
  const med=vs[Math.floor(vs.length/2)]||1;
  rows.filter(x=>(+x.v||0)>med*3 && Math.abs(+x.ch)>3).slice(0,8).forEach(x=>{
    events.push({sev:'HIGH',title:`Volume spike · ${x.s}`,detail:`${pct(x.ch)} · ${fmt((+x.v)/1e6,1)}M quote`,s:x.s});
  });
  rows.filter(x=>Math.abs(+x.ch)>=8).sort((a,b)=>Math.abs(b.ch)-Math.abs(a.ch)).slice(0,6).forEach(x=>{
    events.push({sev:'MED',title:`Impulse · ${x.s}`,detail:pct(x.ch),s:x.s});
  });
  // funding anomalies majors
  for(const s of ['BTC','ETH','SOL']){
    const f=await jget('https://fapi.binance.com/fapi/v1/premiumIndex?symbol='+s+'USDT');
    if(f&&Math.abs(+f.lastFundingRate)>0.0003){
      events.push({sev:'MED',title:`Funding · ${s}`,detail:pct(+f.lastFundingRate*100),s});
    }
  }
  if(!events.length) events.push({sev:'LOW',title:'No strong anomalies in sample',detail:'Markets quiet vs median volume',s:'BTC'});
  body.innerHTML=`<div class="radar-list">${events.map(e=>`
    <div class="r2"><div><span class="radar-sev">${e.sev}</span> <b>${safe(e.title)}</b><div class="mu">${safe(e.detail)}</div></div>
    <button class="b s" data-a="sel" data-s="${safe(e.s)}">Terminal</button></div>`).join('')}</div>
    <p class="mu" style="margin-top:10px">Heuristic scanner on LIVE tickers + funding. Not signals — prompts for review.</p>`;
}

/* ========== CORRELATION ========== */
SP['discover:Correlation']=()=>{
  setTimeout(renderCorr,40);
  return `<h1 class="mav-enter">Correlation Matrix</h1>
<div class="row" style="gap:8px;margin-bottom:12px">${liveBadge('BINANCE 1h closes')}<span class="mav-chip">Pearson · ~48 bars</span>
<button class="b s w" data-a="corr-refresh">Recompute</button></div>
<div id="corr-body" class="c mav-enter mu">Computing…</div>`;
};
function pearson(a,b){
  const n=Math.min(a.length,b.length); if(n<5)return null;
  let sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(let i=0;i<n;i++){const x=a[i],y=b[i];sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y}
  const num=n*sxy-sx*sy, den=Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));
  return den?num/den:null;
}
async function renderCorr(){
  const body=$id('corr-body'); if(!body)return;
  const syms=['BTC','ETH','SOL','BNB','XRP','DOGE','LINK','AVAX'];
  const series={};
  await Promise.all(syms.map(async s=>{
    const k=await jget(`https://api.binance.com/api/v3/klines?symbol=${s}USDT&interval=1h&limit=50`);
    if(k) series[s]=k.map(x=>+x[4]);
  }));
  const ok=syms.filter(s=>series[s]?.length>10);
  if(ok.length<3){body.innerHTML='Insufficient history';return}
  let html='<table class="corr-table"><thead><tr><th></th>'+ok.map(s=>`<th>${s}</th>`).join('')+'</tr></thead><tbody>';
  ok.forEach(a=>{
    html+=`<tr><th>${a}</th>`;
    ok.forEach(b=>{
      if(a===b){html+='<td class="mu">1.00</td>';return}
      const r=pearson(series[a],series[b]);
      const v=r==null?'—':r.toFixed(2);
      const bg=r==null?'transparent':`rgba(${r>0?80:160},${r>0?160:80},100,${Math.min(0.75,Math.abs(r)*0.7)})`;
      html+=`<td style="background:${bg}">${v}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table><p class="mu" style="margin-top:10px">LIVE hourly closes. Correlation ≠ causation; regimes shift.</p>';
  body.innerHTML=html;
}

      const equalsH=Object.entries(eqH).filter(([,n])=>n>=2).map(([p,n])=>({p:+p,n})).filter(x=>x.p>last).sort((a,b)=>a.p-b.p).slice(0,5);
      const equalsL=Object.entries(eqL).filter(([,n])=>n>=2).map(([p,n])=>({p:+p,n})).filter(x=>x.p<last).sort((a,b)=>b.p-a.p).slice(0,5);

          <p class="mu">Equal highs can attract stops — not guaranteed magnets.</p></div>
        <div class="mav-card"><h3>Equal lows · liquidity below</h3>${equalsL.map(x=>`<div class="r2 up"><span>${fmt(x.p,2)}</span><span>×${x.n}</span></div>`).join('')||'<span class="mu">None clustered</span>'}

${typeof termHead==='function'?termHead():''}
<div class="row" style="gap:8px;margin-bottom:10px">${demoBadge('HISTORICAL KLINES')}<span class="mav-chip">Education / review</span></div>
<div class="c mav-enter">
  <canvas id="rp-cv" style="width:100%;height:280px;display:block;background:#050505;border-radius:12px"></canvas>
  <div class="replay-bar">
    <button class="b s" data-a="rp-play">Play/Pause</button>
    <button class="b s" data-a="rp-reset">Reset</button>
    <label class="mu">Speed <select id="rp-speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option></select></label>
    <input type="range" id="rp-seek" min="10" max="100" value="10">
    <span class="mu" id="rp-label">—</span>
  </div>
  <p class="mu">Replays recent Binance klines for ${safe(S.sel)}. Not full tick tape.</p>
</div>`;
};
async function loadReplay(){
  const sym=(S.sel||'BTC')+'USDT';
  const k=await jget(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${S.tf||'15m'}&limit=120`);
  if(!k){const lb=$id('rp-label');if(lb)lb.textContent='No data';return}
  S.replay.bars=k.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],t:x[0]}));
  S.replay.i=20; drawReplay();
}
function drawReplay(){
  const cv=$id('rp-cv'); if(!cv||!S.replay.bars.length)return;
  const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight||280;
  cv.width=w*d;cv.height=h*d;const ctx=cv.getContext('2d');ctx.scale(d,d);
  const n=Math.max(10,Math.min(S.replay.i,S.replay.bars.length));
  const bars=S.replay.bars.slice(0,n);
  let hi=Math.max(...bars.map(b=>b.h)),lo=Math.min(...bars.map(b=>b.l));
  const pad=(hi-lo)*0.08||1;hi+=pad;lo-=pad;
  const Y=v=>h-(v-lo)/(hi-lo)*(h-20)-10;
  const cw=w/bars.length;
  bars.forEach((b,i)=>{
    const x=i*cw+cw*0.2; const up=b.c>=b.o;
    ctx.strokeStyle=up?'#6aab7a':'#ab6a6a';ctx.beginPath();ctx.moveTo(i*cw+cw/2,Y(b.h));ctx.lineTo(i*cw+cw/2,Y(b.l));ctx.stroke();
    ctx.fillStyle=up?'#6aab7a':'#ab6a6a';
    ctx.fillRect(x,Y(Math.max(b.o,b.c)),cw*0.6,Math.max(1,Math.abs(Y(b.o)-Y(b.c))));
  });
  const lb=$id('rp-label'); if(lb) lb.textContent=`Bar ${n}/${S.replay.bars.length} · close ${fmt(bars.at(-1).c,2)}`;
  const sk=$id('rp-seek'); if(sk){sk.max=S.replay.bars.length;sk.value=n}
}
let rpTimer=null;
function rpTick(){
  if(!S.replay.playing)return;
  if(S.replay.i>=S.replay.bars.length){S.replay.playing=0;return}
  S.replay.i++; drawReplay();
  rpTimer=setTimeout(rpTick, 400/ (S.replay.speed||1));
}

async function renderWhales(){

  </tbody></table>`;
}

S.stratBuild=S.stratBuild||{rules:[]};
SP['terminal:Strategy']=()=>{

<div class="row" style="gap:8px;margin-bottom:10px">${demoBadge('LOCAL RULES')}<button class="b s" data-a="sbt" data-t="Playbook">Playbook</button></div>
<div class="c mav-enter">

  <div id="sb-list">${rules.map((r,i)=>`<div class="r2"><span class="mu">IF ${safe(r.f1)} ${safe(r.op)} ${safe(r.v)} AND ${safe(r.f2)} THEN ${safe(r.act)}</span>

document.addEventListener('click',e=>{

  const a=b.dataset.a;
  if(a==='hm-refresh') renderHeatmap();
  if(a==='radar-refresh') renderRadar();

  if(a==='rp-reset'){ S.replay.i=20; S.replay.playing=0; drawReplay(); }
  if(a==='sb-add'){
    const f1=$id('sb-f1')?.value, op=$id('sb-op')?.value, v=$id('sb-v')?.value, f2=$id('sb-f2')?.value, act=$id('sb-act')?.value;

  if(a==='sb-del'){ S.stratBuild.rules.splice(+b.dataset.i,1); try{sv()}catch(err){} render(); }
});
document.addEventListener('input',e=>{

  }
  if (a === 'mp-publish') {
    const n = ($id('mln') && $id('mln').value || '').trim();
    if (!n) return;
    S.mkl = S.mkl || [];
    S.mkl.unshift({n, c: $id('mlc')?.value || 'Indicators', p: $id('mlp')?.value || '0', d: $id('mld')?.value || ''});
    try { sv(); } catch(err) {}
    if (typeof note === 'function') note('Listing published locally');
    S.sb = S.sb || {}; S.sb.market = 'Catalog';
    render();
  }
  if (a === 'mp-del-listing') {
    S.mkl.splice(+b.dataset.i, 1);
    try { sv(); } catch(err) {}
    render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'mp-q') {
    S.mpq = e.target.value || '';
    try { sv(); } catch(err) {}
    render();
  }
});
function $id(id){ return document.getElementById(id); }

if (!S.sb) S.sb = {};
if (!SUB.market.includes(S.sb.market)) S.sb.market = 'Catalog';

})();
</script>

<script id="mavora-academy-v2">
(()=>{
'use strict';
const safe=v=>(typeof esc==='function'?esc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

S.acad=S.acad||{course:'foundations',lesson:0,done:{},quiz:{},xp:0};
// sanitize legacy courses so old UI never divides by zero
if (Array.isArray(S.courses)) {
  S.courses.forEach(c => {
    if (!c) return;
    c.tot = Math.max(1, +c.tot || 1);
    c.done = Math.max(0, Math.min(+c.done || 0, c.tot));
  });
}

S.qz=S.qz||{};

/** Curriculum aligned with MAVORA market/tools docs */
const CURRICULUM = {
  foundations: {
    title: 'Foundations of Crypto Markets',
    level: 'Beginner',
    goal: 'Read the market without signal noise. Context before entries.',
    lessons: [
      {id:'f1', title: 'What moves crypto prices',
        body:`<p>Price is the last agreed trade. Behind it: spot demand, derivatives positioning, liquidity, and narratives.</p>
<ul><li><b>Spot</b> — real asset transfer (or IOU on CEX).</li>
<li><b>Perpetual futures</b> — leveraged exposure, funding, liquidations.</li>
<li><b>Narratives</b> — narratives move flows; flows move price.</li></ul>
<p>MAVORA rule: never treat a single indicator as a trade. Start with market context (Market → Overview).</p>`},
      {id:'f2', title: 'Market structure basics',
        body:`<p>Structure is the sequence of swing highs and lows.</p>
<ul><li><b>Uptrend</b> — higher highs and higher lows.</li>
<li><b>Downtrend</b> — lower highs and lower lows.</li>
<li><b>Range</b> — repeated acceptance between bounds.</li></ul>
<p>Practice: Terminal → Structure. Mark support/resistance from pivots. Invalidation is beyond structure, not a random round number.</p>`},
      {id:'f3', title: 'Timeframes and hierarchy',
        body:`<p>Higher timeframe (HTF) sets bias; lower timeframe (LTF) times entry.</p>
<ul><li>Daily / 4H — regime and major levels.</li>
<li>1H — working structure.</li>
<li>15m / 5m — execution only after HTF context.</li></ul>
<p>Contradiction between TF = reduce size or stand aside.</p>`},
      {id:'f4', title: 'Volume, liquidity, slippage',
        body:`<p>You do not trade mid-price. You trade venue liquidity.</p>
<ul><li>Check spread and depth on the exchange you execute (Terminal → Book).</li>
<li>Large size vs thin book = slippage.</li>
<li>Aggregator price ≠ your fill.</li></ul>
<p>If book is hostile, the setup is incomplete — NO TRADE.</p>`},
      {id:'f5', title: 'Risk before reward',
        body:`<p>Position size = cash risk ÷ distance from entry to stop.</p>
<ul><li>Define invalidation first.</li>
<li>Risk % of equity (commonly 0.25–1% while learning).</li>
<li>Never move stop farther without a pre-tested rule.</li></ul>
<p>Practice: Terminal → Risk calculator. Log every paper trade in Journal.</p>`}
    ],
    quiz: [
      {q:'What should come first before an entry idea?', opts:['Funding rate alone','Market context & structure','CMC trending rank','A single RSI cross'], a:1},
      {q:'Position size is primarily driven by…', opts:['Maximum leverage','Distance to stop and cash risk','Twitter sentiment','Open interest rising'], a:1},
      {q:'Aggregator mid-price…', opts:['Equals your fill','Replaces venue book','Is not your execution price','Guarantees best bid'], a:2}
    ]
  },
  derivatives: {
    title: 'Derivatives Literacy',
    level: 'Intermediate',
    goal: 'Read OI, funding, liquidations without superstition.',
    lessons: [
      {id:'d1', title: 'Perps, margin, liquidation',
        body:`<p>Perpetual futures track spot via funding. Leverage amplifies both PnL and liquidation risk.</p>
<ul><li>Initial vs maintenance margin.</li>
<li>Liquidation is a venue process — know your distance.</li>
<li>Cross vs isolated margin changes account risk shape.</li></ul>`},
      {id:'d2', title: 'Open Interest correctly',
        body:`<p><b>OI up is not “more longs.”</b> Every contract has a buyer and a seller.</p>
<ul><li>OI ↑ + price ↑ — new risk added, direction not proven by OI alone.</li>
<li>OI ↓ — risk removed (closes, liquidations).</li></ul>
<p>Use OI as context with price and flow (Terminal → Derivatives).</p>`},
      {id:'d3', title: 'Funding as cost, not oracle',
        body:`<p>Positive funding: longs pay shorts. Extreme funding = crowded positioning cost.</p>
<ul><li>Not a standalone reversal signal.</li>
<li>Combine with structure and event risk.</li></ul>`},
      {id:'d4', title: 'Liquidation maps',
        body:`<p>Heatmaps are often models of where stops/liq clusters might sit.</p>
<ul><li>Not guaranteed magnets.</li>
<li>Prefer actual liquidation prints when available.</li>
<li>External tools (e.g. CoinGlass) for maps — MAVORA links, does not invent heatmap numbers.</li></ul>`}
    ],
    quiz: [
      {q:'Rising OI always means bulls are in control?', opts:['Yes','No — each contract has two sides','Only on Fridays','Only if funding is positive'], a:1},
      {q:'High funding should be treated as…', opts:['Automatic short signal','Positioning cost / context','Proof of infinite trend','Risk-free arb'], a:1}
    ]
  },
  process: {
    title: 'Professional Process',
    level: 'Intermediate',
    goal: 'Daily routine, pre-trade checklist, journal edge.',
    lessons: [
      {id:'p1', title: 'Pre-session routine',
        body:`<ol><li>Market cap, dominance, breadth (Market → Overview).</li>
<li>Sectors and leaders.</li>
<li>Macro calendar / news.</li>
<li>Liquid names only.</li>
<li>Regime for BTC/ETH.</li>
<li>HTF levels marked.</li></ol>`},
      {id:'p2', title: 'Pre-trade checklist',
        body:`<ol><li>Structure 4H/1H + working TF.</li>
<li>VWAP / levels / range.</li>
<li>Venue book: spread, depth.</li>
<li>Flow: delta / CVD proxy.</li>
<li>OI, funding, events.</li>
<li>Written scenario + invalidation.</li>
<li>Size and max loss calculated.</li>
<li>If data conflicts → NO TRADE.</li></ol>
<p>Terminal → Risk / Playbook.</p>`},
      {id:'p3', title: 'Journal and statistics',
        body:`<p>One trade proves nothing. Track series:</p>
<ul><li>Win rate, average win/loss, expectancy, profit factor.</li>
<li>Max drawdown, fees.</li>
<li>Results by setup and by asset.</li></ul>
<p>Account → Performance uses your Journal as source of truth.</p>`},
      {id:'p4', title: 'Backtest humility',
        body:`<ul><li>Formal rules first.</li>
<li>Include fees, funding, slippage.</li>
<li>Out-of-sample and different regimes.</li>
<li>Pretty curves can be curve-fit.</li></ul>`}
    ],
    quiz: [
      {q:'If checklist items conflict, you should…', opts:['Increase leverage','Force the trade','Prefer NO TRADE','Ignore the book'], a:2},
      {q:'Expectancy is…', opts:['Win rate only','Average net result per trade','Maximum leverage','Funding average'], a:1}
    ]
  },
  playbook: {
    title: 'Strategy Families',
    level: 'Advanced',
    goal: 'Match tools to strategy type; know failure modes.',
    lessons: [
      {id:'s1', title: 'Trend following',
        body:`<p>Needs: HTF structure, EMA/VWAP aids, volume, ATR, optional OI/funding context, trailing or structure exit.</p>
<p>Failure: ranging chop, late entries, stops too tight vs ATR.</p>`},
      {id:'s2', title: 'Breakout / retest',
        body:`<p>Needs: levels, volume, flow confirmation, acceptable slippage, event awareness.</p>
<p>Failure: fake breaks without acceptance, news spikes, thin books.</p>`},
      {id:'s3', title: 'Mean reversion discipline',
        body:`<p>Only in proven ranges. Do not fade strong impulse mechanically.</p>
<p>Needs: VWAP/VP, fade signals, liquidity, news filter.</p>`},
      {id:'s4', title: 'ICT/SMC terms',
        body:`<p>Sweeps, FVG, order blocks only help if definitions are testable and journaled.</p>
<p>Labels alone ≠ edge.</p>`}
    ],
    quiz: [
      {q:'Mean reversion is safest when…', opts:['Impulse is vertical','Range is proven and impulse fades','Funding is extreme only','OI is at ATH'], a:1},
      {q:'Strategy labels without testable rules…', opts:['Guarantee profit','Are sufficient for live size','Do not create statistical edge','Replace risk management'], a:2}
    ]
  }
};

SUB.academy = ['Path', 'Courses', 'Lesson', 'Practice', 'Progress', 'Glossary', 'Certificates'];

function acadDone(courseId, lessonId){
  const k = courseId + ':' + lessonId;
  return !!(S.acad.done && S.acad.done[k]);
}
function acadMark(courseId, lessonId){
  S.acad.done = S.acad.done || {};
  const k = courseId + ':' + lessonId;
  if (!S.acad.done[k]) {
    S.acad.done[k] = 1;
    S.acad.xp = (S.acad.xp || 0) + 10;
  }
  try { sv(); } catch(e) {}
}
function courseProgress(cid){
  const c = CURRICULUM[cid];
  if (!c || !Array.isArray(c.lessons) || !c.lessons.length) return {d:0,n:0,pct:0};
  const n = c.lessons.length;
  const d = c.lessons.filter(l => acadDone(cid, l.id)).length;
  return {d, n, pct: Math.max(0, Math.min(100, Math.round(d / n * 100)))};
}
function totalProgress(){
  let d = 0, n = 0;
  Object.keys(CURRICULUM).forEach(cid => {
    const p = courseProgress(cid); d += p.d; n += p.n;
  });
  return {d, n, pct: n ? Math.round(d / n * 100) : 0};
}

SP['academy:Path'] = () => {
  const t = totalProgress();
  return `<h1>Academy · Learning Path</h1>
<div class="ac-card" style="margin-bottom:14px">
  <div class="row sp"><b>Overall progress</b><span class="mu">${t.d}/${t.n} lessons · ${t.pct}% · XP ${S.acad.xp||0}</span></div>
  <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+t.pct||0))}%"></span></div>

<div class="ac-grid">${Object.entries(CURRICULUM).map(([id,c])=>{

  </div>`;
}).join('')}</div>
<div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px">
  <button class="b s" data-a="nav" data-m="discover">Practice: Market</button>
  <button class="b s" data-a="nav" data-m="terminal">Practice: Terminal</button>
  <button class="b s" data-a="nav" data-m="account">Journal</button>
</div>`;
};

SP['academy:Courses'] = () => {
  const cid = S.acad.course || 'foundations';
  const c = CURRICULUM[cid]; if (!c) return `<div class="c">Unknown course</div>`;
  const p = courseProgress(cid);
  return `<h1>Course · ${safe(c.title)}</h1>
<div class="ac-path">${Object.keys(CURRICULUM).map(id=>`<button class="b s ${id===cid?'on':''}" data-a="ac-open" data-course="${id}">${safe(CURRICULUM[id].title.split(' ')[0])}</button>`).join('')}</div>
<div class="ac-card" style="margin-bottom:12px">
  <span class="ac-tag">${safe(c.level)}</span>
  <p class="mu">${safe(c.goal)}</p>
  <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+p.pct||0))}%"></span></div>
  <span class="mu">${p.d}/${p.n} complete</span>
</div>
${c.lessons.map((l,i)=>{
  const done=acadDone(cid,l.id);
  return `<div class="ac-lesson">
    <div class="row sp"><h4>${i+1}. ${safe(l.title)}</h4><span class="${done?'ac-done':'mu'}">${done?'Done':'To do'}</span></div>
    <button class="b s w" data-a="ac-lesson" data-course="${cid}" data-l="${i}">Open lesson</button>
  </div>`;

<div class="row" style="margin-top:10px;gap:8px">
  <button class="b s" data-a="sbt" data-t="Practice">Course quiz</button>
  <button class="b s" data-a="sbt" data-t="Certificates">Certificates</button>
</div>`;
};

SP['academy:Lesson'] = () => {
  const cid = S.acad.course || 'foundations';
  const c = CURRICULUM[cid];
  const i = Math.min(S.acad.lesson|0, (c?.lessons.length||1)-1);
