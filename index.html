<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MAVORA</title><style>
:root{color-scheme:dark;--bg:#000;--p:#0d0d0d;--p2:#171717;--b:#252525;--t:#f4f4f4;--m:#8c8c8c;--g:#62d394;--r:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.45 "Inter",system-ui,sans-serif;display:flex;overflow:hidden}
#sb{width:210px;border-right:1px solid var(--b);padding:16px 12px;overflow:auto;flex:none}
#sb .lg{font-weight:700;font-size:18px;letter-spacing:.14em;padding:4px 12px 16px}
.nv{display:block;width:100%;text-align:left;background:none;border:0;color:var(--m);padding:9px 14px;border-radius:999px;cursor:pointer;font:inherit;margin-bottom:2px}
.nv:hover{background:var(--p2);color:var(--t)}.nv.on{background:var(--t);color:#000}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
#hd{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--b);position:relative}
#pg{flex:1;overflow:auto;padding:20px 22px}
.b{border:1px solid var(--b);background:var(--p2);color:var(--t);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.b:hover{background:#242424}.b.w{background:var(--t);color:#000;border-color:var(--t)}.b.s{padding:4px 12px;font-size:12px}.b.on{background:var(--t);color:#000}.b.g{border-color:var(--g);color:var(--g);background:none}.b.r{border-color:var(--r);color:var(--r);background:none}.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
input,select,textarea{background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:999px;padding:8px 14px;font:inherit;min-width:0}textarea{border-radius:18px;width:100%;resize:vertical}
#q{flex:1;max-width:460px}.pill{border:1px solid var(--b);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--m)}.pill.d{color:#000;background:#e8c46a;border-color:#e8c46a}
.c{background:var(--p);border:1px solid var(--b);border-radius:20px;padding:16px;min-width:0}.c h3{margin:0 0 10px;font-size:13px;color:var(--m);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.r2{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1a}.up{color:var(--g)}.dn{color:var(--r)}.mu{color:var(--m)}
h1{font-size:24px;margin:0 0 16px;font-weight:600}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #1a1a1a}th{color:var(--m);font-weight:500;cursor:pointer}
#dd,#nt{position:absolute;top:56px;background:var(--p);border:1px solid var(--b);border-radius:20px;padding:8px;z-index:20;max-height:60vh;overflow:auto;display:none}#dd{left:130px;width:460px;max-width:90vw}#nt{right:60px;width:320px}
#dd button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--t);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit}#dd button:hover{background:var(--p2)}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}#md>div{background:var(--p);border:1px solid var(--b);border-radius:24px;padding:22px;width:380px;max-width:92vw}
#cv{width:100%;height:340px;display:block}.tg{display:grid;grid-template-columns:2fr 1fr;gap:14px}.bar{height:8px;border-radius:99px;background:var(--r);overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.tag{font-size:11px;border:1px solid var(--b);border-radius:99px;padding:1px 8px;color:var(--m)}#bg{display:none}
@media(max-width:820px){#sb{position:fixed;z-index:15;background:#000;height:100%;left:-230px;transition:left .2s}#sb.open{left:0}#bg{display:inline-block}.tg{grid-template-columns:1fr}#pg{padding:14px}#nt{right:10px}#dd{left:10px}}
body{background:radial-gradient(1100px 520px at 75% -12%,#1d1d1d 0,#000 62%) fixed;letter-spacing:.005em}#sb{background:#050505}#sb .lg{display:flex;align-items:center;gap:12px;letter-spacing:.22em}#sb .lg i{width:24px;height:24px;border-radius:50%;border:2px solid #fff;position:relative;flex:none}#sb .lg i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;top:-5px;right:0;box-shadow:0 0 12px 2px #fff}.nv.on{box-shadow:0 0 22px #ffffff3d;font-weight:600}.c{background:linear-gradient(165deg,#161616,#090909);border-radius:24px;box-shadow:inset 0 1px 0 #ffffff14}h1{font-size:30px;letter-spacing:-.02em}.b{transition:transform .12s,background .15s}.b:active{transform:scale(.95)}.b.w{box-shadow:0 0 18px #ffffff30}.hero{background:radial-gradient(520px 220px at 85% 0,#2a2a2a,#0a0a0a);padding:22px}.big{font-size:48px;font-weight:600;letter-spacing:-.03em}#tape{overflow:hidden;border-bottom:1px solid var(--b);background:#000!important;color:#f4f4f4;white-space:nowrap;padding:0;font-size:11px;height:34px;min-height:34px;max-height:34px;display:flex;align-items:center}#tape .tradingview-widget-container,#tape .tradingview-widget-container__widget{background:#000!important;height:34px!important;min-height:34px!important;max-height:34px!important}#tape iframe{background:#000!important;border:0!important;height:34px!important;min-height:34px!important;max-height:34px!important}#tape>div{display:inline-flex;gap:20px;padding-left:20px;animation:tp 60s linear infinite}#tape span{display:inline-flex;gap:8px}@keyframes tp{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){#tape>div{animation:none}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.mg{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;margin:10px 0}.m1{align-self:flex-start;background:var(--p2);border-radius:18px;padding:7px 13px;max-width:80%}.m1.me{align-self:flex-end;background:var(--t);color:#000}
@media(prefers-reduced-motion:reduce){#sb{transition:none}}

/* MAVORA Journal + TradingView enhancements */
/* Journal navigation fix: preserve Terminal sub-navigation while Journal content is active. */
#pg>.tabs{position:relative;z-index:5;background:#050505;padding:4px 0 8px}

.jgrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr);gap:14px}.jstats{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px;margin-bottom:14px}.jstat{background:#101010;border:1px solid var(--b);border-radius:16px;padding:13px}.jstat small{display:block;color:var(--m);font-size:11px}.jstat strong{display:block;font-size:21px;margin-top:5px}.jform{display:grid;grid-template-columns:1fr 1fr;gap:9px}.jform label{display:flex;flex-direction:column;gap:5px;color:var(--m);font-size:12px}.jform input,.jform select,.jform textarea{width:100%;border-radius:12px}.jform .wide{grid-column:1/-1}.jtablewrap{overflow:auto}.jtable{min-width:760px}.jtable td{white-space:nowrap}.jfilters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.jfilters input,.jfilters select{border-radius:12px}.jbadge{border:1px solid var(--b);border-radius:30px;padding:3px 8px;font-size:11px}.jempty{padding:22px;text-align:center;color:var(--m)}
@media(max-width:900px){.jgrid{grid-template-columns:1fr}.jstats{grid-template-columns:repeat(2,minmax(110px,1fr))}.jform{grid-template-columns:1fr 1fr}}

/* MAVORA live market intelligence + persistent workspace */
.mini-tape{height:34px;min-height:34px;background:#000;border-bottom:1px solid #202020;display:flex;align-items:center;gap:22px;overflow:auto;white-space:nowrap;padding:0 14px;font-size:11px;scrollbar-width:none}.mini-tape::-webkit-scrollbar{display:none}.mini-quote{display:inline-flex;gap:7px;align-items:center}.mini-quote b{color:#f4f4f4}.mini-quote small{color:#777}.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#62d394;margin-right:5px}.stale-dot{background:#e8c46a}.mktgrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin:12px 0}.mktmetric{border:1px solid #292929;background:#0a0a0a;border-radius:15px;padding:13px}.mktmetric small{color:#8c8c8c;display:block;font-size:11px}.mktmetric strong{display:block;font-size:20px;margin-top:5px}.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.analytics-grid .c{min-width:0}.signalrow{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #1a1a1a;padding:8px 0}.signalrow:last-child{border-bottom:0}.source-note{font-size:11px;color:#777;line-height:1.5}.source-link{color:#e8c46a;text-decoration:none}.source-link:hover{text-decoration:underline}.news-item{padding:10px 0;border-bottom:1px solid #1a1a1a}.news-item:last-child{border-bottom:0}.news-item a{color:#eee;text-decoration:none}.news-item a:hover{color:#e8c46a}.pulse-badge{border:1px solid #333;border-radius:999px;padding:3px 8px;font-size:10px;color:#aaa}
@media(max-width:820px){.mktgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.analytics-grid{grid-template-columns:1fr}.mini-tape{gap:14px;padding:0 8px}}
</style></head><body><noscript><p style="padding:20px;color:#fff">Для работы MAVORA нужен JavaScript. Откройте файл в обычном браузере (Chrome или Safari), а не во встроенном просмотре файлов.</p></noscript>
<nav id="sb"></nav>
<div id="mn"><header id="hd"><button class="b s" id="bg" data-a="sb">Меню</button><input id="q" placeholder="Поиск: активы, разделы, идеи (Ctrl+K)" autocomplete="off"><button class="b s" data-a="nav" data-m="ai">AI Command</button><span class="pill d" title="Статус рыночного соединения MAVORA">LIVE DATA / PAPER</span><button class="b s" data-a="nt" id="bn">Уведомления</button><div id="dd"></div><div id="nt"></div></header><div id="tape"></div><main id="pg"></main></div>
<div id="md"><div id="mc"></div></div>
<script>
window.onerror=(m,u,l)=>{document.body.insertAdjacentHTML('afterbegin','<pre style="color:#ff6b6b;padding:12px;white-space:pre-wrap">Ошибка: '+m+' (строка '+l+')</pre>')};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODS=[['home','Home'],['discover','Discover'],['terminal','Terminal'],['social','Social'],['community','Community'],['ai','AI Center'],['portfolio','Portfolio'],['workspace','Workspace'],['academy','Academy'],['market','Marketplace'],['data','Data Center'],['settings','Settings']];
const D={mod:'home',sel:'BTC',tf:'1h',wl:['BTC','ETH','SOL'],bal:10000,pos:[],hist:[],notes:'',tasks:[],n:[],widgets:['chart','watch','bal','pos','movers','notes','tasks','agents','status'],
posts:[{id:1,u:'trader_alpha (demo)',t:'BTC держит EMA20, жду пробой локального максимума.',tk:'BTC',dir:'Long',st:'Active',likes:12,liked:0,saved:0},{id:2,u:'quant_mia (demo)',t:'ETH перегрет по RSI, фиксирую часть.',tk:'ETH',dir:'Short',st:'Draft',likes:5,liked:0,saved:0}],
com:[['Day Traders',1,'Дневная торговля и разбор сделок'],['Order Flow Lab',0,'Дельта, CVD, футпринт'],['Long-term Holders',0,'Инвестиции без суеты'],['AI Quant Club',0,'Агенты и бэктесты']].map((x,i)=>({id:i,n:x[0],j:x[1],d:x[2]})),
courses:[['Основы рынка',8,0],['Риск-менеджмент',6,0],['Order Flow',10,0]].map((x,i)=>({id:i,n:x[0],tot:x[1],done:x[2]})),
mk:[['Индикатор Delta Pro',0,'Индикатор'],['Агент SCOUT+',9,'AI-агент'],['Стратегия Swing',19,'Стратегия'],['Аудит риска (услуга)',49,'Услуга']].map((x,i)=>({id:i,n:x[0],pr:x[1],k:x[2],i:0})),sort:'v',flt:'all',log:[]};
let S=Object.assign({},D);try{Object.assign(S,JSON.parse(localStorage.getItem('mv')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('mv',JSON.stringify(S))}catch(e){}};
const AS=[['BTC','Bitcoin',97000],['ETH','Ethereum',3400],['SOL','Solana',190],['BNB','BNB',620],['XRP','XRP',2.3],['DOGE','Dogecoin',.38],['ADA','Cardano',1],['AVAX','Avalanche',42],['LINK','Chainlink',18],['TON','Toncoin',6.1]].map(([s,n,p])=>({s,n,p,o:p*(1+(Math.random()-.5)*.08),v:(.2+Math.random())*1e9}));
const P=s=>AS.find(a=>a.s===s).p,CH=s=>{const a=AS.find(x=>x.s===s);return(a.p/a.o-1)*100};
const f=n=>n>=1000?n.toLocaleString('en',{maximumFractionDigits:2}):n.toFixed(n<1?4:2),pc=n=>(n>=0?'+':'')+n.toFixed(2)+'%',cl=n=>n>=0?'up':'dn';
const VF={'1m':.0005,'5m':.0011,'15m':.0018,'1h':.0035,'4h':.007,'1d':.016},CC={};let tk=0,TR=[];
function cndl(s,tf){const k=s+'|'+tf;if(!CC[k]){let a=[],p=1;for(let i=0;i<70;i++){const o=p,c=o*(1+(Math.random()-.5)*VF[tf]*2.4);a.push({o,c,h:Math.max(o,c)*(1+Math.random()*VF[tf]*.5),l:Math.min(o,c)*(1-Math.random()*VF[tf]*.5)});p=c}const m=P(s)/p;a.forEach(k=>{k.o*=m;k.c*=m;k.h*=m;k.l*=m});CC[k]=a}return CC[k]}
const ema=(a,n)=>{let e=a[0];return a.map(v=>e=v*2/(n+1)+e*(1-2/(n+1)))};
const rsi=a=>{let g=0,l=0;for(let i=a.length-14;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100};
const eq=()=>S.bal+S.pos.reduce((t,x)=>t+x.q*x.e+pnl(x),0),pnl=x=>(x.side==='Buy'?1:-1)*(P(x.s)-x.e)*x.q;
const note=(t)=>{if(S.nf){const k=/PAPER|Закрыта|Алерт|Автозакрытие/.test(t)?'o':/^AI/.test(t)?'a':'s';if(S.nf[k]===0)return}S.n.unshift({t,ts:new Date().toLocaleTimeString('ru'),r:0});S.n=S.n.slice(0,30);S.log.unshift(new Date().toLocaleTimeString('ru')+' '+t);S.log=S.log.slice(0,40);sv();bell()};
const bell=()=>{$('#bn').textContent='Уведомления'+(S.n.filter(x=>!x.r).length?' ('+S.n.filter(x=>!x.r).length+')':'')};
const pr=(s)=>`<span data-p="${s}">${f(P(s))}</span>`,pch=s=>`<span data-c="${s}" class="${cl(CH(s))}">${pc(CH(s))}</span>`;
const emp=t=>`<div class="mu">${t}</div>`;
let AG={};const AGN=['SCOUT','TECH ANALYST','NEWS ANALYST','SENTIMENT ANALYST','ON-CHAIN ANALYST','DERIVATIVES ANALYST','STRATEGY AGENT','QUANT AGENT','PORTFOLIO MANAGER','RISK MANAGER','MONITOR','LEARNING AGENT','EXECUTION ENGINE'],OFF=['NEWS ANALYST','SENTIMENT ANALYST','ON-CHAIN ANALYST','DERIVATIVES ANALYST','LEARNING AGENT'];
const resetAG=()=>AGN.forEach(n=>AG[n]={st:OFF.includes(n)?'DISABLED':n==='EXECUTION ENGINE'?'WAITING':'IDLE',t:OFF.includes(n)?'Нет источника данных':'—'});resetAG();
const agRows=()=>AGN.map(n=>`<div class="r2"><span>${n}</span><span class="mu">${AG[n].st}${AG[n].t!=='—'?' · '+esc(AG[n].t):''}</span></div>`).join('');
const WD={watch:['Watchlist',()=>S.wl.map(s=>`<div class="r2"><b>${s}</b>${pr(s)}${pch(s)}<button class="b s" data-a="sel" data-s="${s}">Terminal</button></div>`).join('')||emp('Добавьте активы в Discover')],
bal:['Paper-баланс (PAPER)',()=>`<div style="font-size:26px">$${f(eq())}</div><div class="mu">Свободно $${f(S.bal)} · старт $10 000</div>`],
pos:['Открытые позиции',()=>S.pos.map(x=>`<div class="r2"><span>${x.side} ${x.s} ${x.q}</span><span class="${cl(pnl(x))}">${f(pnl(x))}</span></div>`).join('')||emp('Позиций нет. Откройте сделку в Terminal.')],
movers:['Лидеры движения',()=>[...AS].sort((a,b)=>Math.abs(CH(b.s))-Math.abs(CH(a.s))).slice(0,4).map(a=>`<div class="r2"><b>${a.s}</b>${pr(a.s)}${pch(a.s)}</div>`).join('')],
notes:['Заметки',()=>`<textarea rows=5 oninput="S.notes=this.value;sv()">${esc(S.notes)}</textarea>`],
tasks:['Задачи',()=>`<div class="row"><input id="ti" placeholder="Новая задача" style="flex:1"><button class="b s w" data-a="addt">Добавить</button></div>`+S.tasks.map((t,i)=>`<div class="r2"><span style="${t.d?'text-decoration:line-through;color:var(--m)':''}">${esc(t.t)}</span><span><button class="b s" data-a="tt" data-i="${i}">${t.d?'Вернуть':'Готово'}</button> <button class="b s" data-a="dt" data-i="${i}">Удалить</button></span></div>`).join('')],
agents:['Статус агентов',()=>`<div id="agw">${agRows()}</div>`],
chart:['Мини-график',()=>{const z=cndl(S.sel,'1h').map(k=>k.c),a=Math.min(...z),b=Math.max(...z);return`<div class="row sp"><b>${S.sel}</b>${pch(S.sel)}</div><svg viewBox="0 0 200 60" preserveAspectRatio="none" style="width:100%;height:90px"><polyline fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${z.map((v,i)=>(i*200/(z.length-1)).toFixed(1)+','+(56-(v-a)/(b-a||1)*52).toFixed(1)).join(' ')}"/></svg>`}],news:['Новости',()=>emp('Источник новостей не подключён. Подключите его в Data Center.')],
status:['Источники данных',()=>`<div class="r2"><span>Симулятор цен</span><span class="tag">DEMO</span></div><div class="r2"><span>Binance / Bybit</span><span class="tag">OFFLINE</span></div><div class="r2"><span>Торговля</span><span class="tag">PAPER</span></div>`]};
const TPL={Trader:['chart','watch','pos','movers','bal','status'],Investor:['bal','watch','notes','tasks'],'Market Overview':['movers','watch','news','status','agents']};
function home(){const av=Object.keys(WD).filter(k=>!S.widgets.includes(k));return`<div class="c hero"><div class="mu">Капитал · PAPER</div><div class="big"><span id="heq">$${f(eq())}</span></div><div class="row" style="margin-top:14px"><button class="b w" data-a="sel" data-s="${S.sel}">Открыть Terminal</button><button class="b" data-a="nav" data-m="ai">Запустить AI-анализ</button><button class="b" data-a="nav" data-m="social">Новая идея</button></div></div><div style="height:14px"></div><div class="row" style="margin-bottom:14px">${Object.keys(TPL).map(t=>`<button class="b s" data-a="tpl" data-t="${t}">${t}</button>`).join('')}<select id="aw">${av.map(k=>`<option value="${k}">${WD[k][0]}</option>`).join('')}</select><button class="b s w" data-a="addw">Добавить виджет</button></div><div class="gr">${S.widgets.map(k=>`<div class="c"><h3>${WD[k][0]}<button class="b s" data-a="rmw" data-k="${k}">Убрать</button></h3>${WD[k][1]()}</div>`).join('')||emp('Пусто. Добавьте виджет или выберите шаблон.')}</div>`}

 // Header controls: preserve the existing command/search behavior, turn status & alerts into icon controls.

 // Rename legacy navigation labels without destroying legacy routes or state.
 const labelMap={discover:'Market',portfolio:'Account',workspace:'Research Desk',data:'Data & Settings',settings:'Data & Settings'};
 function decorateNav(){const sb=$('#sb');if(!sb)return;$$('#sb .nv').forEach(b=>{const m=b.dataset.m;if(labelMap[m])b.textContent=labelMap[m];if(m==='workspace')b.style.display='none';if(m==='data'||m==='settings'){b.style.display='';b.textContent='Data & Settings';}});}
 decorateNav();new MutationObserver(decorateNav).observe($('#sb')||document.body,{childList:true,subtree:true});
 // Five persistent mobile destinations. The full navigation remains available from the menu.
 const bottom=document.createElement('nav');bottom.className='mav-bottom';bottom.innerHTML=[['home','⌂','Home'],['discover','◈','Market'],['terminal','⌁','Terminal'],['ai','✧','AI'],['portfolio','◉','Account']].map(([m,i,n])=>`<button data-mav-route="${m}"><span>${i}</span><span>${n}</span></button>`).join('');document.body.append(bottom);
 function route(m){const b=$(`#sb .nv[data-m="${m}"]`);if(b)b.click();else{const target=$(`[data-a="nav"][data-m="${m}"]`);target?.click()}bottom.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.mavRoute===m));}

 // Full-screen Market landing layer, with data-backed sections and asset-to-terminal handoff.
 const marketTabs=['Overview','Top 100','Movers','New Listings','Narratives','News & Events','TradingView'];
 let marketTab='Overview',marketRows=[],marketLoaded=0;
 const fmt=(n,d=2)=>Number.isFinite(+n)?(+n).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
 async function loadMarket(){const box=$('#mav-market-live');if(!box)return;box.innerHTML='<div class="c">Загрузка публичных котировок…</div>';try{const r=await fetch('https://api.binance.com/api/v3/ticker/24hr',{cache:'no-store'});if(!r.ok)throw Error('Binance HTTP '+r.status);const all=await r.json();marketRows=all.filter(x=>x.symbol.endsWith('USDT')&&+x.quoteVolume>0).sort((a,b)=>+b.quoteVolume-+a.quoteVolume).slice(0,100);marketLoaded=Date.now();drawMarket()}catch(e){box.innerHTML='<div class="c"><b>Рынок временно недоступен</b><p class="mav-page-note">API Binance не ответил. Показывать случайные цены не будем.</p><button class="b" id="mav-market-retry">Повторить</button></div>';$('#mav-market-retry')?.addEventListener('click',loadMarket)}}
 function drawMarket(){
  const box=$('#mav-market-live');if(!box)return;const rows=marketRows;let content='';
  if(marketTab==='Overview'){
   const leader=rows.filter(x=>+x.priceChangePercent>0).sort((a,b)=>+b.priceChangePercent-+a.priceChangePercent)[0];
   const cards=[['Всего активов',rows.length],['Лидер роста',leader?leader.symbol.replace('USDT','')+' '+fmt(leader.priceChangePercent,1)+'%':'—'],['Оборот выборки','$'+fmt(rows.reduce((a,x)=>a+ +x.quoteVolume,0)/1e9,2)+'B'],['Обновлено',marketLoaded?new Date(marketLoaded).toLocaleTimeString('ru'):'—']];
   content=`<div class="mav-account-grid">${cards.map(([k,v])=>`<div class="c"><small class="mu">${k}</small><h2>${v}</h2></div>`).join('')}</div><div class="c" style="margin-top:12px"><h3>Высокая ликвидность</h3>${table(rows.slice(0,20))}</div>`;
  }else if(marketTab==='Top 100'){content=table(rows)}
  else if(marketTab==='Movers'){const top=[...rows].sort((a,b)=>+b.priceChangePercent-+a.priceChangePercent).slice(0,15),down=[...rows].sort((a,b)=>+a.priceChangePercent-+b.priceChangePercent).slice(0,15);content=`<div class="gr"><div class="c"><h3>Растут</h3>${table(top)}</div><div class="c"><h3>Падают</h3>${table(down)}</div></div>`}
  else if(marketTab==='New Listings'){content='<div class="c"><h3>Новые листинги</h3><p>Для точных листингов нужен источник биржевых announcements. Здесь не отображается выдуманный список.</p><a class="source-link" target="_blank" rel="noopener" href="https://www.binance.com/en/support/announcement/list/48">Binance announcements ↗</a></div>'}
  else if(marketTab==='Narratives'){content='<div class="gr">'+[['AI & Compute','AI-токены, GPU/compute и инфраструктура. Проверяй релизы, выручку и реальные интеграции.'],['RWA','Токенизация активов; риски — регуляторика, ликвидность и обеспечение.'],['L1 / L2','Экосистемы, активность сети, TVL, комиссии и unlocks.'],['DeFi','TVL, комиссии, доходность и риски смарт-контрактов.'],['Memecoins','Высокая волатильность, концентрация держателей и импульс объёма.']].map(x=>`<div class="c"><h3>${x[0]}</h3><p>${x[1]}</p><span class="mav-color-tag violet">Narrative watch · editorial</span></div>`).join('')+'</div>'}
  else if(marketTab==='News & Events'){content='<div class="c"><h3>Новости и события</h3><p>Для новостного потока нужен CORS-прокси или backend. Здесь показаны первоисточники, а не вымышленные публикации.</p><div class="row"><a class="source-link" target="_blank" rel="noopener" href="https://www.coindesk.com/">CoinDesk ↗</a><a class="source-link" target="_blank" rel="noopener" href="https://cointelegraph.com/">Cointelegraph ↗</a><a class="source-link" target="_blank" rel="noopener" href="https://www.binance.com/en/support/announcement">Exchange announcements ↗</a></div></div>'}
  else{content='<div class="c"><h3>TradingView Screener</h3><p>Официальный скринер доступен через пункт TradingView в меню Market. Из карточки актива можно перейти в Terminal.</p><button class="b" data-a="sbt" data-t="TradingView">Открыть скринер</button></div>'}
  box.innerHTML=content;
  box.querySelectorAll('[data-market-symbol]').forEach(b=>b.addEventListener('click',()=>{const s=b.dataset.marketSymbol.replace('USDT','');localStorage.setItem('mavora_market_pick',s);route('terminal');setTimeout(()=>{const select=$('#ts');if(select){select.value=s;select.dispatchEvent(new Event('change',{bubbles:true}))}},300)}));
 }

 function table(rows){return`<div style="overflow:auto"><table><thead><tr><th>Актив</th><th>Цена</th><th>24ч</th><th>Оборот</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.symbol.replace('USDT','')}</b><span class="mu"> / USDT</span></td><td>${fmt(x.lastPrice,+x.lastPrice<1?6:2)}</td><td class="${+x.priceChangePercent>=0?'mav-up':'mav-down'}">${+x.priceChangePercent>=0?'+':''}${fmt(x.priceChangePercent,2)}%</td><td>$${fmt(+x.quoteVolume/1e6,1)}M</td><td><button class="b s" data-market-symbol="${x.symbol}">В Terminal</button></td></tr>`).join('')}</tbody></table></div>`}
 // Override Market page body safely, retain legacy discover subsections through its internal tabs when requested.
 const origRender=$('#pg').innerHTML;
 function injectMarket(){if(!$('#pg')||!$('#pg').querySelector('h1'))return;const heading=$('#pg h1');if(heading&&heading.textContent.trim()==='Discover'){heading.textContent='Market';const tabs=$('#pg .tabs');if(tabs)tabs.style.display='none';const body=$('#pg');body.insertAdjacentHTML('beforeend',`<section class="c" style="margin-top:12px"><div class="row" style="gap:6px;margin-bottom:12px">${marketTabs.map(t=>`<button class="b s ${t===marketTab?'on':''}" data-mav-market-tab="${t}">${t}</button>`).join('')}<button class="b s" id="mav-market-refresh">↻ Обновить</button></div><div id="mav-market-live"></div><p class="mav-page-note">Данные: Binance Spot public REST. Список — топ 100 USDT-пар по quote volume, не универсальный рейтинг всех бирж.</p></section>`);$$('[data-mav-market-tab]').forEach(b=>b.addEventListener('click',()=>{marketTab=b.dataset.mavMarketTab;drawMarket();$$('[data-mav-market-tab]').forEach(x=>x.classList.toggle('on',x===b))}));$('#mav-market-refresh')?.addEventListener('click',loadMarket);loadMarket();}}
 const observer=new MutationObserver(()=>{decorateNav();injectMarket();if($('#pg h1')?.textContent.trim()==='Portfolio')$('#pg h1').textContent='Account · Balance & Risk'});observer.observe($('#pg'),{childList:true,subtree:true});
 // Compact top ticker with twenty live instruments. Replaces prior ticker timer's visual only.
 async function ticker20(){const tape=$('#tape');if(!tape)return;try{const symbols=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','AVAX','LINK','TON','DOT','BCH','LTC','SUI','NEAR','APT','UNI','ETC','FIL'].map(x=>x+'USDT');const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(symbols)),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const items=data.map(x=>`<span class="mav-quote"><b>${x.symbol.replace('USDT','')}</b><span>${fmt(+x.lastPrice,+x.lastPrice<1?5:2)}</span><small class="${+x.priceChangePercent>=0?'mav-up':'mav-down'}">${+x.priceChangePercent>=0?'+':''}${fmt(x.priceChangePercent,2)}%</small></span>`).join('');tape.innerHTML=`<span class="mav-source">● BINANCE LIVE</span><div class="mav-tape-track">${items}${items}</div>`}catch(e){if(!tape.querySelector('.mav-quote'))tape.innerHTML='<span class="mav-source">MARKET DATA OFFLINE · QUOTES NOT AVAILABLE</span>'}}
 ticker20();setInterval(ticker20,15000);
 // Journal is accessible from Account; Terminal's legacy Journal tab is preserved as a shortcut.
 // Account page receives journal/calendar/notes and existing portfolio position widgets.
 const accObs=new MutationObserver(()=>{const h=$('#pg h1');if(!h||!h.textContent.startsWith('Account ·'))return;if($('#mav-account-journal'))return;const state=(()=>{try{return JSON.parse(localStorage.getItem('mv')||'{}')}catch(e){return{}}})();const trades=state.journal||state.hist||[];const closed=trades.filter(t=>t.status==='Closed'||t.p!==undefined);const months=new Date(),days=new Date(months.getFullYear(),months.getMonth()+1,0).getDate();const cells=Array.from({length:days},(_,i)=>{const d=i+1,ts=trades.filter(t=>String(t.date||'').slice(8,10)===String(d).padStart(2,'0'));const pnl=ts.reduce((a,t)=>a+(+t.p||0),0);return`<div class="mav-day ${pnl>0?'win':pnl<0?'loss':''} ${d===months.getDate()?'today':''}" title="${ts.length} сделок · ${fmt(pnl)}">${d}</div>`}).join('');$('#pg').insertAdjacentHTML('beforeend',`<section class="c" id="mav-account-journal" style="margin-top:14px"><div class="row sp"><h2>Trading Journal</h2><button class="b s" data-a="sbt" data-t="Journal">Открыть полный журнал</button></div><p class="mav-page-note">Календарь торговых дней · зелёный — плюс, красный — минус. Расчёт по сохранённым записям.</p><div class="mav-journal-calendar">${cells}</div><div class="row" style="margin-top:12px"><span class="mav-color-tag sky">Идеи</span><span class="mav-color-tag pink">Психология</span><span class="mav-color-tag yellow">План</span></div><p class="mav-page-note">Записи и заметки доступны в Trade Journal. Локальное хранение в текущем браузере; экспорт/резервная копия — в Data & Settings.</p></section>`)});accObs.observe($('#pg'),{childList:true,subtree:true});
 // Preserve all existing sections in the overflow menu, including merged configuration destination.
 document.addEventListener('click',e=>{const b=e.target.closest('.nv');if(!b)return;const m=b.dataset.m;if(m==='settings'||m==='data'){setTimeout(()=>{const h=$('#pg h1');if(h)h.textContent='Data & Settings';},20)}});
