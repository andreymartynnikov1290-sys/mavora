  <ul class="acc-note" style="margin:0;padding-left:18px;line-height:1.6">
    <li>Account summary & period PnL</li>
    <li>Efficiency metrics</li>
    <li>Drawdown</li>
    <li>Per-trade rows (CSV/JSON)</li>
  </ul>
</div>`;
};

// Keep Journal — enhance entry bar slightly by wrapping existing
const _prevJournal = SP['account:Journal'];
SP['account:Journal'] = () => {
  const head = `<div class="acc-row" style="margin-bottom:8px">
    <button class="b s" data-a="sbt" data-t="Overview">← Account Overview</button>
    <button class="b s" data-a="sbt" data-t="Performance">Performance</button>
    <button class="b s" data-a="sbt" data-t="Reports">Reports</button>
    <button class="b s" data-a="acc-export" data-fmt="csv">Export CSV</button>
    <span class="acc-note">Journal is the source of truth for realized stats</span>
  </div>`;
  try {
    return head + (typeof _prevJournal === 'function' ? _prevJournal() : (typeof jpage === 'function' ? jpage() : '<div class="c">Journal unavailable</div>'));
  } catch (e) {
    return head + (typeof jpage === 'function' ? jpage() : '<div class="c acc-empty">Journal error</div>');
  }
};

// Legacy tab redirects
['Balance', 'Assets', 'Positions', 'Orders', 'Risk'].forEach(leg => {
  SP['account:' + leg] = () => {
    S.sb = S.sb || {};
    S.sb.account = leg === 'Risk' || leg === 'Balance' ? 'Overview' : 'Overview';
    setTimeout(() => render(), 0);
    return `<div class="c mu">Moved to Account Overview / Terminal. Redirecting…</div>`;
  };
});

function downloadText(filename, text, mime) {
  const blob = new Blob([text], {type: mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportCSV() {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const head = ['date', 'symbol', 'side', 'entry', 'exit', 'qty', 'fees', 'strategy', 'risk', 'pnl', 'status'];
  const lines = [head.join(',')];
  tr.forEach(t => {
    lines.push([t.date, t.symbol, t.side, t.entry, t.exit, t.qty, t.fees, t.strategy, t.risk, jPnL(t), t.status]
      .map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(','));
  });
  downloadText('MAVORA-journal-' + per + '.csv', lines.join('\n'), 'text/csv');
  if (typeof note === 'function') note('Report CSV exported (' + tr.length + ' trades)');
}

function exportJSON() {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const st = stats(tr);
  const payload = {
    format: 'MAVORA_ACCOUNT_REPORT', version: 1, period: per, exportedAt: new Date().toISOString(),
    summary: st, trades: tr
  };
  downloadText('MAVORA-report-' + per + '.json', JSON.stringify(payload, null, 2), 'application/json');
  if (typeof note === 'function') note('Report JSON exported');
}

function exportSummary() {
  const per = S.accUI.period || '30D';
  const st = stats(tradesInPeriod(per));
  const text = st
    ? `MAVORA Account ${per}\nTrades: ${st.n}\nNet: ${money(st.net)}\nWin rate: ${st.winRate.toFixed(1)}%\nPF: ${st.pf == null ? '—' : st.pf === Infinity ? '∞' : st.pf.toFixed(2)}\nMax DD: ${money(-st.maxDD)}\nFees: ${money(st.fees)}`
    : `MAVORA Account ${per}\nInsufficient data`;
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text);
  if (typeof note === 'function') note('Summary copied');
  else alert(text);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'acc-period') {
    S.accUI.period = b.dataset.p;
    try { sv(); } catch (err) {}
    render();
  }
  if (a === 'acc-chart') {
    S.accUI.chartMode = b.dataset.m;
    try { sv(); } catch (err) {}
    render();
  }
  if (a === 'acc-privacy') {
    S.accUI.privacy = S.accUI.privacy ? 0 : 1;
    try { sv(); } catch (err) {}
    render();
  }
  if (a === 'acc-export') {
    if (b.dataset.fmt === 'csv') exportCSV();
    if (b.dataset.fmt === 'json') exportJSON();
    if (b.dataset.fmt === 'summary') exportSummary();
  }
  if (a === 'acc-jr-filter') {
    S.journalFilter = S.journalFilter || {};
    if (b.dataset.k === 'symbol') S.journalFilter.symbol = b.dataset.v || '';
    if (b.dataset.k === 'strategy') S.journalFilter.symbol = ''; // strategy filter via note
    S.sb = S.sb || {};
    S.sb.account = 'Journal';
    try { sv(); } catch (err) {}
    render();
    if (typeof note === 'function') note('Journal · filter ' + b.dataset.k + ': ' + b.dataset.v);
  }
  if (b.dataset.pro === '1' && a === 'nav' && b.dataset.m === 'terminal') {
    S.sb = S.sb || {};
    S.sb.terminal = 'Pro Desk';
    try { sv(); } catch (err) {}
  }
});

// Default subtab
if (!S.sb) S.sb = {};
if (!SUB.account.includes(S.sb.account)) S.sb.account = 'Overview';

})();
</script>

SP['terminal:Playbook'] = () => {

SP['terminal:Pre-Trade'] = () => {
  const r = Object.assign({bal:10000,riskPct:1,entry:0,stop:0,target:0,lev:3,fee:0.04,slip:0.02}, S.pb.risk || {});

${_ph}

function calcPB(){
  const bal = +($id('pb-bal')?.value || 0);
  const rp = +($id('pb-rp')?.value || 0);
  const en = +($id('pb-en')?.value || 0);
  const st = +($id('pb-st')?.value || 0);
  const tp = +($id('pb-tp')?.value || 0);
  const lev = Math.max(1, +($id('pb-lv')?.value || 1));
  const fee = +($id('pb-fee')?.value || 0) / 100;
  const slip = +($id('pb-sl')?.value || 0) / 100;
  S.pb.risk = {bal, riskPct: rp, entry: en, stop: st, target: tp, lev, fee: fee*100, slip: slip*100};
  try { sv(); } catch(e) {}
  const box = $id('pb-res');
  if (!box) return;
  if (!(bal > 0 && rp > 0 && en > 0 && st > 0) || en === st) {
    box.innerHTML = '<span class="pb-no">Need valid equity, risk %, entry and stop.</span>';
    return;
  }
  const risk$ = bal * (rp / 100);
  const dist = Math.abs(en - st);
  const qty = risk$ / dist;
  const notional = qty * en;
  const margin = notional / lev;
  // crude liq estimate for isolated linear: entry * (1 - 1/lev) for long
  const long = en > st;
  const liq = long ? en * (1 - 1 / lev) : en * (1 + 1 / lev);
  const feeCost = notional * fee * 2;
  const slipCost = notional * slip;
  const rr = tp > 0 ? Math.abs(tp - en) / dist : null;
  const netRisk = risk$ + feeCost * (risk$ / (notional || 1)) ; // rough
  box.innerHTML = `
    <div><b>Cash risk</b>: ${money(risk$)} (${rp}% of equity)</div>
    <div><b>Stop distance</b>: ${dist.toPrecision(6)}</div>
    <div><b>Position size</b>: ${qty.toPrecision(6)} units · notional ${money(notional)}</div>
    <div><b>Margin @ ${lev}x</b>: ${money(margin)}</div>
    <div><b>Approx. liq (naive)</b>: ${liq.toPrecision(6)} · verify on venue</div>
    <div><b>Fees (RT est.)</b>: ${money(feeCost)} · slip est. ${money(slipCost)}</div>
    ${rr != null ? `<div><b>R:R to target</b>: ${rr.toFixed(2)}</div>` : ''}
    <div class="mu" style="margin-top:6px">Correlate with existing positions before adding risk. Daily loss limit is a process rule — set it in Journal discipline, not here.</div>`;
}
function $id(id){ return document.getElementById(id); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'pb-strat') { S.pb.strat = b.dataset.id; try{sv()}catch(err){} render(); }
  if (a === 'pb-check') {
    S.pb.checks = S.pb.checks || {};
    S.pb.checks[b.dataset.id] = b.checked ? 1 : 0;
    try{sv()}catch(err){}
    // update style without full render if possible
    const lab = b.closest('.pb-check');
    if (lab) lab.classList.toggle('done', !!b.checked);
  }
  if (a === 'pb-calc') calcPB();
  if (a === 'pb-go') {
    S.mod = b.dataset.mod;
    S.sb = S.sb || {};
    S.sb[S.mod] = b.dataset.tab;
    if (b.dataset.tab === 'Pro Desk') S.sb.terminal = 'Pro Desk';
    try{sv()}catch(err){}
    render();
  }
  if (b.dataset.pro === '1' && a === 'nav' && b.dataset.m === 'terminal') {
    S.sb = S.sb || {}; S.sb.terminal = 'Pro Desk';
  }
});

// Persist checkbox change on change event too
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('input[data-a="pb-check"]')) {
    S.pb.checks = S.pb.checks || {};
    S.pb.checks[e.target.dataset.id] = e.target.checked ? 1 : 0;
    try{sv()}catch(err){}
  }
});

})();
</script>

<script id="mavora-terminal-v3">
(()=>{
'use strict';
/* Terminal overhaul — Level-1 trading desk per toolkit doc. Additive overrides. */

const $id = id => document.getElementById(id);
const safe = v => (typeof esc === 'function' ? esc(String(v ?? '')) : String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const money = (n,d=2) => Number.isFinite(+n) ? '$'+(+n).toLocaleString('en-US',{maximumFractionDigits:d}) : '—';
const fmtN = (n,d=2) => Number.isFinite(+n) ? (+n).toLocaleString('en-US',{maximumFractionDigits:d}) : '—';
const signPct = n => Number.isFinite(+n) ? ((+n>=0?'+':'')+(+n).toFixed(2)+'%') : '—';
const cls = n => +n>0 ? 'up' : +n<0 ? 'dn' : 'mu';

async function jget(url){
  try{ const r = await fetch(url,{cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return null; }
}

// ---- Canonical terminal tabs (Level 1 desk) ----
SUB.terminal = [
  'Charts','Structure','Flow','Book','Derivatives',
  'Risk','Playbook','Alerts','Pro Desk'
];

function termSymbols(){
  const set = new Set();
  ['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX','LINK','TON','DOT','TRX','NEAR','ATOM','ARB','OP','SUI','APT','PEPE','WIF'].forEach(s=>set.add(s));
  if (typeof AS !== 'undefined') AS.forEach(a => a&&a.s && set.add(a.s));
  if (typeof window.__MKT_TOP !== 'undefined' && Array.isArray(window.__MKT_TOP)) window.__MKT_TOP.forEach(a => a&&a.s && set.add(a.s));
  if (typeof TOP !== 'undefined' && Array.isArray(TOP)) TOP.forEach(a => a&&a.s && set.add(a.s));
  if (Array.isArray(S.wl)) S.wl.forEach(s => set.add(s));
  if (S.sel) set.add(S.sel);
  return [...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function termHead(extra=''){
  const cur = (S.sel||'BTC').toUpperCase().replace(/USDT$/,'');
  const ico = typeof coinIcon==='function' ? coinIcon(cur,20) : '';
  const opts = termSymbols().map(s => `<option value="${safe(s)}" ${s===cur?'selected':''}>${safe(s)}</option>`).join('');
  return `<div class="tm-head">
    <label class="tm-badge" style="gap:8px;cursor:pointer;padding:4px 10px">
      ${ico}
      <select id="tm-sym" data-a="tm-sym" style="background:#111;border:1px solid #333;color:#eee;border-radius:8px;padding:4px 8px;font:inherit;max-width:110px">${opts}</select>
    </label>
    <span class="tm-badge">${safe(S.tf||'1h')}</span>
    <span class="tm-badge">PAPER / ANALYSIS</span>
    ${['1m','5m','15m','1h','4h','1d'].map(t=>`<button class="b s ${S.tf===t?'on':''}" data-a="tf" data-t="${t}">${t}</button>`).join('')}
    ${extra}
  </div>`;
}

function metric(t,v,c=''){ return `<div class="tm-metric"><small>${t}</small><b class="${c}">${v}</b></div>`; }

// ========== CHARTS ==========
SP['terminal:Charts'] = () => {
  setTimeout(() => {
    try{
      if (typeof draw === 'function') draw();
      if (typeof ob === 'function') ob();
      if (S.tv && typeof tvmount === 'function') {
        const el = $id('tvw');
        if (el) tvmount(el, 'advanced-chart', {
          autosize:true, symbol:'BINANCE:'+(S.sel||'BTC')+'USDT', interval: ({'1m':'1','5m':'5','15m':'15','1h':'60','4h':'240','1d':'D'}[S.tf]||'60'),
          timezone:'Etc/UTC', theme:'dark', style:'1', locale:'en', backgroundColor:'#000000',
          hide_top_toolbar:false, allow_symbol_change:true, support_host:'https://www.tradingview.com'
        });
      }
    }catch(e){}
  }, 40);
  return `<h1>Charts · OHLCV</h1>
${termHead(`<button class="b s ${S.tv?'on':''}" data-a="tv">TradingView</button>
  ${['EMA','SMA','BB','VWAP'].map(k=>`<button class="b s ${(S.ind||{EMA:1})[k]?'on':''}" data-a="ind" data-k="${k}">${k}</button>`).join('')}`)}
<div class="tm-split">
  <div class="c" style="padding:10px">
    ${S.tv ? '<div id="tvw" style="height:min(62vh,520px)"></div>' : '<canvas id="cv" style="width:100%;height:min(62vh,480px);display:block"></canvas>'}
    <div class="mu" id="ind" style="margin-top:6px"></div>
    <p class="tm-note">Multi-TF: switch TF above. Structure on HTF, execution on working TF. TV needs http(s), not file://.</p>
  </div>
  <div>
    <div class="c"><h3>Order book</h3><div id="ob" class="tm-book"></div></div>
    <div class="c" style="margin-top:10px"><h3>Tape / delta</h3><div id="tr" class="tm-book mu">—</div></div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px">
      <button class="b s w" data-a="sbt" data-t="Structure">Structure</button>
      <button class="b s" data-a="sbt" data-t="Flow">Flow</button>
      <button class="b s" data-a="sbt" data-t="Risk">Risk</button>
    </div>
  </div>
</div>`;
};

// ========== STRUCTURE ==========
SP['terminal:Structure'] = () => {
  setTimeout(() => renderStructure(), 30);
  return `<h1>Structure & Levels</h1>
${termHead(`<button class="b s w" data-a="tm-struct-refresh">Recalc</button>`)}
<div id="tm-struct"><div class="c mu">Loading swings / EMA / ATR…</div></div>`;
};

async function renderStructure(){
  const body = $id('tm-struct'); if(!body) return;
  const sym = (S.sel||'BTC').toUpperCase().replace(/USDT$/,'')+'USDT';
  const tfMap = {'1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'};
  const tf = tfMap[S.tf] || '1h';
  body.innerHTML = '<div class="c mu">Fetching klines…</div>';
  const rows = await jget(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=120`);
  if(!rows){
    // fallback local candles
    const local = typeof cndl==='function' ? cndl(S.sel,S.tf) : null;
    if(!local){ body.innerHTML='<div class="c mu">No data. Check network.</div>'; return; }
    body.innerHTML = structureFromLocal(local);
    return;
  }
  const c = rows.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
  body.innerHTML = structureFromBars(c, tf);
}

function ema(arr,n){ if(arr.length<n)return null; let e=arr.slice(0,n).reduce((a,b)=>a+b,0)/n; const k=2/(n+1); for(let i=n;i<arr.length;i++) e=arr[i]*k+e*(1-k); return e; }
function structureFromBars(c, tf){
  const closes=c.map(x=>x.c), last=closes.at(-1);
  const e20=ema(closes,20), e50=ema(closes,50);
  const trend = last>e20 && e20>e50 ? 'BULLISH structure bias' : last<e20 && e20<e50 ? 'BEARISH structure bias' : 'RANGE / mixed';
  let tr=0; const n=Math.min(14,c.length-1);
  for(let i=c.length-n;i<c.length;i++){ const prev=c[i-1].c; tr+=Math.max(c[i].h-c[i].l, Math.abs(c[i].h-prev), Math.abs(c[i].l-prev)); }
  const atr=tr/n, atrPct=last?atr/last*100:0;
  const pivH=[], pivL=[];
  for(let i=2;i<c.length-2;i++){
    if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h) pivH.push(c[i].h);
    if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l) pivL.push(c[i].l);
  }
  const res=pivH.filter(v=>v>last).sort((a,b)=>a-b).slice(0,3);
  const sup=pivL.filter(v=>v<last).sort((a,b)=>b-a).slice(0,3);
  // simple VWAP proxy: typical price volume weighted last 24 bars
  let pv=0, vv=0; c.slice(-24).forEach(x=>{ const tp=(x.h+x.l+x.c)/3; pv+=tp*x.v; vv+=x.v; });
  const vwap = vv?pv/vv:null;
  return `<div class="tm-grid">
    ${metric('Last', fmtN(last, last<1?5:2))}
    ${metric('Bias', trend, trend.includes('BULL')?'up':trend.includes('BEAR')?'dn':'')}
    ${metric('EMA20', fmtN(e20,4))}
    ${metric('EMA50', fmtN(e50,4))}
    ${metric('ATR14', fmtN(atr,4)+' · '+fmtN(atrPct,2)+'%')}
    ${metric('VWAP~24', vwap!=null?fmtN(vwap,4):'—', '')}
  </div>
  <div class="tm-split" style="margin-top:12px">
    <div class="c"><h3>Resistance · ${safe(tf)}</h3>
      ${res.map(v=>`<div class="r2 dn"><span>${fmtN(v,4)}</span><span>${signPct((v-last)/last*100)}</span></div>`).join('')||'<span class="mu">—</span>'}
      <p class="tm-note">Swing pivots (2-bar). Confirm with volume reaction.</p>
    </div>
    <div class="c"><h3>Support · ${safe(tf)}</h3>
      ${sup.map(v=>`<div class="r2 up"><span>${fmtN(v,4)}</span><span>${signPct((last-v)/last*100)}</span></div>`).join('')||'<span class="mu">—</span>'}
      <p class="tm-note">Invalidation often beyond structure low/high + buffer (ATR).</p>
    </div>
  </div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
    <button class="b s w" data-a="sbt" data-t="Charts">Charts</button>
    <button class="b s" data-a="sbt" data-t="Flow">Flow confirm</button>
    <button class="b s" data-a="sbt" data-t="Risk">Risk / size</button>
  </div>`;
}
function structureFromLocal(c){
  return structureFromBars(c.map(x=>({...x,v:1})), S.tf||'1h');
}

// ========== FLOW ==========
SP['terminal:Flow'] = () => {
  setTimeout(() => renderFlow(), 30);
  return `<h1>Order Flow · Delta</h1>
${termHead(`<button class="b s w" data-a="tm-flow-refresh">Refresh trades</button>`)}
<div id="tm-flow"><div class="c mu">Loading aggressive trades…</div></div>`;
};

async function renderFlow(){
  const body=$id('tm-flow'); if(!body) return;
  const sym=(S.sel||'BTC').toUpperCase().replace(/USDT$/,'')+'USDT';
  body.innerHTML='<div class="c mu">Fetching aggTrades…</div>';
  const trades = await jget(`https://fapi.binance.com/fapi/v1/aggTrades?symbol=${sym}&limit=80`);
  if(!trades||!trades.length){
    body.innerHTML=`<div class="c"><p class="mu">Live trades unavailable. Tape on Charts uses simulator when offline.</p>
      <button class="b s" data-a="sbt" data-t="Charts">Open Charts tape</button>
      <p class="tm-note" style="margin-top:10px">CVD from different vendors can differ. Prefer venue data for execution decisions.</p></div>`;
    return;
  }
  let buy=0, sell=0;
  const rows = trades.slice().reverse().map(t=>{
    const q=+t.q, p=+t.p, m=t.m; // m true = buyer is maker => aggressive sell
    if(m) sell+=q; else buy+=q;
    return {p,q,side:m?'Sell':'Buy',t:t.T};
  });
  const delta = buy-sell;
  const tot = buy+sell || 1;
  body.innerHTML=`<div class="tm-grid">
    ${metric('Buy vol', fmtN(buy,3), 'up')}
    ${metric('Sell vol', fmtN(sell,3), 'dn')}
    ${metric('Delta', fmtN(delta,3), cls(delta))}
    ${metric('Buy share', fmtN(buy/tot*100,1)+'%', '')}
  </div>
  <div class="c" style="margin-top:12px;max-height:320px;overflow:auto">
    <table class="acc-table" style="width:100%"><thead><tr><th>Side</th><th>Price</th><th>Qty</th><th>Time</th></tr></thead>
    <tbody>${rows.slice(0,40).map(x=>`<tr class="${x.side==='Buy'?'up':'dn'}"><td>${x.side}</td><td>${fmtN(x.p,x.p<1?5:2)}</td><td>${fmtN(x.q,4)}</td><td class="mu">${new Date(x.t).toLocaleTimeString()}</td></tr>`).join('')}</tbody></table>
  </div>
  <p class="tm-note" style="margin-top:10px">Proxy CVD via aggTrades (taker side). Not a footprint. Confirm with structure — flow alone is not entry.</p>
  <div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">
    <button class="b s" data-a="sbt" data-t="Book">Book</button>
    <button class="b s" data-a="sbt" data-t="Structure">Structure</button>
    <button class="b s w" data-a="nav" data-m="terminal" data-pro="1">Pro Desk OF</button>
  </div>`;
}

// ========== BOOK ==========
SP['terminal:Book'] = () => {
  setTimeout(() => renderBook(), 30);
  return `<h1>Liquidity · Order Book</h1>
${termHead(`<button class="b s w" data-a="tm-book-refresh">Refresh depth</button>`)}
<div id="tm-book"><div class="c mu">Loading depth…</div></div>`;
};

async function renderBook(){
  const body=$id('tm-book'); if(!body) return;
  const sym=(S.sel||'BTC').toUpperCase().replace(/USDT$/,'')+'USDT';
  const depth = await jget(`https://fapi.binance.com/fapi/v1/depth?symbol=${sym}&limit=15`);
  if(!depth){
    body.innerHTML=`<div class="c mu">Depth API offline. Charts tab shows simulated book.</div>
      <button class="b s" data-a="sbt" data-t="Charts">Charts book</button>`;
    return;
  }
  const bids=depth.bids||[], asks=depth.asks||[];
  const bestB=+bids[0]?.[0]||0, bestA=+asks[0]?.[0]||0;
  const mid=bestB&&bestA?(bestB+bestA)/2:0;
  const spread=bestA&&bestB?bestA-bestB:0;
  const spreadBps=mid?spread/mid*10000:0;
  const sumQ=levels=>levels.reduce((s,x)=>s+(+x[1]||0),0);
  const bidQ=sumQ(bids), askQ=sumQ(asks);
  body.innerHTML=`<div class="tm-grid">
    ${metric('Best bid', fmtN(bestB, bestB<1?5:2), 'up')}
    ${metric('Best ask', fmtN(bestA, bestA<1?5:2), 'dn')}
    ${metric('Spread', fmtN(spread,4)+' · '+fmtN(spreadBps,2)+' bps')}
    ${metric('Bid/Ask qty', fmtN(bidQ,2)+' / '+fmtN(askQ,2), cls(bidQ-askQ))}
  </div>
  <div class="tm-split" style="margin-top:12px">
    <div class="c"><h3>Asks</h3><div class="tm-book">${[...asks].reverse().map(x=>`<div class="r2 dn"><span>${fmtN(+x[0],4)}</span><span>${fmtN(+x[1],4)}</span></div>`).join('')}</div></div>
    <div class="c"><h3>Bids</h3><div class="tm-book">${bids.map(x=>`<div class="r2 up"><span>${fmtN(+x[0],4)}</span><span>${fmtN(+x[1],4)}</span></div>`).join('')}</div></div>
  </div>
  <p class="tm-note" style="margin-top:10px">Venue: Binance USDⓈ-M. Large sizes can vanish. Check spread/depth before size. Aggregated mid ≠ your fill.</p>
  <div class="row" style="margin-top:8px;gap:8px"><button class="b s w" data-a="sbt" data-t="Risk">Size with slippage in mind</button></div>`;
}

// ========== DERIVATIVES ==========
SP['terminal:Derivatives'] = () => {
  setTimeout(() => renderTermDeriv(), 30);
  return `<h1>Derivatives · OI & Funding</h1>
${termHead(`<button class="b s w" data-a="tm-der-refresh">Refresh</button>`)}
<div id="tm-der"><div class="c mu">Loading…</div></div>`;
};

async function renderTermDeriv(){
  const body=$id('tm-der'); if(!body) return;
  const s=(S.sel||'BTC').toUpperCase().replace(/USDT$/,'');
  const sym=s+'USDT';
  const U='https://fapi.binance.com/fapi/v1/';
  const [px, oi, fund, ls] = await Promise.all([
    jget(U+'ticker/price?symbol='+sym),
    jget(U+'openInterest?symbol='+sym),
    jget(U+'premiumIndex?symbol='+sym),
    jget('https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol='+sym+'&period=1h&limit=1')
  ]);
  const funding = fund ? +fund.lastFundingRate*100 : null;
  const mark = fund ? +fund.markPrice : (px?+px.price:null);
  const oiV = oi ? +oi.openInterest : null;
  const lsr = Array.isArray(ls)&&ls[0] ? +ls[0].longShortRatio : null;
  body.innerHTML=`<div class="tm-grid">
    ${metric('Mark', mark!=null?fmtN(mark,mark<1?5:2):'—')}
    ${metric('Funding', funding!=null?signPct(funding):'—', funding>0.05?'dn':funding<-0.05?'up':'')}
    ${metric('Open Interest', oiV!=null?fmtN(oiV,0):'—')}
    ${metric('Long/Short acct', lsr!=null?fmtN(lsr,3):'—')}
  </div>
  <div class="c" style="margin-top:12px">
    <h3>Read correctly</h3>
    <div class="pb-bad">OI ↑ is not automatic long bias — each contract has two sides.</div>
    <div class="pb-bad">High funding is a positioning cost, not a forced reversal signal.</div>
    <div class="pb-bad">Long/Short ratio is not a standalone short trigger.</div>
  </div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
    <a class="b s" target="_blank" rel="noopener" href="https://www.coinglass.com/pro/futures/LiquidationMap?symbol=${safe(s)}">Liquidation map ↗</a>
    <button class="b s" data-a="sbt" data-t="Flow">Flow</button>
    <button class="b s w" data-a="nav" data-m="terminal" data-pro="1">Pro Desk full</button>
  </div>`;
}

// ========== RISK (merged Pre-Trade + calc) ==========
SP['terminal:Risk'] = () => {
  // reuse playbook pre-trade if present, else local
  if (typeof SP['terminal:Pre-Trade'] === 'function' && SP['terminal:Pre-Trade'] !== SP['terminal:Risk']) {
    // show enhanced risk by calling checklist content inline
  }
  const r = Object.assign({bal:+(S.bal||10000),riskPct:1,entry:0,stop:0,target:0,lev:3,fee:0.04,slip:0.02}, (S.pb&&S.pb.risk)||{});
  if(!r.entry && typeof P==='function') r.entry = +P(S.sel)||0;
  return `<h1>Risk · Position Sizing</h1>
${termHead()}
<div class="c">
  <h3>Before size</h3>
  <p class="tm-note">Size = cash risk ÷ |entry − stop|. Add fees, slippage, correlated exposure, daily loss limit.</p>
  <div class="pb-calc">
    <label>Equity $<input id="pb-bal" type="number" value="${r.bal}"></label>
    <label>Risk %<input id="pb-rp" type="number" step="0.1" value="${r.riskPct}"></label>

    <label>Leverage<input id="pb-lv" type="number" min="1" max="20" value="${r.lev}"></label>
    <label>Fee %/side<input id="pb-fee" type="number" step="0.01" value="${r.fee}"></label>

  <button class="b w" style="margin-top:10px" data-a="pb-calc">Calculate</button>

  <div class="pb-warn" style="margin-top:12px">Do not move stop farther without a tested rule. Do not average losers impulsively. Do not increase risk after a losing streak. Know invalidation before entry.</div>
</div>
<div class="c" style="margin-top:12px">
  <h3>Checklist gate</h3>
  <button class="b s w" data-a="sbt" data-t="Playbook">Strategy tools</button>
  <button class="b s" data-a="nav" data-m="account">Journal after fill</button>
  <p class="tm-note" style="margin-top:8px">Full pre-session / pre-trade checklists live under Playbook → use Decision pipeline from Market context first.</p>
</div>`;
};

// ========== ALERTS (keep simple local) ==========
SP['terminal:Alerts'] = () => {
  S.proAlerts = Array.isArray(S.proAlerts) ? S.proAlerts : (S.al||[]);
  const rows = (S.proAlerts||[]).map(a=>`<div class="r2"><span>${safe(a.symbol||a.s)} ${safe(a.cond||a.c)} ${fmtN(a.level||a.p,4)}</span>
    <button class="b s r" data-a="pro-del-alert" data-i="${a.id}">×</button></div>`).join('') || '<p class="mu">No alerts</p>';
  return `<h1>Alerts</h1>
${termHead()}
<div class="c">

};
Object.keys(redirects).forEach(leg => {

    if (redirects[leg] === null) {
      S.mod = 'account'; S.sb = S.sb||{}; S.sb.account = 'Journal';

    return `<div class="c mu">Redirecting…</div>`;
  };
});

// Ensure Pro Desk still works when selected

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if (a === 'tm-struct-refresh') renderStructure();
  if (a === 'tm-flow-refresh') renderFlow();
  if (a === 'tm-book-refresh') renderBook();
  if (a === 'tm-der-refresh') renderTermDeriv();

    if (!symbol || !(level>0)) return;
    S.proAlerts = S.proAlerts||[];
    S.proAlerts.push({id:Date.now(), symbol, cond, level, fired:false});
    try{sv()}catch(err){}
    render();
  }
  if (b.dataset.pro==='1' && a==='nav' && b.dataset.m==='terminal') {
    S.sb=S.sb||{}; S.sb.terminal='Pro Desk';

});

<script id="mavora-ux2026">
(()=>{
'use strict';
const $id=id=>document.getElementById(id);
const safe=v=>(typeof esc==='function'?esc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const fmt=(n,d=2)=>Number.isFinite(+n)?(+n).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const pct=n=>Number.isFinite(+n)?((+n>=0?'+':'')+(+n).toFixed(2)+'%'):'—';
const cls=n=>+n>0?'up':+n<0?'dn':'mu';
async function jget(u){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
function liveBadge(t){return `<span class="mav-live"><i></i>${t||'LIVE'}</span>`}
function demoBadge(t){return `<span class="mav-chip">${t||'DEMO / LOCAL'}</span>`}

/* ========== extend tabs ========== */
if(Array.isArray(SUB.discover)){
  ['Heatmap','Radar','Insights','Correlation'].forEach(t=>{if(!SUB.discover.includes(t))SUB.discover.push(t)});
}
if(Array.isArray(SUB.terminal)){

if(Array.isArray(SUB.ai)){
  ['Pulse 3D','Agent HQ'].forEach(t=>{if(!SUB.ai.includes(t))SUB.ai.push(t)});

/* ========== MARKET HEATMAP ========== */
SP['discover:Heatmap']=()=>{
  setTimeout(renderHeatmap,40);
  return `<h1 class="mav-enter">Market Heatmap</h1>
<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">${liveBadge('BINANCE 24h')}<span class="mav-chip">Size ≈ volume</span><span class="mav-chip">Color ≈ change</span>
<button class="b s w" data-a="hm-refresh">Refresh</button></div>
<div id="hm-body" class="mav-enter"><div class="c mu">Loading tickers…</div></div>`;
};
async function renderHeatmap(){
  const body=$id('hm-body'); if(!body)return;
  body.innerHTML='<div class="c mu">Fetching…</div>';
  let rows=[];
  if(typeof ensureTop100==='function') rows=await ensureTop100(true);
  if(!rows||!rows.length){
    const raw=await jget('https://api.binance.com/api/v3/ticker/24hr');
    if(raw) rows=raw.filter(x=>/USDT$/.test(x.symbol)&&!/UP|DOWN|BEAR|BULL/.test(x.symbol))
      .map(x=>({s:x.symbol.replace('USDT',''),ch:+x.priceChangePercent,v:+x.quoteVolume,p:+x.lastPrice}))
      .sort((a,b)=>b.v-a.v).slice(0,64);
  } else rows=rows.slice(0,64);
  if(!rows.length){body.innerHTML='<div class="c mu">No data</div>';return}
  const maxV=Math.max(...rows.map(x=>+x.v||0),1);
  body.innerHTML=`<div class="heat-map">${rows.map(x=>{
    const ch=+x.ch||0;
    const inten=Math.min(1,Math.abs(ch)/8);
    const bg=ch>=0?`rgba(80,160,110,${0.15+inten*0.55})`:`rgba(160,70,70,${0.15+inten*0.55})`;
    const fs=11+Math.floor((+x.v/maxV)*6);
    return `<div class="heat-cell" style="background:${bg};font-size:${fs}px" data-a="sel" data-s="${safe(x.s)}" title="${safe(x.s)} ${pct(ch)} vol ${fmt((+x.v||0)/1e6,1)}M">
      <b>${safe(x.s)}</b><span class="${cls(ch)}">${pct(ch)}</span></div>`;
  }).join('')}</div>
  <p class="mu" style="margin-top:10px">Click cell → select asset for Terminal. LIVE Binance quote volume ranking.</p>`;
}

/* ========== TRADING RADAR ========== */
SP['discover:Radar']=()=>{
  setTimeout(renderRadar,40);
  return `<h1 class="mav-enter">Trading Radar</h1>
<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">${liveBadge('SCAN')}<button class="b s w" data-a="radar-refresh">Rescan</button>
<button class="b s" data-a="sbt" data-t="Heatmap">Heatmap</button></div>
<div id="radar-body" class="mav-enter c"><div class="mu">Scanning anomalies…</div></div>`;
};
async function renderRadar(){
  const body=$id('radar-body'); if(!body)return;
  const events=[];
  let rows=[];
  if(typeof ensureTop100==='function') rows=await ensureTop100();
  if(!rows.length){
    const raw=await jget('https://api.binance.com/api/v3/ticker/24hr');
    if(raw) rows=raw.filter(x=>x.symbol.endsWith('USDT')).map(x=>({s:x.symbol.replace('USDT',''),ch:+x.priceChangePercent,v:+x.quoteVolume,p:+x.lastPrice}));
  }
  const vs=rows.map(x=>+x.v||0).sort((a,b)=>a-b);
  const med=vs[Math.floor(vs.length/2)]||1;
  rows.filter(x=>(+x.v||0)>med*3 && Math.abs(+x.ch)>3).slice(0,8).forEach(x=>{
    events.push({sev:'HIGH',title:`Volume spike · ${x.s}`,detail:`${pct(x.ch)} · ${fmt((+x.v)/1e6,1)}M quote`,s:x.s});
  });
  rows.filter(x=>Math.abs(+x.ch)>=8).sort((a,b)=>Math.abs(b.ch)-Math.abs(a.ch)).slice(0,6).forEach(x=>{
    events.push({sev:'MED',title:`Impulse · ${x.s}`,detail:pct(x.ch),s:x.s});
  });
  // funding anomalies majors
  for(const s of ['BTC','ETH','SOL']){
    const f=await jget('https://fapi.binance.com/fapi/v1/premiumIndex?symbol='+s+'USDT');
    if(f&&Math.abs(+f.lastFundingRate)>0.0003){
      events.push({sev:'MED',title:`Funding · ${s}`,detail:pct(+f.lastFundingRate*100),s});
    }
  }
  if(!events.length) events.push({sev:'LOW',title:'No strong anomalies in sample',detail:'Markets quiet vs median volume',s:'BTC'});
  body.innerHTML=`<div class="radar-list">${events.map(e=>`
    <div class="r2"><div><span class="radar-sev">${e.sev}</span> <b>${safe(e.title)}</b><div class="mu">${safe(e.detail)}</div></div>
    <button class="b s" data-a="sel" data-s="${safe(e.s)}">Terminal</button></div>`).join('')}</div>
    <p class="mu" style="margin-top:10px">Heuristic scanner on LIVE tickers + funding. Not signals — prompts for review.</p>`;
}

/* ========== AI INSIGHTS ========== */

    const weak=rows.slice().sort((a,b)=>a.ch-b.ch)[0];
    cards.push({t:'Laggard in top volume set',b:`${weak.s} ${pct(weak.ch)}. Check if sector-wide or idiosyncratic.`,src:'Binance LIVE'});
  }
  cards.push({t:'Process reminder',b:'Structure → liquidity → flow → positioning → risk. Skip layers only deliberately.',src:'Playbook'});
  body.innerHTML=cards.map(c=>`<div class="mav-card"><div class="row sp"><b>${safe(c.t)}</b><span class="mav-chip">${safe(c.src)}</span></div><p class="mu" style="margin:8px 0 0;line-height:1.5">${safe(c.b)}</p></div>`).join('')||'<div class="c mu">No insights</div>';
}

/* ========== CORRELATION ========== */
SP['discover:Correlation']=()=>{
  setTimeout(renderCorr,40);
  return `<h1 class="mav-enter">Correlation Matrix</h1>
<div class="row" style="gap:8px;margin-bottom:12px">${liveBadge('BINANCE 1h closes')}<span class="mav-chip">Pearson · ~48 bars</span>
<button class="b s w" data-a="corr-refresh">Recompute</button></div>
<div id="corr-body" class="c mav-enter mu">Computing…</div>`;
};
function pearson(a,b){
  const n=Math.min(a.length,b.length); if(n<5)return null;
  let sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(let i=0;i<n;i++){const x=a[i],y=b[i];sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y}
  const num=n*sxy-sx*sy, den=Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));
  return den?num/den:null;
}
async function renderCorr(){
  const body=$id('corr-body'); if(!body)return;
  const syms=['BTC','ETH','SOL','BNB','XRP','DOGE','LINK','AVAX'];
  const series={};
  await Promise.all(syms.map(async s=>{
    const k=await jget(`https://api.binance.com/api/v3/klines?symbol=${s}USDT&interval=1h&limit=50`);
    if(k) series[s]=k.map(x=>+x[4]);
  }));
  const ok=syms.filter(s=>series[s]?.length>10);
  if(ok.length<3){body.innerHTML='Insufficient history';return}
  let html='<table class="corr-table"><thead><tr><th></th>'+ok.map(s=>`<th>${s}</th>`).join('')+'</tr></thead><tbody>';
  ok.forEach(a=>{
    html+=`<tr><th>${a}</th>`;
    ok.forEach(b=>{
      if(a===b){html+='<td class="mu">1.00</td>';return}
      const r=pearson(series[a],series[b]);
      const v=r==null?'—':r.toFixed(2);
      const bg=r==null?'transparent':`rgba(${r>0?80:160},${r>0?160:80},100,${Math.min(0.75,Math.abs(r)*0.7)})`;
      html+=`<td style="background:${bg}">${v}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table><p class="mu" style="margin-top:10px">LIVE hourly closes. Correlation ≠ causation; regimes shift.</p>';
  body.innerHTML=html;
}

SP['ai:Agent HQ']=()=>{
  const agents=(typeof AGN!=='undefined'?AGN:null)||[
    {n:'SCOUT',role:'Scan volume & movers',st:'IDLE'},

async function loadReplay(){
  const sym=(S.sel||'BTC')+'USDT';
  const k=await jget(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${S.tf||'15m'}&limit=120`);
  if(!k){const lb=$id('rp-label');if(lb)lb.textContent='No data';return}
  S.replay.bars=k.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],t:x[0]}));
  S.replay.i=20; drawReplay();
}
function drawReplay(){
  const cv=$id('rp-cv'); if(!cv||!S.replay.bars.length)return;
  const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight||280;
  cv.width=w*d;cv.height=h*d;const ctx=cv.getContext('2d');ctx.scale(d,d);
  const n=Math.max(10,Math.min(S.replay.i,S.replay.bars.length));
  const bars=S.replay.bars.slice(0,n);
  let hi=Math.max(...bars.map(b=>b.h)),lo=Math.min(...bars.map(b=>b.l));
  const pad=(hi-lo)*0.08||1;hi+=pad;lo-=pad;
  const Y=v=>h-(v-lo)/(hi-lo)*(h-20)-10;
  const cw=w/bars.length;
  bars.forEach((b,i)=>{
    const x=i*cw+cw*0.2; const up=b.c>=b.o;
    ctx.strokeStyle=up?'#6aab7a':'#ab6a6a';ctx.beginPath();ctx.moveTo(i*cw+cw/2,Y(b.h));ctx.lineTo(i*cw+cw/2,Y(b.l));ctx.stroke();
    ctx.fillStyle=up?'#6aab7a':'#ab6a6a';
    ctx.fillRect(x,Y(Math.max(b.o,b.c)),cw*0.6,Math.max(1,Math.abs(Y(b.o)-Y(b.c))));
  });
  const lb=$id('rp-label'); if(lb) lb.textContent=`Bar ${n}/${S.replay.bars.length} · close ${fmt(bars.at(-1).c,2)}`;
  const sk=$id('rp-seek'); if(sk){sk.max=S.replay.bars.length;sk.value=n}
}
let rpTimer=null;
function rpTick(){
  if(!S.replay.playing)return;
  if(S.replay.i>=S.replay.bars.length){S.replay.playing=0;return}
  S.replay.i++; drawReplay();
  rpTimer=setTimeout(rpTick, 400/ (S.replay.speed||1));
}

SP['market:Publish'] = () => {

  ${(S.mkl||[]).map((L,i)=>`<div class="r2"><span><b>${safe(L.n)}</b> · ${safe(L.c)} · $${safe(L.p)}</span>
    <button class="b s r" data-a="mp-del-listing" data-i="${i}">Delete</button></div>`).join('') || '<p class="mu">No listings yet</p>'}
</div>`;

PG.market = () => SP['market:Catalog']();
function mkt(){ return SP['market:Catalog'](); }

// Handlers
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'mp-toggle') mpToggle(b.dataset.id);
  if (a === 'mp-apply') { if (typeof note === 'function') note('Application recorded (demo)'); }
  if (a === 'mp-search') {
    S.mpq = ($id('mp-q') && $id('mp-q').value) || '';
    S.mpSort = ($id('mp-sort') && $id('mp-sort').value) || 'name';
    try { sv(); } catch(err) {}
    render();
  }
  if (a === 'mp-publish') {
    const n = ($id('mln') && $id('mln').value || '').trim();
    if (!n) return;
    S.mkl = S.mkl || [];
    S.mkl.unshift({n, c: $id('mlc')?.value || 'Indicators', p: $id('mlp')?.value || '0', d: $id('mld')?.value || ''});
    try { sv(); } catch(err) {}
    if (typeof note === 'function') note('Listing published locally');
    S.sb = S.sb || {}; S.sb.market = 'Catalog';
    render();
  }
  if (a === 'mp-del-listing') {
    S.mkl.splice(+b.dataset.i, 1);
    try { sv(); } catch(err) {}
    render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'mp-q') {
    S.mpq = e.target.value || '';
    try { sv(); } catch(err) {}
    render();
  }
});
function $id(id){ return document.getElementById(id); }

if (!S.sb) S.sb = {};
if (!SUB.market.includes(S.sb.market)) S.sb.market = 'Catalog';

})();
</script>

<script id="mavora-academy-v2">
(()=>{
'use strict';
const safe=v=>(typeof esc==='function'?esc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

S.acad=S.acad||{course:'foundations',lesson:0,done:{},quiz:{},xp:0};
// sanitize legacy courses so old UI never divides by zero
if (Array.isArray(S.courses)) {
  S.courses.forEach(c => {
    if (!c) return;
    c.tot = Math.max(1, +c.tot || 1);
    c.done = Math.max(0, Math.min(+c.done || 0, c.tot));
  });
}

S.qz=S.qz||{};

/** Curriculum aligned with MAVORA market/tools docs */
const CURRICULUM = {
  foundations: {
    title: 'Foundations of Crypto Markets',
    level: 'Beginner',
    goal: 'Read the market without signal noise. Context before entries.',
    lessons: [
      {id:'f1', title: 'What moves crypto prices',
        body:`<p>Price is the last agreed trade. Behind it: spot demand, derivatives positioning, liquidity, and narratives.</p>
<ul><li><b>Spot</b> — real asset transfer (or IOU on CEX).</li>
<li><b>Perpetual futures</b> — leveraged exposure, funding, liquidations.</li>
<li><b>Narratives</b> — narratives move flows; flows move price.</li></ul>
<p>MAVORA rule: never treat a single indicator as a trade. Start with market context (Market → Overview).</p>`},
      {id:'f2', title: 'Market structure basics',
        body:`<p>Structure is the sequence of swing highs and lows.</p>
<ul><li><b>Uptrend</b> — higher highs and higher lows.</li>
<li><b>Downtrend</b> — lower highs and lower lows.</li>
<li><b>Range</b> — repeated acceptance between bounds.</li></ul>
<p>Practice: Terminal → Structure. Mark support/resistance from pivots. Invalidation is beyond structure, not a random round number.</p>`},
      {id:'f3', title: 'Timeframes and hierarchy',
        body:`<p>Higher timeframe (HTF) sets bias; lower timeframe (LTF) times entry.</p>
<ul><li>Daily / 4H — regime and major levels.</li>
<li>1H — working structure.</li>
<li>15m / 5m — execution only after HTF context.</li></ul>
<p>Contradiction between TF = reduce size or stand aside.</p>`},
      {id:'f4', title: 'Volume, liquidity, slippage',
        body:`<p>You do not trade mid-price. You trade venue liquidity.</p>
<ul><li>Check spread and depth on the exchange you execute (Terminal → Book).</li>
<li>Large size vs thin book = slippage.</li>
<li>Aggregator price ≠ your fill.</li></ul>
<p>If book is hostile, the setup is incomplete — NO TRADE.</p>`},
      {id:'f5', title: 'Risk before reward',
        body:`<p>Position size = cash risk ÷ distance from entry to stop.</p>
<ul><li>Define invalidation first.</li>
<li>Risk % of equity (commonly 0.25–1% while learning).</li>
<li>Never move stop farther without a pre-tested rule.</li></ul>
<p>Practice: Terminal → Risk calculator. Log every paper trade in Journal.</p>`}
    ],
    quiz: [
      {q:'What should come first before an entry idea?', opts:['Funding rate alone','Market context & structure','CMC trending rank','A single RSI cross'], a:1},
      {q:'Position size is primarily driven by…', opts:['Maximum leverage','Distance to stop and cash risk','Twitter sentiment','Open interest rising'], a:1},
      {q:'Aggregator mid-price…', opts:['Equals your fill','Replaces venue book','Is not your execution price','Guarantees best bid'], a:2}
    ]
  },
  derivatives: {
    title: 'Derivatives Literacy',
    level: 'Intermediate',
    goal: 'Read OI, funding, liquidations without superstition.',
    lessons: [
      {id:'d1', title: 'Perps, margin, liquidation',
        body:`<p>Perpetual futures track spot via funding. Leverage amplifies both PnL and liquidation risk.</p>
<ul><li>Initial vs maintenance margin.</li>
<li>Liquidation is a venue process — know your distance.</li>
<li>Cross vs isolated margin changes account risk shape.</li></ul>`},
      {id:'d2', title: 'Open Interest correctly',
        body:`<p><b>OI up is not “more longs.”</b> Every contract has a buyer and a seller.</p>
<ul><li>OI ↑ + price ↑ — new risk added, direction not proven by OI alone.</li>
<li>OI ↓ — risk removed (closes, liquidations).</li></ul>
<p>Use OI as context with price and flow (Terminal → Derivatives).</p>`},
      {id:'d3', title: 'Funding as cost, not oracle',
        body:`<p>Positive funding: longs pay shorts. Extreme funding = crowded positioning cost.</p>
<ul><li>Not a standalone reversal signal.</li>
<li>Combine with structure and event risk.</li></ul>`},
      {id:'d4', title: 'Liquidation maps',
        body:`<p>Heatmaps are often models of where stops/liq clusters might sit.</p>
<ul><li>Not guaranteed magnets.</li>
<li>Prefer actual liquidation prints when available.</li>
<li>External tools (e.g. CoinGlass) for maps — MAVORA links, does not invent heatmap numbers.</li></ul>`}
    ],
    quiz: [
      {q:'Rising OI always means bulls are in control?', opts:['Yes','No — each contract has two sides','Only on Fridays','Only if funding is positive'], a:1},
      {q:'High funding should be treated as…', opts:['Automatic short signal','Positioning cost / context','Proof of infinite trend','Risk-free arb'], a:1}
    ]
  },
  process: {
    title: 'Professional Process',
    level: 'Intermediate',
    goal: 'Daily routine, pre-trade checklist, journal edge.',
    lessons: [
      {id:'p1', title: 'Pre-session routine',
        body:`<ol><li>Market cap, dominance, breadth (Market → Overview).</li>
<li>Sectors and leaders.</li>
<li>Macro calendar / news.</li>
<li>Liquid names only.</li>
<li>Regime for BTC/ETH.</li>
<li>HTF levels marked.</li></ol>`},
      {id:'p2', title: 'Pre-trade checklist',
        body:`<ol><li>Structure 4H/1H + working TF.</li>
<li>VWAP / levels / range.</li>
<li>Venue book: spread, depth.</li>
<li>Flow: delta / CVD proxy.</li>
<li>OI, funding, events.</li>
<li>Written scenario + invalidation.</li>
<li>Size and max loss calculated.</li>
<li>If data conflicts → NO TRADE.</li></ol>
<p>Terminal → Risk / Playbook.</p>`},
      {id:'p3', title: 'Journal and statistics',
        body:`<p>One trade proves nothing. Track series:</p>
<ul><li>Win rate, average win/loss, expectancy, profit factor.</li>
<li>Max drawdown, fees.</li>
<li>Results by setup and by asset.</li></ul>
<p>Account → Performance uses your Journal as source of truth.</p>`},
      {id:'p4', title: 'Backtest humility',
        body:`<ul><li>Formal rules first.</li>
<li>Include fees, funding, slippage.</li>
<li>Out-of-sample and different regimes.</li>
<li>Pretty curves can be curve-fit.</li></ul>`}
    ],
    quiz: [
      {q:'If checklist items conflict, you should…', opts:['Increase leverage','Force the trade','Prefer NO TRADE','Ignore the book'], a:2},
      {q:'Expectancy is…', opts:['Win rate only','Average net result per trade','Maximum leverage','Funding average'], a:1}
    ]
  },
  playbook: {
    title: 'Strategy Families',
    level: 'Advanced',
    goal: 'Match tools to strategy type; know failure modes.',
    lessons: [
      {id:'s1', title: 'Trend following',
        body:`<p>Needs: HTF structure, EMA/VWAP aids, volume, ATR, optional OI/funding context, trailing or structure exit.</p>
<p>Failure: ranging chop, late entries, stops too tight vs ATR.</p>`},
      {id:'s2', title: 'Breakout / retest',
        body:`<p>Needs: levels, volume, flow confirmation, acceptable slippage, event awareness.</p>
<p>Failure: fake breaks without acceptance, news spikes, thin books.</p>`},
      {id:'s3', title: 'Mean reversion discipline',
        body:`<p>Only in proven ranges. Do not fade strong impulse mechanically.</p>
<p>Needs: VWAP/VP, fade signals, liquidity, news filter.</p>`},
      {id:'s4', title: 'ICT/SMC terms',
        body:`<p>Sweeps, FVG, order blocks only help if definitions are testable and journaled.</p>
<p>Labels alone ≠ edge.</p>`}
    ],
    quiz: [
      {q:'Mean reversion is safest when…', opts:['Impulse is vertical','Range is proven and impulse fades','Funding is extreme only','OI is at ATH'], a:1},
      {q:'Strategy labels without testable rules…', opts:['Guarantee profit','Are sufficient for live size','Do not create statistical edge','Replace risk management'], a:2}
    ]
  }
};

SUB.academy = ['Path', 'Courses', 'Lesson', 'Practice', 'Progress', 'Glossary', 'Certificates'];

function acadDone(courseId, lessonId){
  const k = courseId + ':' + lessonId;
  return !!(S.acad.done && S.acad.done[k]);
}
function acadMark(courseId, lessonId){
  S.acad.done = S.acad.done || {};
  const k = courseId + ':' + lessonId;
  if (!S.acad.done[k]) {
    S.acad.done[k] = 1;
    S.acad.xp = (S.acad.xp || 0) + 10;
  }
  try { sv(); } catch(e) {}
}
function courseProgress(cid){
  const c = CURRICULUM[cid];
  if (!c || !Array.isArray(c.lessons) || !c.lessons.length) return {d:0,n:0,pct:0};
  const n = c.lessons.length;
  const d = c.lessons.filter(l => acadDone(cid, l.id)).length;
  return {d, n, pct: Math.max(0, Math.min(100, Math.round(d / n * 100)))};
}
function totalProgress(){
  let d = 0, n = 0;
  Object.keys(CURRICULUM).forEach(cid => {
    const p = courseProgress(cid); d += p.d; n += p.n;
  });
  return {d, n, pct: n ? Math.round(d / n * 100) : 0};
}

SP['academy:Path'] = () => {
  const t = totalProgress();
  return `<h1>Academy · Learning Path</h1>
<div class="ac-card" style="margin-bottom:14px">
  <div class="row sp"><b>Overall progress</b><span class="mu">${t.d}/${t.n} lessons · ${t.pct}% · XP ${S.acad.xp||0}</span></div>
  <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+t.pct||0))}%"></span></div>
  <p class="mu" style="margin:8px 0 0;line-height:1.45">Curriculum mirrors MAVORA’s market process: context → structure → liquidity → flow → derivatives → risk → journal. Educational only — not financial advice.</p>
</div>
<div class="ac-grid">${Object.entries(CURRICULUM).map(([id,c])=>{
  const p=courseProgress(id);
  return `<div class="ac-card">
    <div class="row sp"><span class="ac-tag">${safe(c.level)}</span><span class="mu">${p.pct}%</span></div>
    <h3>${safe(c.title)}</h3>
    <p class="mu" style="line-height:1.4">${safe(c.goal)}</p>
    <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+p.pct||0))}%"></span></div>
    <button class="b s w" data-a="ac-open" data-course="${id}" style="margin-top:8px">Open course</button>
  </div>`;
}).join('')}</div>
<div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px">
  <button class="b s" data-a="nav" data-m="discover">Practice: Market</button>
  <button class="b s" data-a="nav" data-m="terminal">Practice: Terminal</button>
  <button class="b s" data-a="nav" data-m="account">Journal</button>
</div>`;
};

SP['academy:Courses'] = () => {
  const cid = S.acad.course || 'foundations';
  const c = CURRICULUM[cid]; if (!c) return `<div class="c">Unknown course</div>`;
  const p = courseProgress(cid);
  return `<h1>Course · ${safe(c.title)}</h1>
<div class="ac-path">${Object.keys(CURRICULUM).map(id=>`<button class="b s ${id===cid?'on':''}" data-a="ac-open" data-course="${id}">${safe(CURRICULUM[id].title.split(' ')[0])}</button>`).join('')}</div>
<div class="ac-card" style="margin-bottom:12px">
  <span class="ac-tag">${safe(c.level)}</span>
  <p class="mu">${safe(c.goal)}</p>
  <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+p.pct||0))}%"></span></div>
  <span class="mu">${p.d}/${p.n} complete</span>
</div>
${c.lessons.map((l,i)=>{
  const done=acadDone(cid,l.id);
  return `<div class="ac-lesson">
    <div class="row sp"><h4>${i+1}. ${safe(l.title)}</h4><span class="${done?'ac-done':'mu'}">${done?'Done':'To do'}</span></div>
    <button class="b s w" data-a="ac-lesson" data-course="${cid}" data-l="${i}">Open lesson</button>
  </div>`;
}).join('')}
<div class="row" style="margin-top:10px;gap:8px">
  <button class="b s" data-a="sbt" data-t="Practice">Course quiz</button>
  <button class="b s" data-a="sbt" data-t="Certificates">Certificates</button>
</div>`;
};

SP['academy:Lesson'] = () => {
  const cid = S.acad.course || 'foundations';
  const c = CURRICULUM[cid];
  const i = Math.min(S.acad.lesson|0, (c?.lessons.length||1)-1);
  const l = c?.lessons[i];
  if (!l) return `<div class="c">Select a lesson from Courses</div>`;

  return `<h1>Lesson</h1>

  <button class="b s" data-a="sbt" data-t="Courses">← Course</button>
  <span class="ac-tag">${safe(c.title)}</span>

    ${i<c.lessons.length-1?`<button class="b s" data-a="ac-lesson" data-course="${cid}" data-l="${i+1}">Next</button>`:`<button class="b s" data-a="sbt" data-t="Practice">Take quiz</button>`}
  </div>
</div>`;
};

SP['academy:Practice'] = () => {
  const cid = S.acad.course || 'foundations';
  const c = CURRICULUM[cid];
  const quiz = c?.quiz || [];
  const ans = (S.acad.quiz && S.acad.quiz[cid]) || {};
  let score = 0, answered = 0;
  quiz.forEach((q,i)=>{ if(ans[i]!==undefined){ answered++; if(+ans[i]===q.a) score++; }});
  return `<h1>Practice · Quiz</h1>
<div class="ac-path">${Object.keys(CURRICULUM).map(id=>`<button class="b s ${id===cid?'on':''}" data-a="ac-open" data-course="${id}">${safe(CURRICULUM[id].title.split(' ')[0])}</button>`).join('')}</div>
<div class="ac-card" style="margin-bottom:12px"><b>${safe(c.title)}</b>
  <div class="mu">Score ${score}/${quiz.length}${answered<quiz.length?' · in progress':''}</div></div>
${quiz.map((q,i)=>{
  const a=ans[i];
  return `<div class="ac-lesson ac-quiz">
    <h4>${i+1}. ${safe(q.q)}</h4>
    <div class="row" style="flex-wrap:wrap">${q.opts.map((o,j)=>`<button class="b s ${a===j?'on':''}" data-a="ac-ans" data-course="${cid}" data-q="${i}" data-o="${j}">${safe(o)}</button>`).join('')}</div>
    ${a!==undefined?`<div class="${+a===q.a?'ac-done':'dn'}" style="margin-top:8px">${+a===q.a?'Correct':'Incorrect — review the lesson'}</div>`:''}
  </div>`;
}).join('')}
<div class="row" style="gap:8px;margin-top:10px">
  <button class="b s" data-a="ac-quiz-reset" data-course="${cid}">Reset quiz</button>
  <button class="b s" data-a="sbt" data-t="Lesson">Back to lessons</button>
</div>
<div class="c" style="margin-top:14px">
  <h3>Drills in the app</h3>
  <div class="row" style="flex-wrap:wrap;gap:8px">
    <button class="b s w" data-a="nav" data-m="discover">Market Overview</button>
    <button class="b s" data-a="nav" data-m="terminal" data-tab="Structure">Structure</button>
    <button class="b s" data-a="nav" data-m="terminal" data-tab="Risk">Risk calc</button>
    <button class="b s" data-a="nav" data-m="account">Journal</button>
  </div>
</div>`;
};

SP['academy:Progress'] = () => {
  const t = totalProgress();
  return `<h1>Academy · Progress</h1>
<div class="ac-card"><div class="row sp"><b>Completion</b><span>${t.pct}%</span></div>
  <div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+t.pct||0))}%"></span></div>
  <div class="r2"><span>Lessons done</span><b>${t.d}/${t.n}</b></div>
  <div class="r2"><span>XP</span><b>${S.acad.xp||0}</b></div>
</div>
<div class="ac-grid" style="margin-top:12px">${Object.entries(CURRICULUM).map(([id,c])=>{
  const p=courseProgress(id);
  return `<div class="ac-card"><h3>${safe(c.title)}</h3><div class="ac-prog"><span class="ac-fill" style="width:${Math.max(0,Math.min(100,+p.pct||0))}%"></span></div>
    <span class="mu">${p.d}/${p.n} · ${safe(c.level)}</span>
    <button class="b s" data-a="ac-open" data-course="${id}" style="margin-top:8px">Continue</button></div>`;
}).join('')}</div>`;
};

SP['academy:Glossary'] = () => {
  const terms = [
    ['OHLCV','Open, high, low, close, volume — basic candle data.'],
    ['HTF / LTF','Higher / lower timeframe. Bias vs execution.'],
    ['Invalidation','Price level where the trade idea is wrong — usually the stop basis.'],
    ['VWAP','Volume-weighted average price — institutional reference, not magic.'],
    ['OI','Open interest — outstanding derivative contracts.'],
    ['Funding','Periodic payment between longs and shorts on perps.'],
    ['CVD / Delta','Cumulative volume delta / aggressive buy vs sell proxy.'],
    ['Expectancy','Average net PnL per trade over a series.'],
    ['Profit factor','Gross profits ÷ gross losses.'],
    ['Slippage','Difference between expected and filled price.'],
    ['NO TRADE','Valid outcome when checklist fails.']
  ];
  return `<h1>Academy · Glossary</h1>
<div class="ac-grid">${terms.map(([t,d])=>`<div class="ac-card"><h3>${safe(t)}</h3><p class="mu" style="line-height:1.45;margin:0">${safe(d)}</p></div>`).join('')}</div>`;
};

SP['academy:Certificates'] = () => {
  const ready = Object.entries(CURRICULUM).filter(([id])=>courseProgress(id).pct===100);
  return `<h1>Academy · Certificates</h1>
<p class="mu">Local completion badges for this browser profile. Not accredited credentials.</p>
<div class="ac-grid">${Object.entries(CURRICULUM).map(([id,c])=>{
  const p=courseProgress(id);
  const ok=p.pct===100;
  return `<div class="ac-card">
    <h3>${safe(c.title)}</h3>
    <div class="mu">${ok?'Requirements met':'Complete all lessons ('+p.d+'/'+p.n+')'}</div>
    <button class="b s ${ok?'w':''}" data-a="ac-cert" data-course="${id}" ${ok?'':'disabled'} style="margin-top:10px">${ok?'View certificate':'Locked'}</button>
  </div>`;
}).join('')}</div>`;
};

PG.academy = () => SP['academy:Path']();
function acad(){ return SP['academy:Path'](); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'ac-open') {
    S.acad.course = b.dataset.course; S.acad.lesson = 0;
    S.sb = S.sb || {}; S.sb.academy = 'Courses';
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-lesson') {
    S.acad.course = b.dataset.course; S.acad.lesson = +b.dataset.l;
    S.sb = S.sb || {}; S.sb.academy = 'Lesson';
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-complete') {
    acadMark(b.dataset.course, b.dataset.id);
    if (typeof note === 'function') note('Lesson complete · +10 XP');
    render();
  }
  if (a === 'ac-ans') {
    S.acad.quiz = S.acad.quiz || {};
    S.acad.quiz[b.dataset.course] = S.acad.quiz[b.dataset.course] || {};
    S.acad.quiz[b.dataset.course][b.dataset.q] = +b.dataset.o;
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-quiz-reset') {
    if (S.acad.quiz) delete S.acad.quiz[b.dataset.course];
    try { sv(); } catch(err) {} render();
  }
  if (a === 'ac-cert') {
    const c = CURRICULUM[b.dataset.course];
    if (typeof modal === 'function') {
      modal(`<h3>MAVORA Academy</h3><p>This profile completed <b>${safe(c.title)}</b>.</p>
        <p class="mu">Educational badge · local only · ${new Date().toLocaleDateString()}</p>
        <button class="b w" data-a="x">Close</button>`);
    } else if (typeof note === 'function') note('Certificate: ' + c.title);
  }
  if (b.dataset.tab && a === 'nav' && b.dataset.m === 'terminal') {
    S.sb = S.sb || {}; S.sb.terminal = b.dataset.tab;
  }
});

if (!S.sb) S.sb = {};
if (!SUB.academy.includes(S.sb.academy)) S.sb.academy = 'Path';

})();
</script>



<style id="mavora-hero-logo-css">
.hero{overflow:visible;min-height:200px}
.hero-sky.hero-logo{
  position:absolute; right:clamp(4px,2vw,28px); top:50%; transform:translateY(-50%);
  width:min(48%,380px); min-width:160px; height:auto; aspect-ratio:1;
  display:grid; place-items:center; pointer-events:none; z-index:2;
  perspective:none; cursor:default;
}
.hero-logo .logo-stage{
  width:100%; height:100%; display:grid; place-items:center;
  transform:none!important; overflow:visible; background:transparent;
}
.hero-logo .hero-mark{
  width:100%; height:auto; max-height:min(280px,52vw);
  object-fit:contain; display:block;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.55)) drop-shadow(0 0 40px rgba(255,255,255,.06));
  user-select:none; -webkit-user-drag:none;
}
.hero-logo .sky-haze,.hero-logo .sky-orbit,.hero-logo .sky-body,
.hero-logo .sky-cloud,.hero-logo .sky-stars,.hero-logo .sky-icon,
.hero-logo .sky-caption{display:none!important}
/* session clocks stay below hero content, not over logo */
.session-bar{position:relative; z-index:4; margin-top:8px; background:transparent}
@media(max-width:700px){
  .hero-sky.hero-logo{width:min(50%,200px); min-width:120px; right:4px}
  .hero-logo .hero-mark{max-height:170px}
}
</style>

<style id="mavora-social-v2-css">
.so-grid{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:14px}
.so-card{background:linear-gradient(165deg,#121212,#0a0a0a);border:1px solid #262626;border-radius:16px;padding:14px;margin-bottom:12px}
.so-card h3{margin:0 0 6px;font-size:14px}
.so-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.so-tag{font-size:10px;border:1px solid #333;border-radius:99px;padding:2px 8px;color:#aaa}
.so-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.so-composer textarea{width:100%;min-height:72px;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:12px;color:#eee;padding:10px;font:inherit;resize:vertical}
.so-side .so-card{position:sticky;top:8px}
.so-user{font-weight:600}
.so-time{color:#666;font-size:11px}
.so-body{color:#c8c8c8;font-size:13px;line-height:1.5;margin:0}
.so-cm{border-top:1px solid #1a1a1a;margin-top:10px;padding-top:8px}
.so-cm .r2{font-size:12px;color:#999}
.so-empty{text-align:center;padding:28px;color:#666}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.co-card{background:linear-gradient(165deg,#121212,#0a0a0a);border:1px solid #262626;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.co-card h3{margin:0;font-size:15px}
@media(max-width:900px){.so-grid{grid-template-columns:1fr}}
</style>
<script id="mavora-social-v2">
(()=>{
'use strict';
const safe=v=>(typeof esc==='function'?esc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const $id=id=>document.getElementById(id);
const nowTs=()=>new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ---------- state ---------- */
S.posts=Array.isArray(S.posts)?S.posts:[];
S.com=Array.isArray(S.com)?S.com:[];
S.fol=Array.isArray(S.fol)?S.fol:[];
S.ms=S.ms&&typeof S.ms==='object'?S.ms:{};
S.prof=S.prof||{n:(S.pf&&S.pf.n)||'You',s:(S.pf&&S.pf.s)||'Trader',b:(S.pf&&S.pf.bio)||''};
S.so=S.so||{filter:'all',ideaDir:'',q:'',topic:'all'};
S.co=S.co||{tabRoom:null,rooms:{}};

if(!S.posts.length){
  S.posts=[
    {id:1,u:'trader_alpha',t:'BTC holds structure above prior day low. Waiting for 1H acceptance before continuation.',tk:'BTC',dir:'Long',st:'Active',likes:12,liked:0,saved:0,cm:['Agree on invalidation below the low.'],ts:'demo'},
    {id:2,u:'quant_mia',t:'ETH funding elevated — not a short by itself. Watching for structure break first.',tk:'ETH',dir:'Short',st:'Draft',likes:5,liked:0,saved:0,cm:[],ts:'demo'}
  ];
}
if(!S.com.length){
  S.com=[
    {id:1,n:'Day Traders',j:1,d:'Intraday setups, risk and session review',members:128,topic:'intraday'},
    {id:2,n:'Order Flow Lab',j:0,d:'Delta, CVD, footprint discussions',members:86,topic:'flow'},
    {id:3,n:'Long-term Holders',j:0,d:'Multi-week bias and portfolio construction',members:210,topic:'swing'},
    {id:4,n:'AI Quant Club',j:0,d:'Agents, rules and paper research',members:64,topic:'ai'}
  ];
}

SUB.social=['Feed','Explore','Ideas','Saved','Messages','Following','Profile','Activity'];
SUB.community=['Discover','My','Rooms','Events','Leaderboard','Create'];

function meName(){return (S.prof&&S.prof.n)||(S.pf&&S.pf.n)||'You';}
function postById(id){return (S.posts||[]).find(p=>+p.id===+id);}
function comById(id){return (S.com||[]).find(c=>+c.id===+id);}

function soCard(p){
  const mine=(p.u||'').startsWith('You')||p.u===meName()||(p.u||'').startsWith('Вы');
  const cm=(p.cm||[]).map(c=>`<div class="r2">${safe(typeof c==='string'?c:(c.u+': '+c.t))}</div>`).join('');
  return `<article class="so-card" data-pid="${p.id}">
    <div class="so-meta">
      <span class="so-user">${safe(p.u)}</span>
      <span class="so-tag">${safe(p.tk||'—')}</span>
      <span class="so-tag">${safe(p.dir||'—')}</span>
      <span class="so-tag">${safe(p.st||'Active')}</span>
      <span class="so-time">${safe(p.ts||'')}</span>
    </div>
    <p class="so-body">${safe(p.t)}</p>
    <div class="so-actions">
      <button type="button" class="b s ${p.liked?'on':''}" data-a="so-like" data-id="${p.id}">♥ ${p.likes||0}</button>
      <button type="button" class="b s ${p.saved?'on':''}" data-a="so-save" data-id="${p.id}">Save</button>
      <button type="button" class="b s" data-a="so-status" data-id="${p.id}">Status</button>
      <button type="button" class="b s w" data-a="sel" data-s="${safe(p.tk||'BTC')}">Terminal</button>
      ${mine?`<button type="button" class="b s r" data-a="so-del" data-id="${p.id}">Delete</button>`:''}
    </div>
    <div class="so-cm">${cm||'<div class="mu" style="font-size:12px">No comments</div>'}
      <div class="row" style="margin-top:8px;gap:6px">
        <input id="cm${p.id}" placeholder="Comment…" style="flex:1">
        <button type="button" class="b s w" data-a="so-cmt" data-id="${p.id}">Reply</button>
      </div>
    </div>
  </article>`;
}

function soComposer(){
  const syms=(typeof AS!=='undefined'?AS:[{s:'BTC'},{s:'ETH'}]).map(a=>a.s);
  return `<div class="so-card so-composer">
    <textarea id="so-pt" placeholder="Thesis, invalidation, risk note…"></textarea>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">
      <select id="so-pk">${syms.map(s=>`<option ${s===(S.sel||'BTC')?'selected':''}>${s}</option>`).join('')}</select>
      <select id="so-pd"><option>Long</option><option>Short</option><option>Neutral</option></select>
      <select id="so-st"><option>Active</option><option>Draft</option><option>Watch</option></select>
      <button type="button" class="b w" data-a="so-post">Publish idea</button>
    </div>
    <p class="mu" style="margin:8px 0 0;font-size:11px">Local feed only · not a live social network · DEMO peers</p>
  </div>`;
}

function soSidebar(){
  const trending=[...(typeof AS!=='undefined'?AS:[])].slice().sort((a,b)=>Math.abs((b.p/b.o-1)||0)-Math.abs((a.p/a.o-1)||0)).slice(0,5);
  const saved=(S.posts||[]).filter(p=>p.saved).length;
  return `<div class="so-side">
    <div class="so-card">
      <h3>Filters</h3>
      <div class="row" style="flex-wrap:wrap;gap:6px">
        ${['all','Long','Short','saved'].map(f=>`<button type="button" class="b s ${S.so.filter===f?'on':''}" data-a="so-filter" data-f="${f}">${f}</button>`).join('')}
      </div>
      <input id="so-q" placeholder="Search ideas…" value="${safe(S.so.q||'')}" style="width:100%;margin-top:8px">
      <button type="button" class="b s" style="margin-top:6px" data-a="so-search">Search</button>
    </div>
    <div class="so-card">
      <h3>Trending tickers</h3>
      ${trending.map(a=>`<div class="r2"><b>${safe(a.s)}</b><button type="button" class="b s" data-a="sel" data-s="${safe(a.s)}">Open</button></div>`).join('')||'<span class="mu">—</span>'}
    </div>
    <div class="so-card">
      <h3>Your desk</h3>
      <div class="r2"><span>Ideas</span><b>${(S.posts||[]).filter(p=>(p.u||'').startsWith('You')||p.u===meName()||(p.u||'').startsWith('Вы')).length}</b></div>
      <div class="r2"><span>Saved</span><b>${saved}</b></div>
      <div class="r2"><span>Following</span><b>${(S.fol||[]).length}</b></div>
      <button type="button" class="b s w" style="margin-top:8px" data-a="nav" data-m="community">Community</button>
    </div>
  </div>`;
}

function filteredPosts(){
  let list=[...(S.posts||[])];
  const f=S.so.filter||'all';
  if(f==='Long'||f==='Short') list=list.filter(p=>p.dir===f);
  if(f==='saved') list=list.filter(p=>p.saved);
  const q=(S.so.q||'').toLowerCase();
  if(q) list=list.filter(p=>(p.t+p.u+p.tk+p.dir).toLowerCase().includes(q));
  return list;
}

SP['social:Feed']=()=>`<h1>Social · Feed</h1>
<div class="so-grid">
  <div>${soComposer()}${filteredPosts().map(soCard).join('')||'<div class="so-empty">No posts — publish a thesis</div>'}</div>
  ${soSidebar()}
</div>`;

/* ---------- handlers ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='so-post'){
    const t=($id('so-pt')||$id('pt'))?.value?.trim();
    if(!t) return;
    S.posts.unshift({
      id:Date.now(), u:meName()||'You', t,
      tk:($id('so-pk')||$id('pk'))?.value||S.sel||'BTC',
      dir:($id('so-pd')||$id('pd'))?.value||'Long',
      st:($id('so-st')?.value)||'Active',
      likes:0,liked:0,saved:0,cm:[],ts:nowTs()
    });
    try{sv()}catch(err){}
    if(typeof note==='function') note('Idea published (local)');
    render(); return;
  }
  if(a==='so-like'){const p=postById(b.dataset.id); if(!p)return; p.liked^=1; p.likes=(+p.likes||0)+(p.liked?1:-1); try{sv()}catch(err){} render(); return;}
  if(a==='so-save'){const p=postById(b.dataset.id); if(!p)return; p.saved^=1; try{sv()}catch(err){} render(); return;}
  if(a==='so-status'){const p=postById(b.dataset.id); if(!p)return; const o=['Draft','Active','Watch','Closed','Invalidated']; p.st=o[(o.indexOf(p.st)+1)%o.length]; try{sv()}catch(err){} render(); return;}
  if(a==='so-del'){S.posts=S.posts.filter(p=>+p.id!==+b.dataset.id); try{sv()}catch(err){} render(); return;}
  if(a==='so-cmt'){
    const p=postById(b.dataset.id); if(!p)return;
    const inp=$id('cm'+b.dataset.id); const t=inp?.value?.trim(); if(!t)return;
    p.cm=p.cm||[]; p.cm.push({u:meName(),t}); if(inp)inp.value=''; try{sv()}catch(err){} render(); return;
  }
  if(a==='so-filter'){S.so.filter=b.dataset.f; try{sv()}catch(err){} render(); return;}
  if(a==='so-search'){S.so.q=$id('so-q')?.value||''; try{sv()}catch(err){} render(); return;}
  if(a==='so-xf'){S.xf=b.dataset.s||''; try{sv()}catch(err){} render(); return;}
  if(a==='so-idea-dir'){S.so.ideaDir=b.dataset.d||''; try{sv()}catch(err){} render(); return;}
  if(a==='so-chat'){S.mc=b.dataset.u; S.sb=S.sb||{}; S.sb.social='Messages'; try{sv()}catch(err){} render(); return;}
  if(a==='so-msg'){
    const k=S.mc||'trader_alpha'; const t=$id('so-mi')?.value?.trim()||$id('mi')?.value?.trim(); if(!t)return;
    S.ms[k]=S.ms[k]||[]; S.ms[k].push({me:1,t,ts:nowTs()}); if($id('so-mi'))$id('so-mi').value=''; try{sv()}catch(err){} render(); return;
  }
  if(a==='so-fol'){
    const u=b.dataset.u; S.fol=S.fol||[];
    S.fol=S.fol.includes(u)?S.fol.filter(x=>x!==u):[...S.fol,u];
    try{sv()}catch(err){} render(); return;
  }
  if(a==='so-prof'){
    S.prof={n:$id('so-pn')?.value||'You', s:$id('so-ps')?.value||'', b:$id('so-pb')?.value||''};
    try{sv()}catch(err){} if(typeof note==='function')note('Profile saved'); render(); return;
  }
  if(a==='co-join'){const c=comById(b.dataset.id); if(!c)return; c.j^=1; try{sv()}catch(err){} render(); return;}
  if(a==='co-room'){S.co.tabRoom=+b.dataset.id; S.sb=S.sb||{}; S.sb.community='Rooms'; try{sv()}catch(err){} render(); return;}
  if(a==='co-send'){
    const id=b.dataset.id; const t=$id('co-msg')?.value?.trim(); if(!t)return;
    S.co.rooms=S.co.rooms||{}; S.co.rooms[id]=S.co.rooms[id]||{msgs:[]};
    S.co.rooms[id].msgs.push({u:meName(),t,ts:nowTs()}); if($id('co-msg'))$id('co-msg').value='';
    try{sv()}catch(err){} render(); return;
  }
  if(a==='co-topic'){S.co.topic=b.dataset.t; try{sv()}catch(err){} render(); return;}
  if(a==='co-create'){
    const n=$id('co-cn')?.value?.trim(); if(!n)return;
    S.com.unshift({id:Date.now(),n,j:1,d:$id('co-cd')?.value||'',members:1,topic:$id('co-ct')?.value||'general'});
    try{sv()}catch(err){} S.sb=S.sb||{}; S.sb.community='My'; render(); return;
  }
  if(a==='co-rsvp'){ if(typeof note==='function') note('RSVP saved locally: '+b.dataset.t); return; }
});

if(!S.sb)S.sb={};
if(!SUB.social.includes(S.sb.social))S.sb.social='Feed';
if(!SUB.community.includes(S.sb.community))S.sb.community='Discover';
})();
</script>

<script id="mavora-sidebar-brand-v2-js">
(()=>{
  'use strict';
  const sidebar=document.getElementById('sb');
  const headerTrigger=document.getElementById('bg');
  if(!sidebar||!headerTrigger)return;
  function ensureSidebarBrand(){
    if(sidebar.querySelector(':scope > .sb-brand'))return;
    const source=headerTrigger.querySelector('img');
    const brand=document.createElement('div');
    brand.className='sb-brand';
    brand.setAttribute('aria-label','MAVORA');
    const mark=source?source.cloneNode(true):document.createElement('span');
    if(source){mark.removeAttribute('id');mark.alt='MAVORA';mark.setAttribute('aria-hidden','true');}
    const name=document.createElement('span');
    name.textContent='MAVORA';
    brand.append(mark,name);
    sidebar.insertBefore(brand,sidebar.firstChild);
  }
  const previousRender=window.render;
  if(typeof previousRender==='function'){
    window.render=function(){
      const result=previousRender.apply(this,arguments);
      ensureSidebarBrand();
      return result;
    };
  }
  ensureSidebarBrand();
})();
</script>

      button.setAttribute('aria-label',label);
    });
  }
  const previousRender=window.render;
  if(typeof previousRender==='function'){
    window.render=function(){
      const result=previousRender.apply(this,arguments);
      try{decorateNav();}catch(error){console.warn('MAVORA sidebar rail:',error);}
      return result;
    };
  }
  decorateNav();
})();
</script>

<script id="mavora-unified-market-workspace">
/* MAVORA update: unified Market tools + functional Terminal Workspace + distinct larger submenu icons */
(()=>{
  'use strict';

  const escText = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const pct = v => Number.isFinite(+v) ? ((+v>=0?'+':'')+(+v).toFixed(3)+'%') : '—';
  const safeSymbol = v => /^[A-Z0-9]{2,24}$/.test(String(v||'')) ? String(v) : 'BTC';
  const api = 'https://fapi.binance.com/fapi/v1/';

  /* ---------- Market: one visible subsection with three preserved tools ---------- */
  const legacyMarket = {
    scanner: SP['discover:Scanner'],
    top100: SP['discover:Top 100'],
    derivatives: SP['discover:Derivatives']

  SUB.discover = SUB.discover.filter(t => t !== 'Top 100' && t !== 'Derivatives');
  if (!SUB.discover.includes('Scanner')) SUB.discover.splice(1,0,'Scanner');
  if (S.sb && S.sb.discover === 'Top 100') { S.mktCombinedTab = 'top100'; S.sb.discover = 'Scanner'; }
  else if (S.sb && S.sb.discover === 'Derivatives') { S.mktCombinedTab = 'derivatives'; S.sb.discover = 'Scanner'; }
  if (!['scanner','top100','derivatives'].includes(S.mktCombinedTab)) S.mktCombinedTab = 'scanner';

  const marketTabIcons = {
    scanner:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M8 8h8v8H8z"/>',
    top100:'<path d="M5 19V5M5 19h15"/><path d="m8 15 3-4 3 2 5-7"/><circle cx="19" cy="6" r="1.5"/>',
    derivatives:'<path d="M4 18 9 13l3 2 7-9"/><path d="M14 6h5v5"/><path d="M4 21h16"/>'
  };

  function marketTabButton(key,label){
    const active = S.mktCombinedTab === key;
    return `<button type="button" class="b s mav-market-tab ${active?'on':''}" data-a="mav-market-view" data-view="${key}" aria-pressed="${active}"><span class="mav-market-tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${marketTabIcons[key]}</svg></span><span>${label}</span></button>`;
  }

  function drawMarketCombinedView(){
    const pane = document.getElementById('mav-market-pane');

    const tab = S.mktCombinedTab || 'scanner';
    document.querySelectorAll('.mav-market-tab').forEach(btn => {
      const on = btn.dataset.view === tab;

    if (tab === 'top100') {

        .replace('id="dq" placeholder="Search asset"', `id="dq" placeholder="Search asset" value="${escText(S.mktTopQuery||'')}"`);
      return;
    }
    if (tab === 'derivatives') {
      const html = legacyMarket.derivatives ? legacyMarket.derivatives() : '<h2>Derivatives</h2><div class="mu">Derivatives module unavailable.</div>';
      pane.innerHTML = html.replace(/<h1[^>]*>[\s\S]*?<\/h1>/i, '<h2 class="mav-inner-title">Derivatives · Futures positioning</h2>');
      return;
    }

    const html = legacyMarket.scanner ? legacyMarket.scanner() : '<div id="mkt-sc-body"></div>';
    pane.innerHTML = html.replace(/<h1[^>]*>[\s\S]*?<\/h1>/i, '<h2 class="mav-inner-title">Liquidity & Relative Strength Scanner</h2>');

  SP['discover:Scanner'] = () => {
    setTimeout(drawMarketCombinedView, 35);
    return `<h1 class="mav-enter">Market Scanner</h1>
      <div class="mav-market-toolbar" role="tablist" aria-label="Market tools">

        ${marketTabButton('derivatives','Derivatives')}
      </div>
      <div id="mav-market-pane" class="mav-enter"><div class="c mu">Открываю инструменты рынка…</div></div>
      <p class="source-note" style="margin-top:12px">Все три инструмента работают в одном разделе. Рыночные данные поступают из публичных Binance Spot / USDⓈ-M Futures API; отсутствие данных отображается как «—».</p>`;
  };

  /* Old navigation shortcuts are redirected into the matching inner tab. */

  document.addEventListener('click', e => {

    e.preventDefault();
    S.mktCombinedTab = b.dataset.view || 'scanner';

    drawMarketCombinedView();
  }, true);

  /* Keep Top 100 search/sort/filter controls bound to the Top 100 dataset while it is nested. */
  document.addEventListener('click', e => {
    if (S.mod !== 'discover' || cs() !== 'Scanner' || S.mktCombinedTab !== 'top100') return;
    const b = e.target.closest('[data-a]');
    if (!b) return;
    if (b.dataset.a === 'sort') {
      e.preventDefault(); e.stopImmediatePropagation();
      S.sort = b.dataset.k || 'v';
      try { sv(); } catch (_) {}

    } else if (b.dataset.a === 'flt') {
      e.preventDefault(); e.stopImmediatePropagation();
      S.flt = b.dataset.f || 'all';
