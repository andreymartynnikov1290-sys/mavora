<style>
:root{color-scheme:dark;--bg:#000;--p:#0d0d0d;--p2:#171717;--b:#252525;--t:#f4f4f4;--m:#8c8c8c;--g:#62d394;--r:#ff6b6b;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.45 "Inter",system-ui,sans-serif;display:flex;overflow:hidden}
#sb{width:210px;border-right:1px solid var(--b);padding:16px 12px;overflow:auto;flex:none}
#sb .lg{font-weight:700;font-size:18px;letter-spacing:.14em;padding:4px 12px 16px}
.nv{display:block;width:100%;text-align:left;background:none;border:0;color:var(--m);padding:9px 14px;border-radius:999px;cursor:pointer;font:inherit;margin-bottom:2px}
.nv:hover{background:var(--p2);color:var(--t)}.nv.on{background:var(--t);color:#000}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
#hd{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--b);position:relative}
#pg{flex:1;overflow:auto;padding:20px 22px}
.b{border:1px solid var(--b);background:var(--p2);color:var(--t);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.b:hover{background:#242424}.b.w{background:var(--t);color:#000;border-color:var(--t)}.b.s{padding:4px 12px;font-size:12px}.b.on{background:var(--t);color:#000}.b.g{border-color:var(--g);color:var(--g);background:none}.b.r{border-color:var(--r);color:var(--r);background:none}.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
input,select,textarea{background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:999px;padding:8px 14px;font:inherit;min-width:0}textarea{border-radius:18px;width:100%;resize:vertical}
#q{flex:1;max-width:460px}.pill{border:1px solid var(--b);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--m)}.pill.d{color:#000;background:#e8c46a;border-color:#e8c46a}
.c{background:var(--p);border:1px solid var(--b);border-radius:20px;padding:16px;min-width:0}.c h3{margin:0 0 10px;font-size:13px;color:var(--m);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.r2{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1a}.up{color:var(--g)}.dn{color:var(--r)}.mu{color:var(--m)}
h1{font-size:24px;margin:0 0 16px;font-weight:600}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #1a1a1a}th{color:var(--m);font-weight:500;cursor:pointer}
#dd,#nt{position:absolute;top:56px;background:var(--p);border:1px solid var(--b);border-radius:20px;padding:8px;z-index:20;max-height:60vh;overflow:auto;display:none}#dd{left:130px;width:460px;max-width:90vw}#nt{right:60px;width:320px}
#dd button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--t);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit}#dd button:hover{background:var(--p2)}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}#md>div{background:var(--p);border:1px solid var(--b);border-radius:24px;padding:22px;width:380px;max-width:92vw}
#cv{width:100%;height:340px;display:block}.tg{display:grid;grid-template-columns:2fr 1fr;gap:14px}.bar{height:8px;border-radius:99px;background:var(--r);overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.tag{font-size:11px;border:1px solid var(--b);border-radius:99px;padding:1px 8px;color:var(--m)}#bg{display:none}
@media(max-width:820px){#sb{position:fixed;z-index:15;background:#000;height:100%;left:-230px;transition:left .2s}#sb.open{left:0}#bg{display:inline-block}.tg{grid-template-columns:1fr}#pg{padding:14px}#nt{right:10px}#dd{left:10px}}

/* MAVORA Journal + TradingView enhancements */
/* Journal navigation fix: preserve Terminal sub-navigation while Journal content is active. */
#pg>.tabs{position:relative;z-index:5;background:#050505;padding:4px 0 8px}

.jgrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr);gap:14px}.jstats{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px;margin-bottom:14px}.jstat{background:#101010;border:1px solid var(--b);border-radius:16px;padding:13px}.jstat small{display:block;color:var(--m);font-size:11px}.jstat strong{display:block;font-size:21px;margin-top:5px}.jform{display:grid;grid-template-columns:1fr 1fr;gap:9px}.jform label{display:flex;flex-direction:column;gap:5px;color:var(--m);font-size:12px}.jform input,.jform select,.jform textarea{width:100%;border-radius:12px}.jform .wide{grid-column:1/-1}.jtablewrap{overflow:auto}.jtable{min-width:760px}.jtable td{white-space:nowrap}.jfilters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.jfilters input,.jfilters select{border-radius:12px}.jbadge{border:1px solid var(--b);border-radius:30px;padding:3px 8px;font-size:11px}.jempty{padding:22px;text-align:center;color:var(--m)}
@media(max-width:900px){.jgrid{grid-template-columns:1fr}.jstats{grid-template-columns:repeat(2,minmax(110px,1fr))}.jform{grid-template-columns:1fr 1fr}}

/* MAVORA live market intelligence + persistent workspace */
.mini-tape{height:34px;min-height:34px;background:#000;border-bottom:1px solid #202020;display:flex;align-items:center;gap:22px;overflow:auto;white-space:nowrap;padding:0 14px;font-size:11px;scrollbar-width:none}.mini-tape::-webkit-scrollbar{display:none}.mini-quote{display:inline-flex;gap:7px;align-items:center}.mini-quote b{color:#f4f4f4}.mini-quote small{color:#777}.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#62d394;margin-right:5px}.stale-dot{background:#e8c46a}.mktgrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin:12px 0}.mktmetric{border:1px solid #292929;background:#0a0a0a;border-radius:15px;padding:13px}.mktmetric small{color:#8c8c8c;display:block;font-size:11px}.mktmetric strong{display:block;font-size:20px;margin-top:5px}.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.analytics-grid .c{min-width:0}.signalrow{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #1a1a1a;padding:8px 0}.signalrow:last-child{border-bottom:0}.source-note{font-size:11px;color:#777;line-height:1.5}.source-link{color:#e8c46a;text-decoration:none}.source-link:hover{text-decoration:underline}.news-item{padding:10px 0;border-bottom:1px solid #1a1a1a}.news-item:last-child{border-bottom:0}.news-item a{color:#eee;text-decoration:none}.news-item a:hover{color:#e8c46a}.pulse-badge{border:1px solid #333;border-radius:999px;padding:3px 8px;font-size:10px;color:#aaa}
@media(max-width:820px){.mktgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.analytics-grid{grid-template-columns:1fr}.mini-tape{gap:14px;padding:0 8px}}

/* Home hero: interactive Moscow sky, deliberately scoped to this card only */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:186px;overflow:hidden;isolation:isolate}.hero-copy{position:relative;z-index:3;min-width:0}.hero-sky{position:absolute;right:clamp(12px,4vw,70px);top:0;width:min(38%,480px);height:100%;min-width:230px;display:grid;place-items:center;perspective:850px;transform-style:preserve-3d;cursor:pointer;touch-action:pan-y;outline:none}.sky-stage{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .25s ease;overflow:hidden}.sky-haze{position:absolute;inset:0;background:radial-gradient(ellipse at 58% 46%,var(--sky-glow, #c9c9c91b),transparent 58%);transition:background 1.8s ease}.sky-orbit{position:absolute;width:178px;height:178px;right:15%;top:50%;transform:translateY(-50%) rotateX(64deg) rotateZ(-22deg);border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 35px #ffffff08;transition:opacity 1s}.sky-orbit:after{content:"";position:absolute;inset:19px;border:1px solid #ffffff0d;border-radius:50%}.sky-body{position:absolute;width:82px;height:82px;right:29%;top:50%;margin-top:-41px;border-radius:50%;transform:translateZ(55px);transition:opacity 1.25s,transform 1.5s,filter 1.5s;box-shadow:inset -16px -13px 22px #0006,0 0 32px var(--orb-glow,#d9d9d920)}.sky-sun{background:radial-gradient(circle at 32% 28%,#fff 0,#e9e6df 20%,#c9c7c1 56%,#777 100%);opacity:1}.sky-moon{background:radial-gradient(circle at 35% 28%,#fff 0,#dcdde0 38%,#a5a8ad 70%,#62656b 100%);opacity:0;transform:translate3d(0,24px,20px) scale(.78)}.sky-moon:before,.sky-moon:after{content:"";position:absolute;border-radius:50%;background:#77777725;box-shadow:inset 2px 2px 5px #0002}.sky-moon:before{width:17px;height:17px;left:19px;top:26px}.sky-moon:after{width:10px;height:10px;right:18px;top:48px}.sky-cloud{position:absolute;z-index:4;width:140px;height:28px;border-radius:50px;background:linear-gradient(180deg,#e7e7e7,#969696);filter:drop-shadow(0 10px 13px #0008);opacity:.68;transform:translateZ(75px);transition:opacity 1.2s,transform 1.4s,background 1.5s}.sky-cloud:before,.sky-cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.sky-cloud:before{width:58px;height:58px;left:20px;bottom:3px}.sky-cloud:after{width:76px;height:76px;left:57px;bottom:0}.sky-cloud.c1{right:7%;top:34%;transform:translateZ(72px) rotate(-12deg) scale(.84)}.sky-cloud.c2{right:31%;top:63%;transform:translateZ(20px) rotate(9deg) scale(.64);opacity:.34}.sky-stars{position:absolute;inset:0;opacity:0;transition:opacity 1.4s;transform:translateZ(15px)}.sky-stars i{position:absolute;width:3px;height:3px;background:#e9e9e9;border-radius:50%;box-shadow:0 0 9px #fff8}.sky-stars i:nth-child(1){left:16%;top:25%}.sky-stars i:nth-child(2){left:55%;top:17%;width:2px;height:2px}.sky-stars i:nth-child(3){right:15%;top:70%}.sky-stars i:nth-child(4){left:39%;bottom:16%;width:2px;height:2px}.hero-sky[data-phase="night"] .sky-sun,.hero-sky[data-phase="dawn"] .sky-sun{opacity:0;transform:translate3d(-22px,25px,0) scale(.7)}.hero-sky[data-phase="night"] .sky-moon,.hero-sky[data-phase="dawn"] .sky-moon{opacity:1;transform:translate3d(0,0,65px) scale(1)}.hero-sky[data-phase="night"] .sky-stars{opacity:.9}.hero-sky[data-phase="night"] .sky-cloud{background:linear-gradient(180deg,#aaa,#666);opacity:.3}.hero-sky[data-phase="dawn"] .sky-haze{--sky-glow:#b8b0a42b}.hero-sky[data-phase="sunset"] .sky-sun{filter:sepia(.2);box-shadow:inset -16px -13px 22px #0006,0 0 46px #d6c7b33b}.hero-sky .sky-caption{position:absolute;bottom:12px;right:10px;color:#777;font:9px/1.2 system-ui;letter-spacing:.2em;z-index:5;opacity:.7}.hero-sky:focus-visible{outline:1px solid #aaa;outline-offset:-10px;border-radius:20px}
@media(max-width:650px){.hero{min-height:170px;padding:18px}.hero-sky{right:0;width:44%;min-width:140px;opacity:.9}.sky-body{width:56px;height:56px;margin-top:-28px;right:27%}.sky-orbit{width:116px;height:116px;right:4%}.sky-cloud{width:95px;height:20px}.sky-cloud:before{width:38px;height:38px}.sky-cloud:after{width:48px;height:48px;left:40px}.sky-caption{display:none}.hero .big{font-size:clamp(30px,8vw,44px)}.hero-copy .row{max-width:260px;gap:6px}.hero-copy .b{font-size:11px;padding:7px 10px}}

const pr=(s)=>`<span data-p="${s}">${f(P(s))}</span>`,pch=s=>`<span data-c="${s}" class="${cl(CH(s))}">${pc(CH(s))}</span>`;
const emp=t=>`<div class="mu">${t}</div>`;
let AG={};const AGN=['SCOUT','TECH ANALYST','NEWS ANALYST','SENTIMENT ANALYST','ON-CHAIN ANALYST','DERIVATIVES ANALYST','STRATEGY AGENT','QUANT AGENT','PORTFOLIO MANAGER','RISK MANAGER','MONITOR','LEARNING AGENT','EXECUTION ENGINE'],OFF=['NEWS ANALYST','SENTIMENT ANALYST','ON-CHAIN ANALYST','DERIVATIVES ANALYST','LEARNING AGENT'];
const resetAG=()=>AGN.forEach(n=>AG[n]={st:OFF.includes(n)?'DISABLED':n==='EXECUTION ENGINE'?'WAITING':'IDLE',t:OFF.includes(n)?'Нет источника данных':'—'});resetAG();
const agRows=()=>AGN.map(n=>`<div class="r2"><span>${n}</span><span class="mu">${AG[n].st}${AG[n].t!=='—'?' · '+esc(AG[n].t):''}</span></div>`).join('');
const WD={watch:['Watchlist',()=>S.wl.map(s=>`<div class="r2"><b>${s}</b>${pr(s)}${pch(s)}<button class="b s" data-a="sel" data-s="${s}">Terminal</button></div>`).join('')||emp('Добавьте активы в Discover')],
bal:['Paper-баланс (PAPER)',()=>`<div style="font-size:26px">$${f(eq())}</div><div class="mu">Свободно $${f(S.bal)} · старт $10 000</div>`],
pos:['Открытые позиции',()=>S.pos.map(x=>`<div class="r2"><span>${x.side} ${x.s} ${x.q}</span><span class="${cl(pnl(x))}">${f(pnl(x))}</span></div>`).join('')||emp('Позиций нет. Откройте сделку в Terminal.')],
movers:['Лидеры движения',()=>[...AS].sort((a,b)=>Math.abs(CH(b.s))-Math.abs(CH(a.s))).slice(0,4).map(a=>`<div class="r2"><b>${a.s}</b>${pr(a.s)}${pch(a.s)}</div>`).join('')],
notes:['Заметки',()=>`<textarea rows=5 oninput="S.notes=this.value;sv()">${esc(S.notes)}</textarea>`],
tasks:['Задачи',()=>`<div class="row"><input id="ti" placeholder="Новая задача" style="flex:1"><button class="b s w" data-a="addt">Добавить</button></div>`+S.tasks.map((t,i)=>`<div class="r2"><span style="${t.d?'text-decoration:line-through;color:var(--m)':''}">${esc(t.t)}</span><span><button class="b s" data-a="tt" data-i="${i}">${t.d?'Вернуть':'Готово'}</button> <button class="b s" data-a="dt" data-i="${i}">Удалить</button></span></div>`).join('')],
agents:['Статус агентов',()=>`<div id="agw">${agRows()}</div>`],
chart:['Мини-график',()=>{const z=cndl(S.sel,'1h').map(k=>k.c),a=Math.min(...z),b=Math.max(...z);return`<div class="row sp"><b>${S.sel}</b>${pch(S.sel)}</div><svg viewBox="0 0 200 60" preserveAspectRatio="none" style="width:100%;height:90px"><polyline fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${z.map((v,i)=>(i*200/(z.length-1)).toFixed(1)+','+(56-(v-a)/(b-a||1)*52).toFixed(1)).join(' ')}"/></svg>`}],news:['Новости',()=>emp('Источник новостей не подключён. Подключите его в Data Center.')],
status:['Источники данных',()=>`<div class="r2"><span>Симулятор цен</span><span class="tag">DEMO</span></div><div class="r2"><span>Binance / Bybit</span><span class="tag">OFFLINE</span></div><div class="r2"><span>Торговля</span><span class="tag">PAPER</span></div>`]};

function draw(){const cv=$('#cv');if(!cv)return;const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.scale(d,d);const c=cndl(S.sel,S.tf);let hi=Math.max(...c.map(k=>k.h)),lo=Math.min(...c.map(k=>k.l));const pd=(hi-lo)*.08;hi+=pd;lo-=pd;const Y=v=>h-(v-lo)/(hi-lo)*(h-20)-10,cw=w/c.length;
c.forEach((k,i)=>{const u=k.c>=k.o,cx=i*cw+cw/2;x.strokeStyle=x.fillStyle=u?'#62d394':'#ff6b6b';x.beginPath();x.moveTo(cx,Y(k.h));x.lineTo(cx,Y(k.l));x.stroke();x.fillRect(cx-cw*.34,Math.min(Y(k.o),Y(k.c)),cw*.68,Math.max(1,Math.abs(Y(k.o)-Y(k.c))))});
const cs=c.map(k=>k.c),e=ema(cs,20),I=S.ind||{EMA:1},ln=(a,col)=>{x.strokeStyle=col;x.beginPath();a.forEach((v,i)=>i?x.lineTo(i*cw+cw/2,Y(v)):x.moveTo(cw/2,Y(v)));x.stroke()},w20=i=>cs.slice(Math.max(0,i-19),i+1);if(I.EMA)ln(e,'#fff');if(I.SMA)ln(cs.map((_,i)=>{const s=w20(i);return s.reduce((a,v)=>a+v,0)/s.length}),'#9a9a9a');if(I.BB){const m=cs.map((_,i)=>{const s=w20(i),mu=s.reduce((a,v)=>a+v,0)/s.length;return[mu,Math.sqrt(s.reduce((a,v)=>a+(v-mu)**2,0)/s.length)]});ln(m.map(z=>z[0]+2*z[1]),'#666');ln(m.map(z=>z[0]-2*z[1]),'#666')}if(I.VWAP){let pv=0;ln(c.map((k,i)=>{pv+=(k.h+k.l+k.c)/3;return pv/(i+1)}),'#7cc4ff')}const last=cs[cs.length-1];x.setLineDash([4,4]);x.strokeStyle='#888';x.beginPath();x.moveTo(0,Y(last));x.lineTo(w,Y(last));x.stroke();x.setLineDash([]);x.fillStyle='#fff';x.fillText(f(last),w-60,Y(last)-4);
$('#ind').textContent=`EMA20 ${f(e[e.length-1])} (белая линия) · RSI14 ${rsi(cs).toFixed(1)} · расчётные показатели`}

 <section class="c"><h3>История <span class="tag">${filtered.length} записей</span></h3><div class="jfilters"><input id="jf-symbol" placeholder="Тикер" value="${esc(flt.symbol)}"><select id="jf-side"><option value="all">Все стороны</option><option ${flt.side==='Long'?'selected':''}>Long</option><option ${flt.side==='Short'?'selected':''}>Short</option></select><select id="jf-result"><option value="all">Все результаты</option><option value="win" ${flt.result==='win'?'selected':''}>Плюс</option><option value="loss" ${flt.result==='loss'?'selected':''}>Минус</option><option value="open" ${flt.result==='open'?'selected':''}>Открытые</option></select><input id="jf-from" type="date" title="С даты" value="${flt.from}"><input id="jf-to" type="date" title="По дату" value="${flt.to}"></div>

}
const oldRender=render;render=function(){oldRender();if(S.mod==='terminal'&&cs()==='Journal')$('#pg').innerHTML=tabs()+jpage()};
function jrefresh(){sv();render()}
function jreset(){const form=$('#jform');if(form)form.reset();$('#jid').value='';$('#jformtitle').textContent='Добавить сделку';$('#jsave').textContent='Сохранить сделку';$('#jdate').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('#jfees').value=0;$('#jpreview').textContent='';}
function jload(id){const t=S.journal.find(x=>x.id===id);if(!t)return;[['jid','id'],['jdate','date'],['jsymbol','symbol'],['jside','side'],['jstatus','status'],['jentry','entry'],['jexit','exit'],['jqty','qty'],['jfees','fees'],['jtf','tf'],['jstrategy','strategy'],['jrisk','risk'],['jtarget','target'],['jshot','shot'],['jnotes','notes']].forEach(([el,k])=>$('#'+el).value=t[k]??'');$('#jformtitle').textContent='Редактировать сделку';$('#jsave').textContent='Сохранить изменения';$('#jpreview').textContent=t.status==='Closed'?'Текущий PnL: '+jfmt(jcalc(t)):'';$('#jform').scrollIntoView({behavior:'smooth',block:'start'});}
$('#pg').addEventListener('submit',e=>{if(e.target.id!=='jform')return;e.preventDefault();const t={id:$('#jid').value?+$('#jid').value:Date.now(),created:Date.now(),date:$('#jdate').value,symbol:$('#jsymbol').value.trim().toUpperCase().replace(/[^A-Z0-9._-]/g,''),side:$('#jside').value,status:$('#jstatus').value,entry:jnum($('#jentry').value),exit:jnum($('#jexit').value),qty:jnum($('#jqty').value),fees:jnum($('#jfees').value),tf:$('#jtf').value,strategy:$('#jstrategy').value.trim(),risk:jnum($('#jrisk').value),target:jnum($('#jtarget').value),shot:$('#jshot').value.trim(),notes:$('#jnotes').value.trim()};if(!t.symbol||t.entry<=0||t.qty<=0||(t.status==='Closed'&&t.exit<=0)){alert('Проверь тикер, вход, объём и цену выхода для закрытой сделки.');return}const ix=S.journal.findIndex(x=>x.id===t.id);if(ix>=0){t.created=S.journal[ix].created;S.journal[ix]=t}else S.journal.unshift(t);jreset();jrefresh()});
$('#pg').addEventListener('change',e=>{if(!e.target.id.startsWith('jf-'))return;const id=e.target.id;S.journalFilter[id==='jf-symbol'?'symbol':id==='jf-side'?'side':id==='jf-result'?'result':id==='jf-from'?'from':'to']=e.target.value;jrefresh()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a^="j"]');if(!b)return;const a=b.dataset.a,id=+b.dataset.i;if(a==='jedit')jload(id);if(a==='jdel'){if(confirm('Удалить запись из журнала?')){S.journal=S.journal.filter(t=>t.id!==id);jrefresh()}}if(a==='jcancel'||a==='jreset')jreset();if(a==='jcsv'){const rows=[['Date','Symbol','Side','Status','Entry','Exit','Qty','Fees','NetPnL','R','Timeframe','Strategy','Risk','Target','Screenshot','Notes'],...S.journal.map(t=>[t.date,t.symbol,t.side,t.status,t.entry,t.exit,t.qty,t.fees,t.status==='Closed'?jcalc(t):'',t.risk>0&&t.status==='Closed'?(jcalc(t)/t.risk).toFixed(3):'',t.tf,t.strategy,t.risk,t.target,t.shot,t.notes])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='MAVORA-trade-journal.csv';link.click();URL.revokeObjectURL(url)}});
// Live preview of journal's estimated net result
$('#pg').addEventListener('input',e=>{if(!['jentry','jexit','jqty','jfees','jside','jstatus','jrisk'].includes(e.target.id))return;const status=$('#jstatus')?.value;if(!$('#jpreview')||status!=='Closed'||!$('#jentry').value||!$('#jexit').value||!$('#jqty').value)return;const temp={side:$('#jside').value,entry:+$('#jentry').value,exit:+$('#jexit').value,qty:+$('#jqty').value,fees:+$('#jfees').value};$('#jpreview').textContent='Оценка net PnL: '+jfmt(jcalc(temp))});

<script>
/* MAVORA extension layer: public market data, analytics, durable autosave, RSS headlines. */
(()=>{
 const API='https://api.binance.com/api/v3',FAPI='https://fapi.binance.com/fapi/v1';
 const $id=id=>document.getElementById(id),fmt=(n,d=2)=>Number.isFinite(+n)?(+n).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
 const pct=n=>(+n>=0?'+':'')+fmt(n,2)+'%';
 const safe=(v)=>esc(String(v??''));
 const addLog=(m)=>{S.log=S.log||[];S.log.unshift(new Date().toLocaleTimeString('ru')+' · '+m);S.log=S.log.slice(0,120);sv()};
 // Data persistence: the app already stores the full state in localStorage. Back up on a timer,
 // tab switch, page hide and browser close; keep legacy key for existing user data compatibility.
 const saveNow=()=>{try{sv();localStorage.setItem('mv_backup',JSON.stringify({savedAt:Date.now(),state:S}));}catch(e){console.warn('MAVORA save failed',e)}};
 setInterval(saveNow,1800);window.addEventListener('pagehide',saveNow);window.addEventListener('beforeunload',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
 // Recover from the backup only if the main state key is missing or unreadable.
 try{if(!localStorage.getItem('mv')){const b=JSON.parse(localStorage.getItem('mv_backup')||'null');if(b&&b.state)Object.assign(S,b.state)}}catch(e){}
 // Thin black ticker: true exchange quotes, never fabricated. TradingView remains embedded in chart/screener.
 const tape=$id('tape');if(tape){tape.className='mini-tape';tape.innerHTML='<span class="source-note"><span class="live-dot stale-dot" id="tapedot"></span>LIVE · BINANCE</span><span class="mu">Загрузка котировок…</span>'}
 async function tickers(){try{const syms=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','LINKUSDT','AVAXUSDT','TONUSDT'];const u=API+'/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(syms));const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!tape)return;tape.innerHTML='<span class="source-note"><span class="live-dot"></span>LIVE · BINANCE</span>'+rows.map(x=>`<span class="mini-quote"><b>${x.symbol.replace('USDT','')}</b><span>${fmt(x.lastPrice, x.lastPrice<1?5:2)}</span><small class="${+x.priceChangePercent>=0?'up':'dn'}">${pct(x.priceChangePercent)}</small></span>`).join('');const dot=$id('tapedot');if(dot)dot.className='live-dot';}catch(e){if(tape&&!tape.querySelector('.mini-quote'))tape.innerHTML='<span class="source-note"><span class="live-dot stale-dot"></span>Market data unavailable · last update unavailable</span>';const dot=$id('tapedot');if(dot)dot.className='live-dot stale-dot'}}
 tickers();setInterval(tickers,12000);
 // Utility fetch: current public data only, visible source timestamp and explicit fallback status.
 const cache={};async function getJSON(url,ttl=15000){const now=Date.now();if(cache[url]&&now-cache[url].t<ttl)return cache[url].v;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();cache[url]={t:now,v};return v}
 function rsiCalc(values,n=14){if(values.length<n+1)return null;let up=0,dn=0;for(let i=values.length-n;i<values.length;i++){const d=values[i]-values[i-1];if(d>0)up+=d;else dn-=d}if(!dn)return 100;return 100-100/(1+up/n/(dn/n))}
 function zones(candles){const c=candles.slice(-100),piv=[];for(let i=2;i<c.length-2;i++){if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h)piv.push({p:c[i].h,t:'R'});if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l)piv.push({p:c[i].l,t:'S'})}const last=c.at(-1)?.c||0;return{res:piv.filter(x=>x.t==='R'&&x.p>last).sort((a,b)=>a.p-b.p).slice(0,3),sup:piv.filter(x=>x.t==='S'&&x.p<last).sort((a,b)=>b.p-a.p).slice(0,3)}}
 async function liveMetrics(symbol){const s=(symbol||S.sel||'BTC').toUpperCase().replace(/[^A-Z0-9]/g,'');const sym=s.endsWith('USDT')?s:s+'USDT';const [prem,oi,ls,kl]=await Promise.allSettled([getJSON(FAPI+'/premiumIndex?symbol='+sym,20000),getJSON(FAPI+'/openInterest?symbol='+sym,30000),getJSON('https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol='+sym+'&period=1h&limit=1',60000),getJSON(FAPI+'/klines?symbol='+sym+'&interval=1h&limit=100',30000)]);const candles=kl.status==='fulfilled'?kl.value.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5],q:+x[7],t:+x[0]})):[];const closes=candles.map(x=>x.c),last=candles.at(-1),avgVol=candles.slice(-21,-1).reduce((a,x)=>a+x.v,0)/Math.max(1,candles.slice(-21,-1).length);const rsi=rsiCalc(closes),impulse=last&&avgVol>0?last.v/avgVol:0;const z=zones(candles);return{symbol:sym,prem:prem.status==='fulfilled'?+prem.value.lastFundingRate:null,oi:oi.status==='fulfilled'?+oi.value.openInterest:null,ls:ls.status==='fulfilled'?+ls.value[0].longShortRatio:null,rsi,impulse,change:last&&last.o?(last.c/last.o-1)*100:null,candles,zones:z,at:new Date().toLocaleTimeString('ru')}}
 function metricCard(label,value,detail='',cls=''){return`<div class="mktmetric"><small>${label}</small><strong class="${cls}">${value}</strong><span class="source-note">${detail}</span></div>`}
 function analyticsHTML(m){const r=m.rsi,rs=r===null?'—':fmt(r,1),rsiLabel=r===null?'нет данных':r>=70?'Перекупленность':r<=30?'Перепроданность':'Нейтрально';const f=m.prem===null?'—':pct(m.prem*100);const fundClass=m.prem===null?'':m.prem>0?'dn':'up';const oi=m.oi===null?'—':fmt(m.oi,0)+' '+m.symbol.replace('USDT','');const ls=m.ls===null?'—':fmt(m.ls,2)+' : 1';const imp=m.impulse?fmt(m.impulse,2)+'×':'—';const impLabel=m.impulse>=2?'Объёмный импульс':m.impulse>=1.4?'Повышенный объём':'Обычный объём';const z=m.zones;return`<div class="row sp"><h2 style="margin:0">${m.symbol} · Market Pulse</h2><span class="pulse-badge"><span class="live-dot"></span>LIVE · ${m.at}</span></div><div class="mktgrid">${metricCard('RSI · 14',rs,rsiLabel,r!==null&&r>=70?'dn':r!==null&&r<=30?'up':'')}${metricCard('Funding · Binance',f,'Perpetual funding rate',fundClass)}${metricCard('Open Interest',oi,'Текущий открытый интерес')}${metricCard('Long / Short',ls,'Global accounts · 1h')}${metricCard('Объём последней свечи',imp,impLabel,m.impulse>=2?'up':'')}${metricCard('Изменение 1h',m.change===null?'—':pct(m.change),'Последняя закрытая/текущая свеча',m.change>=0?'up':'dn')}</div><div class="analytics-grid"><section class="c"><h3>Поддержка и сопротивление <span class="tag">1h · pivot zones</span></h3><div class="signalrow"><b class="up">Поддержка</b><span>${z.sup.map(x=>fmt(x.p,2)).join(' · ')||'Нет подтверждённых pivot-зон'}</span></div><div class="signalrow"><b class="dn">Сопротивление</b><span>${z.res.map(x=>fmt(x.p,2)).join(' · ')||'Нет подтверждённых pivot-зон'}</span></div><p class="source-note">Расчёт MAVORA по публичным свечам Binance Futures. Это локальные технические уровни, не данные TradingView напрямую.</p></section><section class="c"><h3>Liquidation Map <span class="tag">CoinGlass</span></h3><p>Тепловая карта ликвидаций доступна на странице CoinGlass. Данные API CoinGlass требуют API-ключ и соответствующий тариф; в этом автономном HTML мы не имитируем карту.</p><a class="source-link" target="_blank" rel="noopener" href="https://www.coinglass.com/pro/futures/LiquidationMap?symbol=${encodeURIComponent(m.symbol.replace('USDT',''))}">Открыть карту ликвидаций CoinGlass ↗</a><p class="source-note">Источник карты: CoinGlass. Внешняя страница может не разрешать отображение внутри iframe.</p></section></div><p class="source-note">Источники: Binance USDⓈ-M Futures public REST (funding, open interest, long/short, candles). Обновление по запросу. Не является сигналом или рекомендацией.</p>`}
 async function injectPulse(){const target=$id('mavora-pulse');if(!target)return;target.innerHTML='<div class="c mu">Загрузка публичных рыночных метрик…</div>';try{const m=await liveMetrics(S.sel);target.innerHTML=analyticsHTML(m)}catch(e){target.innerHTML='<div class="c"><b>Рыночные метрики временно недоступны</b><p class="source-note">Проверьте подключение к Binance Futures API. Значения не подменяются демо-данными.</p></div>'}}
 // Make Discover's primary market view richer while retaining original filters/table.
 const oldDisc=disc;disc=function(){return oldDisc()+`<section class="c" style="margin-top:14px"><div class="row sp"><h3>Live Market Pulse</h3><button class="b s" data-a="pulse-refresh">Обновить метрики</button></div><div id="mavora-pulse"></div></section><section class="c" style="margin-top:14px"><h3>Источники данных</h3><div class="row"><span class="tag">Binance Spot · ticker</span><span class="tag">Binance Futures · funding / OI</span><span class="tag">TradingView · charts & screener</span><span class="tag">CoinGlass · liquidation map</span></div><p class="source-note">Метка LIVE ставится только после успешного ответа API. TradingView виджеты загружаются напрямую; содержимое iframe не парсится.</p></section>`};
 // Make terminal Overview and Derivatives display meaningful live analytics cards.
 SP['terminal:Overview']=()=>`<h1>${S.sel} · Market Overview</h1><div class="row sp"><span class="tag">Public market data · LIVE</span><button class="b s" data-a="pulse-refresh">Обновить</button></div><div id="mavora-pulse"></div><div class="c" style="margin-top:12px"><h3>TradingView Chart</h3><div id="mavora-tv-overview" style="height:420px"></div></div>`;
 SP['terminal:Derivatives']=()=>`<h1>${S.sel} · Derivatives</h1><div id="mavora-pulse"></div><div class="analytics-grid"><div class="c"><h3>Funding & Open Interest</h3><p>Funding rate, текущий open interest и long/short ratio подгружаются из публичных Binance Futures endpoints.</p></div><div class="c"><h3>Ликвидации</h3><p>Карта кластеров ликвидаций — внешний CoinGlass, не поддельный график.</p><a class="source-link" target="_blank" rel="noopener" href="https://www.coinglass.com/pro/futures/LiquidationMap?symbol=${encodeURIComponent(S.sel)}">CoinGlass Liquidation Map ↗</a></div></div>`;
 const oldRender2=render;render=function(){oldRender2();if((S.mod==='discover'&&cs()==='Markets')||(S.mod==='terminal'&&(cs()==='Overview'||cs()==='Derivatives'))){injectPulse();if(S.mod==='terminal'&&cs()==='Overview'){const el=$id('mavora-tv-overview');if(el)tvmount(el,'advanced-chart',{autosize:true,symbol:'BINANCE:'+S.sel+'USDT',interval:'60',theme:'dark',style:'1',locale:'ru',backgroundColor:'#000000',allow_symbol_change:true})}}};
 // Discover news from public RSS, through a CORS relay only; display publisher + original link.
 SP['discover:News']=()=>`<h1>Crypto News · RSS</h1><div class="row sp"><span class="source-note">Публичные RSS: CoinDesk, Cointelegraph, Decrypt</span><button class="b s" data-a="news-refresh">Обновить ленту</button></div><div id="mavora-news" class="c" style="margin-top:12px">Загрузка открытых RSS…</div><p class="source-note">Показываются заголовки, краткие описания и ссылки на оригинальные публикации. Права и условия источников сохраняются.</p>`;
 async function loadNews(){const el=$id('mavora-news');if(!el)return;el.textContent='Загружаем RSS-источники…';const feeds=[['CoinDesk','https://www.coindesk.com/arc/outboundfeeds/rss/'],['Cointelegraph','https://cointelegraph.com/rss'],['Decrypt','https://decrypt.co/feed']];let items=[];for(const [name,url] of feeds){try{const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url);const r=await fetch(proxy,{cache:'no-store'});if(!r.ok)continue;const xml=new DOMParser().parseFromString(await r.text(),'text/xml');for(const n of [...xml.querySelectorAll('item')].slice(0,8)){const title=n.querySelector('title')?.textContent?.trim(),link=n.querySelector('link')?.textContent?.trim(),date=n.querySelector('pubDate')?.textContent?.trim(),desc=n.querySelector('description')?.textContent?.replace(/<[^>]*>/g,'').trim();if(title&&link)items.push({name,title,link,date,desc})}}catch(e){}}
 items.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));el.innerHTML=items.slice(0,24).map(n=>`<div class="news-item"><div class="row sp"><span class="tag">${safe(n.name)}</span><small class="mu">${safe(n.date?new Date(n.date).toLocaleString('ru'):'')}</small></div><b><a href="${safe(n.link)}" target="_blank" rel="noopener">${safe(n.title)}</a></b>${n.desc?`<p class="mu">${safe(n.desc.slice(0,280))}</p>`:''}</div>`).join('')||'<p>RSS-парсер не получил данные. Возможно, CORS relay недоступен или источник ограничил запрос. Не подменяем новости вымышленными публикациями.</p>';}
 const oldRender3=render;render=function(){oldRender3();if(S.mod==='discover'&&cs()==='News')loadNews();if(S.mod==='data')sourceCheck()};
 // Add action handling without disturbing the original delegated click handlers.
 document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='pulse-refresh'){injectPulse();}if(b.dataset.a==='news-refresh'){loadNews();}if(b.dataset.a==='sources-refresh'){sourceCheck();}});
 // Keep Discover table and watchlist refreshed from current public Binance spot ticker data.
 async function refreshDiscover(){if(S.mod!=='discover')return;try{const rows=await getJSON(API+'/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','LINKUSDT','AVAXUSDT','TONUSDT'])),12000);for(const x of rows){const a=AS.find(a=>a.s+'USDT'===x.symbol);if(a){a.p=+x.lastPrice;a.o=+x.openPrice;a.v=+x.quoteVolume;a.c=+x.priceChangePercent}}if(cs()==='Markets')dbody();}catch(e){}}
 setInterval(refreshDiscover,18000);refreshDiscover();
 // Correct misleading paper trading risk label: exposure cap is not risk-per-trade.

 async function loadLevels(){const s=sym(),c=await klines(s,'4h',160),last=c.at(-1).c,prev=c.slice(-80,-1),day=await klines(s,'1d',3),pivot=[];for(let i=2;i<c.length-2;i++){if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h)pivot.push({p:c[i].h,type:'R',t:c[i].t});if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l)pivot.push({p:c[i].l,type:'S',t:c[i].t})}function clusters(type){const sorted=pivot.filter(x=>x.type===type&&(type==='R'?x.p>last:x.p<last)).sort((a,b)=>type==='R'?a.p-b.p:b.p-a.p),res=[];for(const x of sorted){const found=res.find(z=>Math.abs(z.price-x.p)/x.p<.0025);if(found){found.count++;found.price=(found.price*(found.count-1)+x.p)/found.count}else res.push({price:x.p,count:1,time:x.t})}return res.slice(0,5)}const sup=clusters('S'),res=clusters('R'),d=day[0];$('pro-levels').innerHTML=card('3 · Market Structure, Swing Levels & Range',`<div class="pro-metrics">${metric('Цена',fmt(last,last<1?6:2),s)}${metric('Вчера High',fmt(d.h,d.h<1?6:2),'Daily candle')}${metric('Вчера Low',fmt(d.l,d.l<1?6:2),'Daily candle')}</div><div class="pro-grid"><div><h4 class="up">Поддержка · 4H pivots</h4>${sup.map(x=>`<div class="pro-zone"><span>${fmt(x.price,2)} ${x.count>1?badge('cluster '+x.count):''}</span><b>${fmt((last-x.price)/last*100,2)}%</b></div>`).join('')||'Нет подтверждённых зон'}</div><div><h4 class="dn">Сопротивление · 4H pivots</h4>${res.map(x=>`<div class="pro-zone"><span>${fmt(x.price,2)} ${x.count>1?badge('cluster '+x.count):''}</span><b>${fmt((x.price-last)/last*100,2)}%</b></div>`).join('')||'Нет подтверждённых зон'}</div></div>`,'Pivot levels — алгоритмические зоны из свечей, а не гарантированные уровни. Подтверждай их объёмом и реакцией цены.')}

 function loadJournalStats(){const a=Array.isArray(S.journal)?S.journal:[],closed=a.filter(t=>t.status==='Closed'&&+t.entry>0&&+t.exit>0&&+t.qty>0),tr=closed.map(t=>{const pnl=(+t.exit-+t.entry)*(t.side==='Long'?1:-1)*+t.qty-(+t.fees||0);return{pnl,r:+t.risk>0?pnl/+t.risk:null,date:t.date}}),wins=tr.filter(x=>x.pnl>0),loss=tr.filter(x=>x.pnl<0),grossWin=wins.reduce((s,x)=>s+x.pnl,0),grossLoss=Math.abs(loss.reduce((s,x)=>s+x.pnl,0)),expect=tr.length?tr.reduce((s,x)=>s+x.pnl,0)/tr.length:0;let eq=0,peak=0,maxDD=0;tr.slice().reverse().forEach(x=>{eq+=x.pnl;peak=Math.max(peak,eq);maxDD=Math.max(maxDD,peak-eq)});const avgR=tr.filter(x=>x.r!==null);$('pro-jstats').innerHTML=card('8 · Journal Analytics & Edge Review',`<div class="pro-metrics">${metric('Closed trades',closed.length,'в расчёте')}${metric('Profit Factor',grossLoss?fmt(grossWin/grossLoss,2):grossWin?'∞':'—','gross profit / gross loss')}${metric('Expectancy','$'+fmt(expect,2),'средний net PnL / сделка',expect>=0?'up':'dn')}${metric('Avg R',avgR.length?fmt(avgR.reduce((s,x)=>s+x.r,0)/avgR.length,2)+'R':'—','по указанному плановому риску')}${metric('Max drawdown','$'+fmt(maxDD,2),'по последовательности закрытий','dn')}${metric('Win rate',closed.length?fmt(wins.length/closed.length*100,1)+'%':'—','закрытые сделки')}</div><p class="pro-sub">Статистика использует фактические записи MAVORA Journal. Для достоверной оценки веди единый формат, учитывай комиссии и не удаляй убыточные сделки.</p>`,'Небольшая выборка не доказывает преимущество стратегии. Оценивай серию сделок, отдельно по сетапам и режимам рынка.')}

 async function refreshAll(){if(proBusy||S.mod!=='terminal'||cs()!=='Pro Desk')return;proBusy=true;$('pro-state').textContent='Обновление '+sym()+' · '+apiTime();const jobs=[['Режим',loadRegime],['Сканер',loadScanner],['Уровни',loadLevels],['Order Flow',loadFlow],['Деривативы',loadDeriv],['Ликвидации',async()=>loadLiquid()],['Risk',async()=>loadRisk()],['Журнал',async()=>loadJournalStats()],['Alerts',async()=>loadAlerts()],['Macro',loadMacro]];const results=await Promise.allSettled(jobs.map(x=>x[1]()));const errors=results.filter(x=>x.status==='rejected');$('pro-state').innerHTML=badge('Последнее обновление '+apiTime(),errors.length?'warn':'live')+(errors.length?` <span class="pro-error">Не загрузились: ${errors.length} блока(ов). Проверь сеть/API; неизвестные значения не подставлены.</span>`:'');proBusy=false}

<script id="mavora-market-analysis">
(()=>{
'use strict';

const signPct=n=>Number.isFinite(+n)?((+n>=0?'+':'')+(+n).toFixed(2)+'%'):'—';
const cls=n=>+n>0?'up':+n<0?'dn':'mu';
const ts=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const money=(n,d=2)=>Number.isFinite(+n)?'$'+(+n).toLocaleString('en-US',{maximumFractionDigits:d}):'—';

function coinIcon(sym,size){
  const s=String(sym||'').toUpperCase().replace(/USDT$/,'');
  const map={MATIC:'matic',POL:'matic',RENDER:'rndr',RNDR:'rndr',PEPE:'pepe',SHIB:'shib',WIF:'wif',BONK:'bonk',ARB:'arb',OP:'op',SUI:'sui',APT:'apt',TON:'ton',FET:'fet',TAO:'tao',WLD:'wld',LINK:'link',UNI:'uni',AAVE:'aave',MKR:'mkr',LDO:'ldo',DOGE:'doge',XRP:'xrp',BNB:'bnb',SOL:'sol',ETH:'eth',BTC:'btc',ADA:'ada',AVAX:'avax',DOT:'dot',TRX:'trx',NEAR:'near',ATOM:'atom',FIL:'fil',AR:'ar',GRT:'grt',CRV:'crv',COMP:'comp',SNX:'snx',XLM:'xlm',LTC:'ltc',BCH:'bch',PYTH:'pyth',ONDO:'ondo',PENDLE:'pendle',STRK:'strk',FLOKI:'floki',CRO:'cro',OKB:'okb'};

}

const SECTORS={'Layer 1':['ETH','SOL','AVAX','ADA','NEAR','ATOM','SUI','APT','TON','DOT','TRX'],'Layer 2':['ARB','OP','STRK','MATIC','POL'],'DeFi':['UNI','AAVE','MKR','CRV','COMP','SNX','LDO','PENDLE'],'AI':['FET','RENDER','TAO','WLD'],'Meme':['DOGE','SHIB','PEPE','WIF','BONK','FLOKI'],'Payments':['XRP','BNB','CRO','XLM'],'Oracle / Infra':['LINK','GRT','FIL','AR','PYTH'],'RWA':['ONDO','POLYX','CFG']};

async function jget(url){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw 0;return await r.json();}catch(e){return null;}}

window.__MKT_TOP = window.__MKT_TOP || [];
window.__MKT_TOP_AT = window.__MKT_TOP_AT || 0;
async function ensureTop100(force){
  const now = Date.now();
  if (!force && window.__MKT_TOP.length >= 80 && now - window.__MKT_TOP_AT < 45000) return window.__MKT_TOP;
  try {
    const r = await fetch('https://api.binance.com/api/v3/ticker/24hr', {cache:'no-store'});
    if (!r.ok) throw 0;
    const a = await r.json();
    const STB = /^(USDC|FDUSD|TUSD|USDP|DAI|BUSD|EUR|EURI|USD1|AEUR|XUSD|PAXG|WBTC|USDT)$/;
    const rows = a.filter(x => /USDT$/.test(x.symbol) && !STB.test(x.symbol.slice(0,-4))
      && !/UPUSDT|DOWNUSDT|BULLUSDT|BEARUSDT|BEAR|BULL/.test(x.symbol)
      && +x.quoteVolume > 0)
      .map(x => {
        const s = x.symbol.slice(0,-4);
        return {s, n: s, p: +x.lastPrice, ch: +x.priceChangePercent, v: +x.quoteVolume,
          high: +x.highPrice, low: +x.lowPrice, trades: +x.count};
      })
      .sort((x,y) => y.v - x.v);
    window.__MKT_TOP = rows.slice(0, 100);
    window.__MKT_TOP_AT = now;
    // also feed global TOP/ALL if present
    try {
      if (typeof TOP !== 'undefined') { TOP.length = 0; TOP.push(...window.__MKT_TOP); }
      if (typeof ALL !== 'undefined') { ALL.length = 0; ALL.push(...rows); }
    } catch(e) {}
    return window.__MKT_TOP;
  } catch(e) {
    if (window.__MKT_TOP.length) return window.__MKT_TOP;
    if (typeof TOP !== 'undefined' && TOP.length) return TOP;
    return [];
  }
}
function list(){
  if (window.__MKT_TOP && window.__MKT_TOP.length) return window.__MKT_TOP;
  if (typeof TOP !== 'undefined' && TOP.length) return TOP;
  if (typeof ALL !== 'undefined' && ALL.length) return ALL.slice(0, 100);
  if (typeof AS !== 'undefined') return AS.map(a => ({s:a.s,n:a.n,p:a.p,ch:typeof CH==='function'?CH(a.s):0,v:a.v}));
  return [];
}

function breadth(rows){if(!rows.length)return null;const n=rows.length,up=rows.filter(x=>+x.ch>0).length,down=rows.filter(x=>+x.ch<0).length,sUp=rows.filter(x=>+x.ch>=5).length,sDn=rows.filter(x=>+x.ch<=-5).length,avg=rows.reduce((a,x)=>a+(+x.ch||0),0)/n,vol=rows.reduce((a,x)=>a+(+x.v||0),0);return {n,up,down,flat:n-up-down,sUp,sDn,avg,vol,upPct:up/n*100,downPct:down/n*100};}
function sectorRows(rows){const map={};rows.forEach(x=>{map[x.s]=x;});return Object.entries(SECTORS).map(([name,syms])=>{const hits=syms.map(s=>map[s]).filter(Boolean);if(!hits.length)return {name,avg:null,n:0,leaders:[],laggards:[]};const avg=hits.reduce((a,x)=>a+(+x.ch||0),0)/hits.length;const sorted=[...hits].sort((a,b)=>+b.ch-+a.ch);return {name,avg,n:hits.length,leaders:sorted.slice(0,3),laggards:sorted.slice(-3).reverse()};}).sort((a,b)=>(b.avg??-999)-(a.avg??-999));}
function metric(t,v,d='',c=''){return `<div class="mktmetric"><small>${t}</small><strong class="${c}">${v}</strong><small>${d}</small></div>`;}
function card(t,b,f=''){return `<section class="c"><h3>${t}</h3>${b}${f?`<p class="source-note" style="margin-top:10px">${f}</p>`:''}</section>`;}
function goBtns(s){return `<button class="b s w" data-a="sel" data-s="${safe(s)}">Terminal</button> <button class="b s" data-a="mkt-lab" data-s="${safe(s)}">Asset Lab</button> <button class="b s" data-a="wlt" data-s="${safe(s)}">${(S.wl||[]).includes(s)?'In list':'Watchlist'}</button>`;}
function assetCell(s,n){return `<span style="display:inline-flex;align-items:center;gap:8px">${coinIcon(s)}<span><b>${safe(s)}</b>${n&&n!==s?` <span class="mu">${safe(n)}</span>`:''}</span></span>`;}

async function loadCore(force=false){
  const now=Date.now();if(!force&&S.mktData.global&&now-(S.mktData.t||0)<75000)return S.mkt;
  const [global,fng,btcK,ethK]=await Promise.all([jget('https://api.coingecko.com/api/v3/global'),jget('https://api.alternative.me/fng/?limit=1'),jget('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=30'),jget('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1d&limit=30')]);
  const atrOf=rows=>{if(!Array.isArray(rows)||rows.length<15)return null;const tr=[];for(let i=1;i<rows.length;i++){const h=+rows[i][2],l=+rows[i][3],pc=+rows[i-1][4];tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}const atr=tr.slice(-14).reduce((a,b)=>a+b,0)/14,last=+rows[rows.length-1][4];return {atr,atrPct:last?atr/last*100:null,last,ch7:rows[rows.length-8]?(last/+rows[rows.length-8][4]-1)*100:null,ch30:rows[0]?(last/+rows[0][4]-1)*100:null};};
  S.mktData={t:now,global:global?.data||null,fng:fng?.data?.[0]||null,btc:atrOf(btcK),eth:atrOf(ethK),majors:S.mktData.majors};try{sv();}catch(e){}return S.mktData;
}
async function loadDerivMajors(){
  const syms=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','TONUSDT'];const out=[];
  await Promise.all(syms.map(async sym=>{try{const [px,oi,fund]=await Promise.all([jget('https://fapi.binance.com/fapi/v1/ticker/price?symbol='+sym),jget('https://fapi.binance.com/fapi/v1/openInterest?symbol='+sym),jget('https://fapi.binance.com/fapi/v1/premiumIndex?symbol='+sym)]);out.push({s:sym.replace('USDT',''),price:px?+px.price:null,oi:oi?+oi.openInterest:null,funding:fund?+fund.lastFundingRate*100:null,mark:fund?+fund.markPrice:null,next:fund?.nextFundingTime||null});}catch(e){}}));
  S.mktData.majors=out;return out;
}
function regime(mcapCh,br){if(mcapCh==null||!br)return {t:'Data incomplete',c:'mu'};if(mcapCh>2&&br.upPct>60)return {t:'Risk-on · Broad uptrend',c:'up'};if(mcapCh<-2&&br.downPct>60)return {t:'Risk-off · Broad selloff',c:'dn'};if(Math.abs(mcapCh)<1&&br.upPct>40&&br.upPct<60)return {t:'Range / choppy',c:'mu'};if(mcapCh>0&&br.upPct<45)return {t:'Narrow advance (few leaders)',c:'mu'};if(mcapCh<0&&br.downPct<45)return {t:'Narrow decline',c:'mu'};return {t:'Mixed regime',c:'mu'};}

SP['discover:Overview']=()=>{setTimeout(()=>renderOverview(),20);return `<h1>Market Overview</h1><div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px"><span class="tag">Step 1 · Context</span><button class="b s w" data-a="mkt-refresh">Refresh all</button><button class="b s" data-a="sbt" data-t="Scanner">Scanner →</button></div><div id="mkt-ov-status" class="mu">Loading…</div><div id="mkt-ov-body"></div>`;};
async function renderOverview(){
  const body=$id('mkt-ov-body'),st=$id('mkt-ov-status');if(!body)return;st.textContent='Fetching…';await Promise.all([loadCore(), ensureTop100()]);
  const g=S.mktData.global,f=S.mktData.fng,rows=list(),br=breadth(rows),sec=sectorRows(rows);
  const mcap=g?.total_market_cap?.usd,mcapCh=g?.market_cap_change_percentage_24h_usd,vol=g?.total_volume?.usd,btcD=g?.market_cap_percentage?.btc,ethD=g?.market_cap_percentage?.eth;
  const reg=regime(mcapCh,br),fngV=f?+f.value:null;
  const topG=[...rows].sort((a,b)=>+b.ch-+a.ch).slice(0,6),topL=[...rows].sort((a,b)=>+a.ch-+b.ch).slice(0,6),topV=[...rows].sort((a,b)=>+b.v-+a.v).slice(0,6);
  const rowIcon=x=>`<div class="r2" style="gap:8px">${coinIcon(x.s)}<b style="min-width:52px">${safe(x.s)}</b><span class="${cls(x.ch)}">${signPct(x.ch)}</span><span class="mu">${money(x.v/1e6,0)}M</span></div>`;
  body.innerHTML=`<div class="mktgrid">${metric('Market Cap',mcap!=null?money(mcap/1e12,2)+'T':'—',mcapCh!=null?signPct(mcapCh)+' 24h':'',cls(mcapCh))}${metric('24h Volume',vol!=null?money(vol/1e9,1)+'B':'—','Global')}${metric('BTC Dom',btcD!=null?fmtN(btcD,1)+'%':'—','')}${metric('ETH Dom',ethD!=null?fmtN(ethD,1)+'%':'—','')}${metric('Fear & Greed',fngV!=null?fngV+' / 100':'—',f?.value_classification||'—',fngV>=55?'up':fngV<=40?'dn':'')}${metric('BTC ATR 14d',S.mktData.btc?.atrPct!=null?fmtN(S.mktData.btc.atrPct,2)+'%':'—',S.mktData.btc?.ch7!=null?'7d '+signPct(S.mktData.btc.ch7):'')}</div>
<div class="gr" style="margin-top:14px">${card('Regime',`<div style="font-size:22px;margin:6px 0" class="${reg.c}"><b>${safe(reg.t)}</b></div><p class="mu">Context only — not an entry signal.</p>`)}${card('Breadth',br?`<div class="r2"><span>Advancing</span><b class="up">${br.up} (${fmtN(br.upPct,1)}%)</b></div><div class="r2"><span>Declining</span><b class="dn">${br.down} (${fmtN(br.downPct,1)}%)</b></div><div class="r2"><span>Strong ≥+5%</span><b class="up">${br.sUp}</b></div><div class="r2"><span>Weak ≤−5%</span><b class="dn">${br.sDn}</b></div><div class="bar" style="margin-top:10px;background:#252525"><i style="width:${Math.max(2,Math.min(98,br.upPct))}%;background:var(--g)"></i></div>`:'<p class="mu">Waiting…</p>')}</div>
<div class="gr" style="margin-top:14px">${card('Leaders',topG.map(rowIcon).join('')||'—')}${card('Laggards',topL.map(rowIcon).join('')||'—')}${card('Highest volume',topV.map(x=>`<div class="r2" style="gap:8px">${coinIcon(x.s)}<b style="min-width:52px">${safe(x.s)}</b><span>${money(x.v/1e6,0)}M</span><span class="${cls(x.ch)}">${signPct(x.ch)}</span></div>`).join('')||'—')}</div>
<div class="c" style="margin-top:14px"><h3>Sectors</h3><div class="gr">${sec.filter(s=>s.n).slice(0,6).map(s=>`<div class="c" style="padding:12px"><div class="row sp"><b>${safe(s.name)}</b><span class="${cls(s.avg)}">${s.avg==null?'—':signPct(s.avg)}</span></div><div class="row" style="margin-top:6px;gap:8px;flex-wrap:wrap;align-items:center">${s.leaders.map(x=>coinIcon(x.s)+' <span class="mu">'+safe(x.s)+'</span>').join(' ')}</div></div>`).join('')}</div>
<div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px"><button class="b s w" data-a="sbt" data-t="Sectors">Full sectors</button><button class="b s" data-a="sbt" data-t="Scanner">Scanner</button><button class="b s" data-a="nav" data-m="terminal" data-pro="1">Pro Desk</button></div></div>
<p class="source-note" style="margin-top:12px">Icons: CoinCap → jsDelivr → letter. Updated ${ts()}</p>`;

SP['discover:Scanner']=()=>{setTimeout(()=>renderScanner(),20);return `<h1>Scanner</h1><div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px"><span class="tag">Step 2</span><button class="b s" data-a="sbt" data-t="Overview">← Overview</button></div><div id="mkt-sc-body"></div>`;};
async function renderScanner(){
  const body=$id('mkt-sc-body');if(!body)return; body.innerHTML='<div class="mu">Loading liquid pairs…</div>'; await ensureTop100();
  const q=S.scr||{v:5,a:-100,b:100,rs:0,sort:'v'},rows0=list(),btc=rows0.find(x=>x.s==='BTC'),btcCh=btc?+btc.ch:0;
  let rows=rows0.filter(x=>(+x.v||0)/1e6>=(q.v||0)&&(+x.ch||0)>=(q.a??-100)&&(+x.ch||0)<=(q.b??100));
  if(q.rs)rows=rows.filter(x=>(+x.ch-btcCh)>=(q.rs||0));
  const sort=q.sort||'v';rows=[...rows].sort((a,b)=>sort==='c'?+b.ch-+a.ch:sort==='rs'?(+b.ch-btcCh)-(+a.ch-btcCh):sort==='s'?a.s.localeCompare(b.s):(+b.v||0)-(+a.v||0));
  const vs=rows0.map(x=>+x.v||0).sort((a,b)=>a-b),medVol=vs[Math.floor(vs.length/2)]||1;
  const table=rows.slice(0,120).map((x,i)=>{const rs=+x.ch-btcCh,unusual=(+x.v||0)>medVol*2.5;return `<tr><td class="mu">${i+1}</td><td>${assetCell(x.s,x.n)} ${unusual?'<span class="tag">VOL+</span>':''}</td><td>${fmtN(x.p,x.p<1?5:2)}</td><td class="${cls(x.ch)}">${signPct(x.ch)}</td><td class="${cls(rs)}">${signPct(rs)}</td><td>${money((+x.v||0)/1e6,1)}M</td><td>${goBtns(x.s)}</td></tr>`;}).join('')||'<tr><td colspan="7" class="mu">No matches</td></tr>';
  body.innerHTML=`<div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
<input id="sc-v" type="number" placeholder="Min vol $M" value="${q.v??5}" style="width:120px">
<input id="sc-a" type="number" placeholder="Ch from %" value="${q.a??-100}" style="width:110px">

async function renderAssetLab(sym){
  const body=$id('mkt-lab-body');if(!body)return;const s=(sym||S.sel||'BTC').toUpperCase().replace(/USDT$/,'');S.sel=s;
  body.innerHTML=`<div class="row" style="gap:10px;align-items:center">${coinIcon(s,28)}<span class="mu">Loading ${safe(s)}…</span></div>`;
  const U='https://fapi.binance.com/fapi/v1/';
  const ema=(a,n)=>{if(!a.length)return null;let e=a[0],k=2/(n+1);for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e;};
  const rsi=(a,n=14)=>{if(a.length<n+1)return null;let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];g+=Math.max(0,d);l+=Math.max(0,-d);}g/=n;l/=n;for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+Math.max(0,d))/n;l=(l*(n-1)+Math.max(0,-d))/n;}return l===0?100:100-100/(1+g/l);};
  try{
    const tfs=await Promise.all(['1d','4h','1h'].map(async tf=>{
      const k=await jget(`${U}klines?symbol=${s}USDT&interval=${tf}&limit=120`);if(!k)return {tf,err:1};
      const c=k.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4]})),closes=c.map(x=>x.c),last=closes.at(-1);
      const e20=ema(closes.slice(-60),20),e50=ema(closes.slice(-80),50);
      const trend=last>e20&&e20>e50?'BULLISH':last<e20&&e20<e50?'BEARISH':'RANGE';
      let tr=0,n=Math.min(14,c.length-1);for(let i=c.length-n;i<c.length;i++){const prev=c[i-1]?.c??c[i].c;tr+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-prev),Math.abs(c[i].l-prev));}
      const atr=(tr/n)/last*100,pivH=[],pivL=[];
      for(let i=2;i<c.length-2;i++){if(c[i].h>c[i-1].h&&c[i].h>c[i-2].h&&c[i].h>c[i+1].h&&c[i].h>c[i+2].h)pivH.push(c[i].h);if(c[i].l<c[i-1].l&&c[i].l<c[i-2].l&&c[i].l<c[i+1].l&&c[i].l<c[i+2].l)pivL.push(c[i].l);}
      return {tf,last,e20,e50,rsi:rsi(closes),atr,trend,res:pivH.filter(v=>v>last).sort((a,b)=>a-b).slice(0,2),sup:pivL.filter(v=>v<last).sort((a,b)=>b-a).slice(0,2),hi:Math.max(...c.slice(-20).map(x=>x.h)),lo:Math.min(...c.slice(-20).map(x=>x.l))};
    }));
    const [pm,oi]=await Promise.all([jget(U+'premiumIndex?symbol='+s+'USDT'),jget(U+'openInterest?symbol='+s+'USDT')]);
    const funding=pm?+pm.lastFundingRate*100:null,ok=tfs.filter(x=>!x.err);
    const biasScore=ok.reduce((a,x)=>a+(x.trend==='BULLISH'?1:x.trend==='BEARISH'?-1:0),0);
    const bias=biasScore>=2?'Bullish bias':biasScore<=-2?'Bearish bias':'Mixed / range',t4=ok.find(x=>x.tf==='4h')||ok[0];
    body.innerHTML=`<div class="row sp" style="margin-bottom:10px"><div class="row" style="gap:10px;align-items:center">${coinIcon(s,32)}<b style="font-size:24px">${safe(s)}</b><span class="tag">${safe(bias)}</span></div><div class="mu">Futures · ${ts()}</div></div>
<div class="mktgrid">${metric('Last',t4?fmtN(t4.last,t4.last<1?5:2):'—','4H')}${metric('Funding',funding!=null?signPct(funding):'—','Perp',funding>0.05?'dn':funding<-0.05?'up':'')}${metric('OI',oi?fmtN(+oi.openInterest,0):'—','Contracts')}${metric('4H ATR %',t4?.atr!=null?fmtN(t4.atr,2)+'%':'—','Vol')}</div>
<div class="c" style="margin-top:12px;overflow:auto"><table><thead><tr><th>TF</th><th>Trend</th><th>RSI14</th><th>EMA20</th><th>EMA50</th><th>Range 20</th></tr></thead><tbody>${ok.map(x=>`<tr><td>${x.tf}</td><td class="${x.trend==='BULLISH'?'up':x.trend==='BEARISH'?'dn':''}">${x.trend}</td><td>${x.rsi!=null?x.rsi.toFixed(1):'—'}</td><td>${fmtN(x.e20,4)}</td><td>${fmtN(x.e50,4)}</td><td>${fmtN(x.lo,4)} – ${fmtN(x.hi,4)}</td></tr>`).join('')}</tbody></table></div>
<div class="gr" style="margin-top:12px">${card('Support',(t4?.sup||[]).map(v=>`<div class="r2 up"><span>${fmtN(v,4)}</span></div>`).join('')||'<span class="mu">—</span>')}${card('Resistance',(t4?.res||[]).map(v=>`<div class="r2 dn"><span>${fmtN(v,4)}</span></div>`).join('')||'<span class="mu">—</span>')}</div>
<div class="c" style="margin-top:12px"><h3>Scenarios</h3><p><b class="up">Bull:</b> above ${t4?.res?.[0]!=null?fmtN(t4.res[0],4):'high'} → ${t4?.res?.[1]!=null?fmtN(t4.res[1],4):'next'}; invalidation ${t4?.sup?.[0]!=null?fmtN(t4.sup[0],4):'support'}.</p><p><b class="dn">Bear:</b> lose ${t4?.sup?.[0]!=null?fmtN(t4.sup[0],4):'support'} → ${t4?.sup?.[1]!=null?fmtN(t4.sup[1],4):'lower'}; invalidation ${t4?.res?.[0]!=null?fmtN(t4.res[0],4):'resistance'}.</p>
<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px"><button class="b s w" data-a="sel" data-s="${safe(s)}">Terminal</button><button class="b s" data-a="nav" data-m="terminal" data-pro="1">Pro Desk</button></div></div>`;
  }catch(e){body.innerHTML=`<p class="mu">Data unavailable for ${safe(s)}.</p>`;}
}

function mountTV(el,name,cfg){
  if(!el)return;
  el.innerHTML='';el.className='tradingview-widget-container';
  const wrap=document.createElement('div');wrap.className='tradingview-widget-container__widget';wrap.style.cssText='height:100%;width:100%';el.appendChild(wrap);
  const s=document.createElement('script');
  s.src='https://s3.tradingview.com/external-embedding/embed-widget-'+name+'.js';
  s.type='text/javascript';s.async=true;s.textContent=JSON.stringify(cfg);
  s.onerror=()=>{showTVFallback(el);};
  el.appendChild(s);
  setTimeout(()=>{if(!el.querySelector('iframe')) showTVFallback(el);},5000);
}

  if(el.dataset.fb)return;el.dataset.fb='1';

function moscowPhase(){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const h = +(parts.find(x=>x.type==='hour')?.value||0);
  const m = +(parts.find(x=>x.type==='minute')?.value||0);
  const t = h + m/60;
  if (t >= 5.5 && t < 8) return 'dawn';
  if (t >= 8 && t < 17) return 'day';
  if (t >= 17 && t < 20.5) return 'sunset';
  return 'night';
}

function fmtTZ(tz){
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date());
}
function hourIn(tz){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  return +(parts.find(x=>x.type==='hour')?.value||0);
}
function sessionInfo(){
  const utcH = hourIn('UTC');
  const tokyo = utcH >= 0 && utcH < 9;
  const london = utcH >= 7 && utcH < 16;
  const ny = utcH >= 13 && utcH < 22;
  let name = 'Asia / Quiet';
  if (london && ny) name = 'London–NY';
  else if (ny) name = 'New York';
  else if (london) name = 'London';
  else if (tokyo) name = 'Tokyo / Asia';
  const bits = [];
  if (tokyo) bits.push('TKO');
  if (london) bits.push('LDN');
  if (ny) bits.push('NY');
  if (!bits.length) bits.push('Crypto 24/7');
  return {name, open: bits.join(' · '), active: tokyo||london||ny};
}

function sessionBarHTML(){
  const s = sessionInfo();
  return `<div class="session-bar" id="sessionBar">
    <div class="session-chip"><small>MSK</small><b id="clk-msk">${fmtTZ('Europe/Moscow')}</b></div>
    <div class="session-chip"><small>New York</small><b id="clk-ny">${fmtTZ('America/New_York')}</b></div>
    <div class="session-chip"><small>Session</small><b id="clk-sess"><span class="session-dot ${s.active?'live':''}"></span>${s.name}</b><span class="sub" id="clk-sess-sub">${s.open}</span></div>
  </div>`;
}

function syncClocks(){
  const msk = document.getElementById('clk-msk');
  const ny = document.getElementById('clk-ny');
  const sess = document.getElementById('clk-sess');
  const sub = document.getElementById('clk-sess-sub');
  if (msk) msk.textContent = fmtTZ('Europe/Moscow');
  if (ny) ny.textContent = fmtTZ('America/New_York');
  if (sess) {
    const s = sessionInfo();
    sess.innerHTML = `<span class="session-dot ${s.active?'live':''}"></span>${s.name}`;
    if (sub) sub.textContent = s.open;
  }
}

function syncHeroSky(){
  /* static logo — no day/night phase */
  const el=document.getElementById('heroSky');
  if(!el)return;
  el.dataset.phase='logo';
}

function injectSessionBar(){
  if (S.mod !== 'home') return;
  const hero = document.querySelector('#pg .hero');
  if (!hero) return;
  // ensure flex column-ish for bar at bottom of hero
  hero.style.flexWrap = 'wrap';
  if (!document.getElementById('sessionBar')) {
    hero.insertAdjacentHTML('beforeend', sessionBarHTML());
  } else syncClocks();
}

window.skyScene = skyScene;

const _r = render;
render = function(){
  _r();
  if (S.mod === 'home') {
    const sky = document.getElementById('heroSky');
    if (sky && !sky.querySelector('.sky-icon-wrap')) sky.outerHTML = skyScene();
    syncHeroSky();
    injectSessionBar();
  }
};

setInterval(() => { syncHeroSky(); syncClocks(); }, 1000);
setTimeout(() => { syncHeroSky(); injectSessionBar(); }, 80);
})();
</script>

<script id="mavora-account-v2">
(()=>{
'use strict';
/* Account desk: Overview · Performance · Capital & PnL · Reports · Journal (kept & improved) */

const $id = id => document.getElementById(id);
const safe = v => (typeof esc === 'function' ? esc(String(v ?? '')) : String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const money = (n, d=2) => Number.isFinite(+n) ? ((+n < 0 ? '-' : '') + '$' + Math.abs(+n).toLocaleString('en-US', {maximumFractionDigits: d})) : '—';
const pct = n => Number.isFinite(+n) ? ((+n >= 0 ? '+' : '') + (+n).toFixed(2) + '%') : '—';
const cls = n => +n > 0 ? 'up' : +n < 0 ? 'dn' : 'mu';
const nd = 'Insufficient data';

// Tabs per ТЗ — keep Journal, drop profile/security/API; Positions via links only
SUB.account = ['Overview', 'Performance', 'Capital & PnL', 'Reports', 'Journal'];

S.accUI = S.accUI || {period: '30D', chartMode: 'equity', privacy: 0, from: '', to: ''};

function jClosed() {
  return (S.journal || []).filter(t => t.status === 'Closed' && +t.entry > 0 && +t.qty > 0);
}
function jPnL(t) {
  if (typeof jcalc === 'function') return jcalc(t);
  const dir = t.side === 'Long' ? 1 : -1;
  return ((+t.exit || 0) - (+t.entry || 0)) * (+t.qty || 0) * dir - (+t.fees || 0);
}
function jDate(t) {
  const d = (t.date || t.created || '').toString();
  const x = Date.parse(d);
  return Number.isFinite(x) ? x : 0;
}
function periodStart(key) {
  const now = Date.now();
  const day = 86400000;
  if (key === 'Today') { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  if (key === '7D') return now - 7 * day;
  if (key === '30D') return now - 30 * day;
  if (key === '90D') return now - 90 * day;
  if (key === '1Y') return now - 365 * day;
  if (key === 'Custom' && S.accUI.from) return Date.parse(S.accUI.from) || 0;
  return 0; // All
}
function periodEnd(key) {
  if (key === 'Custom' && S.accUI.to) return Date.parse(S.accUI.to) || Date.now();
  return Date.now();
}
function tradesInPeriod(key) {
  const a = periodStart(key), b = periodEnd(key);
  return jClosed().filter(t => {
    const x = jDate(t);
    if (!x) return key === 'All';
    return x >= a && x <= b;
  }).sort((x, y) => jDate(x) - jDate(y));
}
function paperEquity() {
  if (typeof eq === 'function') { try { return +eq(); } catch(e) {} }
  const bal = +(S.bal ?? 10000);
  return bal + (S.pos || []).reduce((s, x) => s + (typeof pnl === 'function' ? (+pnl(x)||0) : 0), 0);
}
function walletBalance() { return +(S.bal ?? 10000); }
function unrealized() {
  return (S.pos || []).reduce((s, x) => s + (typeof pnl === 'function' ? pnl(x) : 0), 0);
}
function realizedAll() {
  return jClosed().reduce((s, t) => s + jPnL(t), 0);
}
function feesSum(tr) { return tr.reduce((s, t) => s + (+t.fees || 0), 0); }

function stats(tr) {
  if (!tr.length) return null;
  const pnls = tr.map(jPnL);
  const wins = pnls.filter(x => x > 0);
  const loss = pnls.filter(x => x < 0);
  const grossW = wins.reduce((a, b) => a + b, 0);
  const grossL = Math.abs(loss.reduce((a, b) => a + b, 0));
  const net = pnls.reduce((a, b) => a + b, 0);
  const rs = tr.filter(t => +t.risk > 0).map(t => jPnL(t) / +t.risk);
  let eq = 0, peak = 0, maxDD = 0, curDD = 0;
  pnls.forEach(p => { eq += p; peak = Math.max(peak, eq); maxDD = Math.max(maxDD, peak - eq); curDD = peak - eq; });
  let streak = 0, maxStreak = 0, curStreak = 0;
  pnls.forEach(p => {
    if (p < 0) { curStreak++; maxStreak = Math.max(maxStreak, curStreak); }
    else curStreak = 0;
  });
  streak = curStreak;
  return {
    n: tr.length,
    wins: wins.length,
    loss: loss.length,
    winRate: wins.length / tr.length * 100,
    pf: grossL ? grossW / grossL : (grossW ? Infinity : null),
    expect: net / tr.length,
    avgWin: wins.length ? grossW / wins.length : null,
    avgLoss: loss.length ? -grossL / loss.length : null,
    avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null,
    net,
    maxDD,
    curDD,
    peak,
    best: Math.max(...pnls),
    worst: Math.min(...pnls),
    fees: feesSum(tr),
    maxStreak,
    streak,
    pnls
  };
}

function groupBy(tr, keyFn) {
  const g = {};
  tr.forEach(t => {
    const k = keyFn(t) || '—';
    (g[k] = g[k] || []).push(t);
  });
  return Object.entries(g).map(([k, arr]) => {
    const s = stats(arr);
    return {k, n: arr.length, net: s?.net ?? 0, wr: s?.winRate ?? null, pf: s?.pf ?? null, avgR: s?.avgR ?? null};
  }).sort((a, b) => b.net - a.net);
}

function equitySeries(tr, startBal) {
  let eq = startBal;
  const pts = [{t: 0, v: eq, label: 'start'}];
  tr.forEach((t, i) => {
    eq += jPnL(t);
    pts.push({t: i + 1, v: eq, label: (t.symbol || '') + ' ' + (t.date || '').slice(0, 10)});
  });
  return pts;
}

function chartSVG(pts, mode) {
  if (!pts || pts.length < 2) return `<div class="acc-empty">${nd} for equity curve</div>`;
  const vals = pts.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const w = 600, h = 160, pad = 8;
  const poly = pts.map((p, i) => {
    const x = pad + i * (w - 2 * pad) / (pts.length - 1);
    const y = h - pad - ((p.v - min) / span) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  // max DD segment annotation via peak tracking
  return `<svg class="acc-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="var(--ac,#cdb9ff)" stroke-width="2" points="${poly}"/>
  </svg>
  <div class="acc-row acc-note">
    <span>Start ${money(pts[0].v)}</span>
    <span>End ${money(pts[pts.length-1].v)}</span>
    <span class="${cls(pts[pts.length-1].v - pts[0].v)}">${money(pts[pts.length-1].v - pts[0].v)}</span>
  </div>`;
}

function periodPills(active) {
  return ['Today', '7D', '30D', '90D', '1Y', 'All'].map(p =>
    `<button class="acc-pill ${active === p ? 'on' : ''}" data-a="acc-period" data-p="${p}">${p}</button>`
  ).join('');
}

function metricCard(title, value, hint, color) {
  const blur = S.accUI.privacy ? 'acc-blur' : '';
  return `<div class="acc-metric"><small>${title}</small><strong class="${blur} ${color || ''}">${value}</strong><span class="hint">${hint || ''}</span></div>`;
}

function linksBar() {
  return `<div class="acc-row">
    <button class="b s w" data-a="sbt" data-t="Journal">View Trade Journal</button>
    <button class="b s" data-a="nav" data-m="terminal">Open positions → Terminal</button>
    <button class="b s" data-a="nav" data-m="terminal" data-pro="1">Pro Desk · Risk</button>
    <button class="b s ${S.accUI.privacy ? 'on' : ''}" data-a="acc-privacy">${S.accUI.privacy ? 'Privacy ON' : 'Privacy'}</button>
  </div>`;
}

// ---------- Overview ----------
SP['account:Overview'] = () => {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const st = stats(tr);
  const wallet = walletBalance();
  const unrl = unrealized();
  const equity = (typeof eq === 'function' ? eq() : wallet + unrl);
  const realized = st ? st.net : 0;
  const startEq = 10000; // paper start; deposits not tracked separately
  const ret = st && startEq ? (realized / startEq) * 100 : null;
  const pts = equitySeries(tr, startEq);
  const bodyClass = S.accUI.privacy ? 'acc-privacy' : '';

  return `<h1>Account · Overview</h1>
<div class="${bodyClass}">
${linksBar()}
<div class="acc-row">${periodPills(per)}<span class="acc-note">Period applies to PnL & curve · PAPER</span></div>
<div class="acc-grid">
  ${metricCard('Total Equity', money(equity), 'Wallet + unrealized (PAPER)', cls(equity - 10000))}
  ${metricCard('Wallet Balance', money(wallet), 'Free cash · not equity')}
  ${metricCard('Available', money(wallet), 'Same as free balance in paper mode')}
  ${metricCard('Unrealized PnL', money(unrl), 'Open PAPER positions only', cls(unrl))}
  ${metricCard('Realized PnL', st ? money(st.net) : '—', per + ' · closed journal trades', st ? cls(st.net) : '')}
  ${metricCard('Net PnL', st ? money(st.net - (st.fees || 0) * 0) : '—', 'After fees in journal rows', st ? cls(st.net) : '')}
  ${metricCard('Return', ret != null ? pct(ret) : '—', per + ' vs $10k start (excludes deposits)', ret != null ? cls(ret) : '')}
  ${metricCard('Open positions', String((S.pos || []).length), 'Manage in Terminal · not here')}
</div>
<div class="c" style="margin-top:4px">
  <div class="acc-row"><h3 style="margin:0">Equity curve</h3>
    <button class="acc-pill ${S.accUI.chartMode==='equity'?'on':''}" data-a="acc-chart" data-m="equity">Equity</button>
    <button class="acc-pill ${S.accUI.chartMode==='pnl'?'on':''}" data-a="acc-chart" data-m="pnl">Realized PnL</button>
  </div>
  ${st ? chartSVG(S.accUI.chartMode === 'pnl' ? tr.map((t,i)=>({t:i,v:jPnL(t)})) : pts) : `<div class="acc-empty">${nd}. Close trades in Journal to build the curve.</div>`}
  ${st ? `<div class="acc-note">Max drawdown (period): <b class="dn">${money(-st.maxDD)}</b> · Peak equity path: ${money(st.peak + startEq)}</div>` : ''}
</div>
<p class="acc-note" style="margin-top:12px">Balances are PAPER simulation. Deposits/withdrawals are not tracked separately — return is pure trading result vs $10,000 start. Journal is the source of realized PnL.</p>
</div>`;
};

// ---------- Performance ----------
SP['account:Performance'] = () => {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const st = stats(tr);
  const byStrat = groupBy(tr, t => t.strategy || (S.jmeta && S.jmeta[t.id] && S.jmeta[t.id].setup) || '');
  const byAsset = groupBy(tr, t => t.symbol || '—');
  const bySide = groupBy(tr, t => t.side || '—');
  const meta = S.jmeta || {};
  const byTag = groupBy(tr, t => (meta[t.id]?.tags || '').split(',')[0]?.trim() || '');

  const row = (label, val, hint) => `<div class="r2"><span title="${safe(hint || '')}">${label}</span><b>${val}</b></div>`;

  return `<h1>Account · Performance</h1>
${linksBar()}
<div class="acc-row">${periodPills(per)}</div>
${!st ? `<div class="c acc-empty">${nd} for ${per}. Add closed trades in Journal.</div>` : `
<div class="acc-grid">
  ${metricCard('Total Trades', st.n, per)}
  ${metricCard('Win Rate', st.winRate.toFixed(1) + '%', st.wins + ' wins / ' + st.loss + ' losses')}
  ${metricCard('Profit Factor', st.pf == null ? '—' : (st.pf === Infinity ? '∞' : st.pf.toFixed(2)), 'Gross profit / gross loss')}
  ${metricCard('Expectancy', money(st.expect), 'Avg net PnL per trade', cls(st.expect))}
  ${metricCard('Average Win', st.avgWin != null ? money(st.avgWin) : '—', '', 'up')}
  ${metricCard('Average Loss', st.avgLoss != null ? money(st.avgLoss) : '—', '', 'dn')}
  ${metricCard('Average R', st.avgR != null ? st.avgR.toFixed(2) + 'R' : '—', 'Needs risk field in journal')}
  ${metricCard('Max Drawdown', money(-st.maxDD), 'Peak-to-trough on closed sequence', 'dn')}
  ${metricCard('Best Trade', money(st.best), '', 'up')}
  ${metricCard('Worst Trade', money(st.worst), '', 'dn')}
  ${metricCard('Fees', money(st.fees), 'Sum of journal fees')}
  ${metricCard('Losing streak', st.maxStreak, 'Max consecutive losses in period')}
</div>
<div class="gr" style="margin-top:14px">
  <div class="c"><h3>By strategy / setup</h3>
    ${byStrat.filter(x => x.k).length ? `<table class="acc-table"><thead><tr><th>Strategy</th><th>n</th><th>Win%</th><th>Net</th><th>PF</th><th></th></tr></thead><tbody>
    ${byStrat.filter(x => x.k).map(x => `<tr>
      <td>${safe(x.k)}${x.n < 5 ? ' <span class="tag">small sample</span>' : ''}</td>
      <td>${x.n}</td><td>${x.wr != null ? x.wr.toFixed(0) + '%' : '—'}</td>
      <td class="${cls(x.net)}">${money(x.net)}</td>
      <td>${x.pf == null ? '—' : x.pf === Infinity ? '∞' : x.pf.toFixed(2)}</td>
      <td><button class="b s" data-a="acc-jr-filter" data-k="strategy" data-v="${safe(x.k)}">Journal</button></td>
    </tr>`).join('')}</tbody></table>` : `<p class="acc-note">No strategy tags yet. Set strategy on journal trades or setup in trade review.</p>`}
  </div>
  <div class="c"><h3>By asset</h3>
    <table class="acc-table"><thead><tr><th>Asset</th><th>n</th><th>Win%</th><th>Net</th><th></th></tr></thead><tbody>
    ${byAsset.slice(0, 12).map(x => `<tr>
      <td>${typeof coinIcon === 'function' ? coinIcon(x.k) : ''} <b>${safe(x.k)}</b></td>
      <td>${x.n}</td><td>${x.wr != null ? x.wr.toFixed(0) + '%' : '—'}</td>
      <td class="${cls(x.net)}">${money(x.net)}</td>
      <td><button class="b s" data-a="acc-jr-filter" data-k="symbol" data-v="${safe(x.k)}">Journal</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="mu">—</td></tr>'}
    </tbody></table>
  </div>
  <div class="c"><h3>Long / Short</h3>
    <table class="acc-table"><thead><tr><th>Side</th><th>n</th><th>Win%</th><th>Net</th></tr></thead><tbody>
    ${bySide.map(x => `<tr><td>${safe(x.k)}</td><td>${x.n}</td><td>${x.wr != null ? x.wr.toFixed(0) + '%' : '—'}</td><td class="${cls(x.net)}">${money(x.net)}</td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="c"><h3>Risk snapshot</h3>
    ${row('Current DD (seq.)', money(-st.curDD), 'From peak of closed PnL path')}
    ${row('Max DD', money(-st.maxDD), '')}
    ${row('Peak path equity', money(st.peak + 10000), 'Start 10k + peak cumulative')}
    ${row('Open risk exposure', (S.pos || []).length ? money((S.pos || []).reduce((s, x) => s + (x.q || 0) * (typeof P === 'function' ? P(x.s) : 0), 0)) : '—', 'Notional open · stops not always known')}
    <p class="acc-note">Exposure without verified stop distances is not treated as risk budget.</p>
  </div>
</div>`}`;
};

// ---------- Capital & PnL ----------
SP['account:Capital & PnL'] = () => {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const st = stats(tr);
  const start = 10000;
  const realized = st ? st.net : 0;
  const fees = st ? st.fees : 0;
  const end = start + realized; // paper path without external flows
  const wallet = walletBalance();
  const unrl = unrealized();

  return `<h1>Account · Capital & PnL</h1>
${linksBar()}
<div class="acc-row">${periodPills(per)}</div>
<div class="c">
  <h3>Capital movement (${safe(per)})</h3>
  <div class="r2"><span>Starting capital</span><b>${money(start)}</b></div>
  <div class="r2"><span>Deposits</span><b class="mu">Not tracked · —</b></div>
  <div class="r2"><span>Withdrawals</span><b class="mu">Not tracked · —</b></div>
  <div class="r2"><span>Realized trading PnL</span><b class="${cls(realized)}">${money(realized)}</b></div>
  <div class="r2"><span>Fees (journal)</span><b>${money(fees)}</b></div>
  <div class="r2"><span>Funding</span><b class="mu">Not in journal · —</b></div>
  <div class="r2"><span>Ending capital (trading path)</span><b>${money(end)}</b></div>
  <p class="acc-note" style="margin-top:10px">External cash flows are not recorded. Return metrics use trading results only and do not treat deposits as profit.</p>
</div>
<div class="gr" style="margin-top:14px">
  <div class="c">
    <h3>Live PAPER wallet</h3>
    <div class="r2"><span>Wallet balance</span><b>${money(wallet)}</b></div>
    <div class="r2"><span>Unrealized</span><b class="${cls(unrl)}">${money(unrl)}</b></div>
    <div class="r2"><span>Equity</span><b>${money(typeof eq === 'function' ? eq() : wallet + unrl)}</b></div>
  </div>
  <div class="c">
    <h3>Period summary</h3>
    <div class="r2"><span>Closed trades</span><b>${st ? st.n : 0}</b></div>
    <div class="r2"><span>Net PnL</span><b class="${st ? cls(st.net) : ''}">${st ? money(st.net) : '—'}</b></div>
    <div class="r2"><span>Win rate</span><b>${st ? st.winRate.toFixed(1) + '%' : '—'}</b></div>
  </div>
</div>`;
};

// ---------- Reports ----------
SP['account:Reports'] = () => {
  const per = S.accUI.period || '30D';
  const tr = tradesInPeriod(per);
  const st = stats(tr);
  return `<h1>Account · Reports</h1>
${linksBar()}
<div class="acc-row">${periodPills(per)}</div>
<div class="c">
  <h3>Build report</h3>
  <p class="acc-note">Exports use journal closed trades for the selected period. PAPER account · local only.</p>
  <div class="acc-row">
    <button class="b w" data-a="acc-export" data-fmt="csv">Export CSV</button>
    <button class="b" data-a="acc-export" data-fmt="json">Export JSON</button>
    <button class="b" data-a="acc-export" data-fmt="summary">Copy summary</button>
  </div>
</div>
<div class="c" style="margin-top:14px">
  <h3>Preview · ${safe(per)}</h3>
  ${!st ? `<div class="acc-empty">${nd}</div>` : `
  <div class="r2"><span>Trades</span><b>${st.n}</b></div>
  <div class="r2"><span>Net PnL</span><b class="${cls(st.net)}">${money(st.net)}</b></div>
  <div class="r2"><span>Win rate</span><b>${st.winRate.toFixed(1)}%</b></div>
  <div class="r2"><span>Profit factor</span><b>${st.pf == null ? '—' : st.pf === Infinity ? '∞' : st.pf.toFixed(2)}</b></div>
  <div class="r2"><span>Max DD</span><b class="dn">${money(-st.maxDD)}</b></div>
  <div class="r2"><span>Fees</span><b>${money(st.fees)}</b></div>
  <div class="r2"><span>Expectancy</span><b class="${cls(st.expect)}">${money(st.expect)}</b></div>`}
</div>
<div class="c" style="margin-top:14px">
