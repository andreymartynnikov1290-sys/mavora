    } else if (b.dataset.a === 'mkt-refresh') {
      /* Let the original Market handler refresh its private Top 100 cache.
         Repaint this combined view afterwards without blocking that handler. */
      if (window.__MKT_TOP_AT !== undefined) window.__MKT_TOP_AT = 0;
      const started = Date.now();
      const repaint = () => {
        if (S.mod !== 'discover' || cs() !== 'Scanner' || S.mktCombinedTab !== 'top100') return;
        drawMarketCombinedView();
        if (Date.now() - started < 9000) setTimeout(repaint, 1100);
      };
      setTimeout(repaint, 850);
    }
  }, true);
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'dq' && S.mod === 'discover' && cs() === 'Scanner' && S.mktCombinedTab === 'top100') {
      e.stopImmediatePropagation();
      const value=e.target.value, pos=e.target.selectionStart;
      S.mktTopQuery=value;
      drawMarketCombinedView();
      setTimeout(()=>{const next=document.getElementById('dq');if(next){next.focus();try{next.setSelectionRange(pos,pos);}catch(_){}}},45);
    }
  }, true);

  /* ---------- Terminal: remove abandoned Risk Sim tab ---------- */
  SUB.terminal = SUB.terminal.filter(t => t !== 'Risk Sim');
  delete SP['terminal:Risk Sim'];
  if (S.sb && S.sb.terminal === 'Risk Sim') S.sb.terminal = 'Workspace';
  if (!SUB.terminal.includes('Workspace')) SUB.terminal.push('Workspace');

  /* ---------- Workspace state ---------- */
  const tfList = ['1m','5m','15m','1h','4h','1d'];
  function getWs(){
    S.ws = S.ws && typeof S.ws === 'object' ? S.ws : {};
    const ws = S.ws;
    ws.symbol = safeSymbol(ws.symbol || S.sel || 'BTC');
    ws.tf = tfList.includes(ws.tf) ? ws.tf : (tfList.includes(S.tf) ? S.tf : '1h');
    ws.layout = ['2x2','focus','1col','3col'].includes(ws.layout) ? ws.layout : '2x2';
    ws.panels = Object.assign({chart:true,book:true,flow:true,deriv:true,watch:true,notes:true}, ws.panels || {});
    ws.notes = typeof ws.notes === 'string' ? ws.notes : (S.notes || '');
    return ws;
  }

  function getSymbols(){
    let rows = [];
    try { if (typeof list === 'function') rows = list(); } catch (_) {}
    if (!Array.isArray(rows) || !rows.length) rows = Array.isArray(window.__MKT_TOP) ? window.__MKT_TOP : [];
    if (!rows.length && Array.isArray(AS)) rows = AS;
    const symbols = rows.map(x => ({s:safeSymbol(x.s),n:x.n || x.s})).filter(x => x.s);
    const current = getWs().symbol;
    if (!symbols.some(x => x.s === current)) symbols.unshift({s:current,n:current});
    const unique = new Map();
    symbols.forEach(x => { if (!unique.has(x.s)) unique.set(x.s,x); });
    return [...unique.values()].slice(0,150);
  }

  function wsPanel(key,title,body){
    const ws=getWs();
    return `<section class="mav-ws-panel" data-panel="${key}" ${ws.panels[key]?'':'hidden'}><div class="mav-ws-panel-head"><h3>${title}</h3><span class="mav-ws-panel-live" id="mav-ws-${key}-panel-state">Waiting</span></div>${body}</section>`;
  }

  SP['terminal:Workspace'] = () => {
    const ws = getWs();
    const symbols = getSymbols();
    const options = symbols.map(x => `<option value="${x.s}" ${x.s===ws.symbol?'selected':''}>${x.s}${x.n && x.n!==x.s?' · '+escText(x.n):''}</option>`).join('');
    return `<div class="mav-ws-shell mav-enter">
      <div class="mav-ws-heading"><div><h1>Trading Workspace</h1><p class="mu">Рабочее пространство для анализа рынка: график, стакан, поток сделок, деривативы, watchlist и заметки.</p></div><span class="mav-ws-source" id="mav-ws-connection">Проверка соединения…</span></div>
      <div class="mav-ws-toolbar">
        <label class="mav-ws-select-label">Asset<select id="mav-ws-symbol">${options}</select></label>
        <div class="mav-ws-tfs" role="group" aria-label="Timeframe">${tfList.map(t=>`<button type="button" class="b s ${ws.tf===t?'on':''}" data-a="mav-ws-tf" data-tf="${t}">${t}</button>`).join('')}</div>
        <button type="button" class="b s" data-a="mav-ws-refresh">Refresh data</button>
        <button type="button" class="b s w" data-a="mav-ws-add">${(S.wl||[]).includes(ws.symbol)?'In Watchlist':'＋ Watchlist'}</button>
        <button type="button" class="b s" data-a="mav-ws-save">Save workspace</button>
      </div>
      <div class="mav-ws-controls">
        <div class="mav-ws-layouts" aria-label="Workspace layout">
          <span class="mu">Layout</span>
          ${[['2x2','2 × 2'],['focus','Chart focus'],['1col','One column'],['3col','3 columns']].map(([k,l])=>`<button type="button" class="b s ${ws.layout===k?'on':''}" data-a="mav-ws-layout" data-layout="${k}">${l}</button>`).join('')}
        </div>
        <details class="mav-ws-panel-menu"><summary>Panels</summary><div class="mav-ws-panel-options">${[['chart','Chart'],['book','Order book'],['flow','Trade flow'],['deriv','Derivatives'],['watch','Watchlist'],['notes','Research notes']].map(([k,l])=>`<label><input type="checkbox" data-a="mav-ws-panel" data-panel="${k}" ${ws.panels[k]?'checked':''}> ${l}</label>`).join('')}</div></details>
      </div>
      <div class="mav-ws-grid" id="mav-ws-grid" data-layout="${ws.layout}">
        ${wsPanel('chart','Live candlestick chart',`<div class="mav-ws-chart-meta" id="mav-ws-chart-meta">Loading candles…</div><canvas id="mav-ws-chart" height="250" aria-label="Candlestick chart"></canvas><div class="mav-ws-chart-foot"><span id="mav-ws-chart-range">Binance USDⓈ-M · ${ws.tf}</span><a href="https://www.tradingview.com/chart/?symbol=BINANCE%3A${ws.symbol}USDT" target="_blank" rel="noopener">Open TradingView ↗</a></div>`)}
        ${wsPanel('book','Order book',`<div id="mav-ws-book" class="mav-ws-data"><p class="mu">Загрузка стакана…</p></div>`)}
        ${wsPanel('flow','Aggressive trade flow',`<div id="mav-ws-flow" class="mav-ws-data"><p class="mu">Загрузка сделок…</p></div>`)}
        ${wsPanel('deriv','Derivatives snapshot',`<div id="mav-ws-deriv" class="mav-ws-data"><p class="mu">Загрузка funding / OI…</p></div>`)}
        ${wsPanel('watch','Watchlist',`<div id="mav-ws-watch" class="mav-ws-data"></div>`)}
        ${wsPanel('notes','Research notes',`<textarea id="mav-ws-notes" rows="8" placeholder="Контекст рынка, уровни, сценарии, условия отмены идеи…">${escText(ws.notes)}</textarea><div class="mav-ws-note-foot"><span class="mu">Автосохранение локально</span><span id="mav-ws-notes-state" class="mu">Saved</span></div>`)}
      </div>
      <div class="mav-ws-disclaimer">Данные публичного Binance Futures API. Пространство предназначено для анализа: ордера не отправляются, стакан и поток сделок показывают публичные рыночные данные, а не приватные данные аккаунта.</div>
    </div>`;
  };

  async function wsJson(url){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(),9000);
    try { const r = await fetch(url,{cache:'no-store',signal:controller.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
    catch (_) { return null; }
    finally { clearTimeout(timer); }
  }

  let wsLastCandles = null;
  let wsRequestId = 0;
  function drawWsCandles(rows){
    const canvas=document.getElementById('mav-ws-chart');
    if(!canvas || !Array.isArray(rows) || !rows.length) return;
    const rect=canvas.getBoundingClientRect();
    const w=Math.max(300,Math.floor(rect.width||canvas.parentElement?.clientWidth||600));
    const h=250, dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr); canvas.style.width='100%'; canvas.style.height=h+'px';
    const x=canvas.getContext('2d'); if(!x)return; x.scale(dpr,dpr);
    x.clearRect(0,0,w,h);
    const pad={l:12,r:65,t:12,b:28}, plotW=w-pad.l-pad.r, plotH=178, volH=30;
    const highs=rows.map(z=>+z[2]), lows=rows.map(z=>+z[3]), vols=rows.map(z=>+z[5]||0);
    let hi=Math.max(...highs),lo=Math.min(...lows); if(!(hi>lo)){hi*=1.001;lo*=.999;}
    const extra=(hi-lo)*.06; hi+=extra; lo-=extra;
    const y=v=>pad.t+(hi-v)/(hi-lo)*plotH;
    x.strokeStyle='#242424';x.lineWidth=1;
    for(let i=0;i<=4;i++){const yy=pad.t+i*plotH/4;x.beginPath();x.moveTo(pad.l,yy);x.lineTo(pad.l+plotW,yy);x.stroke();x.fillStyle='#777';x.font='10px Arial';x.fillText((hi-(hi-lo)*i/4).toLocaleString('en-US',{maximumFractionDigits:hi<1?5:2}),pad.l+plotW+6,yy+3);}
    const step=plotW/rows.length, bodyW=Math.max(2,Math.min(9,step*.62)), maxVol=Math.max(1,...vols);
    rows.forEach((z,i)=>{
      const o=+z[1],hh=+z[2],ll=+z[3],c=+z[4],cx=pad.l+i*step+step/2,up=c>=o,col=up?'#65d49a':'#f07878';
      x.strokeStyle=col;x.fillStyle=col;x.lineWidth=1;
      x.beginPath();x.moveTo(cx,y(hh));x.lineTo(cx,y(ll));x.stroke();
      const top=Math.min(y(o),y(c)),bh=Math.max(1,Math.abs(y(o)-y(c)));
      x.fillRect(cx-bodyW/2,top,bodyW,bh);
      const vh=(vols[i]/maxVol)*volH;x.globalAlpha=.45;x.fillRect(cx-bodyW/2,h-14-vh,bodyW,vh);x.globalAlpha=1;
    });
    const closes=rows.map(z=>+z[4]);let e=closes[0],k=2/21;const ema=[];closes.forEach(v=>{e=v*k+e*(1-k);ema.push(e)});
    x.strokeStyle='#e4e4e4';x.lineWidth=1.2;x.beginPath();ema.forEach((v,i)=>{const cx=pad.l+i*step+step/2;i?x.lineTo(cx,y(v)):x.moveTo(cx,y(v));});x.stroke();
    x.fillStyle='#777';x.font='10px Arial';x.fillText('VOL',pad.l,h-3);
  }

  function renderWsWatchlist(){
    const el=document.getElementById('mav-ws-watch'); if(!el)return;
    const symbols=Array.isArray(S.wl)?S.wl:[];
    if(!symbols.length){el.innerHTML='<p class="mu">Watchlist пуст. Добавь текущий актив кнопкой ＋ Watchlist.</p>';return;}
    let rows=[];try{rows=typeof list==='function'?list():[];}catch(_){}
    el.innerHTML=symbols.map(s=>{
      const found=rows.find(x=>x.s===s)||((Array.isArray(AS)?AS:[]).find(x=>x.s===s));
      const price=found&&Number.isFinite(+found.p)?num(+found.p,+found.p<1?5:2):'—';
      const change=found&&Number.isFinite(+found.ch)?pct(+found.ch):'—';
      return `<div class="mav-ws-watch-row"><button type="button" data-a="mav-ws-select" data-s="${escText(s)}"><b>${escText(s)}</b><span>${price}</span><span class="mu">${change}</span></button><button type="button" class="mav-ws-remove" data-a="mav-ws-remove" data-s="${escText(s)}" aria-label="Remove ${escText(s)}">×</button></div>`;
    }).join('');
  }

  async function refreshWorkspace(){
    const grid=document.getElementById('mav-ws-grid');
    if(!grid || S.mod!=='terminal' || cs()!=='Workspace') return;
    const id=++wsRequestId,ws=getWs(),symbol=safeSymbol(ws.symbol),tf=tfList.includes(ws.tf)?ws.tf:'1h',pair=symbol+'USDT';
    const connection=document.getElementById('mav-ws-connection');
    if(connection)connection.textContent='Connecting to Binance…';
    const requests=[
      ['chart',`klines?symbol=${pair}&interval=${tf}&limit=90`],
      ['book',`depth?symbol=${pair}&limit=10`],
      ['flow',`aggTrades?symbol=${pair}&limit=100`],
      ['premium',`premiumIndex?symbol=${pair}`],
      ['oi',`openInterest?symbol=${pair}`],
      ['ticker',`ticker/24hr?symbol=${pair}`]
    ];
    const values=await Promise.all(requests.map(async ([k,u])=>[k,await wsJson(api+u)]));
    if(id!==wsRequestId || !document.getElementById('mav-ws-grid')) return;
    const data=Object.fromEntries(values);
    const candleState=document.getElementById('mav-ws-chart-panel-state');
    if(data.chart && Array.isArray(data.chart) && data.chart.length){
      wsLastCandles=data.chart;drawWsCandles(data.chart);
      const last=data.chart[data.chart.length-1],previous=data.chart[0],lastPrice=+last[4],change=previous&&+previous[1]?((lastPrice/+previous[1]-1)*100):null;
      const meta=document.getElementById('mav-ws-chart-meta');
      if(meta)meta.innerHTML=`<strong>${num(lastPrice,lastPrice<1?6:2)}</strong><span class="${change>=0?'up':'dn'}">${pct(change)}</span><span class="mu">${new Date(+last[6]).toLocaleString()}</span>`;
      const range=document.getElementById('mav-ws-chart-range');if(range)range.textContent=`Binance USDⓈ-M · ${tf} · ${data.chart.length} candles · EMA20`;
      document.getElementById('mav-ws-chart')?.removeAttribute('aria-busy');
      const st=document.getElementById('mav-ws-chart-panel-state');if(st)st.textContent='LIVE';
    }else{
      const meta=document.getElementById('mav-ws-chart-meta');if(meta)meta.textContent='Свечи временно недоступны';
      const st=document.getElementById('mav-ws-chart-panel-state');if(st)st.textContent='OFFLINE';
    }

    const bookEl=document.getElementById('mav-ws-book');
    if(bookEl){
      if(data.book?.asks?.length && data.book?.bids?.length){
        const asks=data.book.asks.slice(0,8).reverse(),bids=data.book.bids.slice(0,8),max=Math.max(1,...[...asks,...bids].map(x=>+x[1]));
        const row=(x,side)=>`<div class="mav-ws-book-row ${side}"><span>${num(+x[0],+x[0]<1?6:2)}</span><span>${num(+x[1],4)}</span><i style="width:${Math.max(3,(+x[1]/max)*100)}%"></i></div>`;
        bookEl.innerHTML=`<div class="mav-ws-book-head"><span>Price</span><span>Quantity</span></div><div class="mav-ws-book-side">${asks.map(x=>row(x,'ask')).join('')}</div><div class="mav-ws-book-mid">${num((+data.book.asks[0][0]+ +data.book.bids[0][0])/2,2)} <span class="mu">spread ${num(+data.book.asks[0][0]-+data.book.bids[0][0],4)}</span></div><div class="mav-ws-book-side">${bids.map(x=>row(x,'bid')).join('')}</div>`;
        const st=document.getElementById('mav-ws-book-panel-state');if(st)st.textContent='LIVE';
      }else{bookEl.innerHTML='<p class="mu">Стакан Binance Futures недоступен. Проверь соединение.</p>';const st=document.getElementById('mav-ws-book-panel-state');if(st)st.textContent='OFFLINE';}
    }

    const flowEl=document.getElementById('mav-ws-flow');
    if(flowEl){
      if(Array.isArray(data.flow) && data.flow.length){
        let buy=0,sell=0,buyN=0,sellN=0;
        data.flow.forEach(t=>{const q=+t.q||0;if(t.m){sell+=q;sellN++;}else{buy+=q;buyN++;}});
        const total=buy+sell,delta=buy-sell,buyPct=total?buy/total*100:50;
        flowEl.innerHTML=`<div class="mav-ws-flow-kpis"><div><small>Market buys</small><b class="up">${num(buy,4)}</b><span class="mu">${buyN} trades</span></div><div><small>Market sells</small><b class="dn">${num(sell,4)}</b><span class="mu">${sellN} trades</span></div></div><div class="mav-ws-flow-bar"><i style="width:${buyPct}%"></i></div><div class="mav-ws-flow-foot"><span class="mu">Buy share ${num(buyPct,1)}%</span><b class="${delta>=0?'up':'dn'}">Delta ${delta>=0?'+':''}${num(delta,4)}</b></div><p class="mu" style="margin:12px 0 0">Последние ${data.flow.length} aggregate trades · публичный поток Futures.</p>`;
        const st=document.getElementById('mav-ws-flow-panel-state');if(st)st.textContent='LIVE';
      }else{flowEl.innerHTML='<p class="mu">Поток сделок недоступен.</p>';const st=document.getElementById('mav-ws-flow-panel-state');if(st)st.textContent='OFFLINE';}
    }

    const derivEl=document.getElementById('mav-ws-deriv');
    if(derivEl){
      const p=data.premium,oi=data.oi,t=data.ticker;
      derivEl.innerHTML=`<div class="mav-ws-metrics"><div><small>Mark price</small><b>${p?num(+p.markPrice,+p.markPrice<1?6:2):'—'}</b></div><div><small>Index price</small><b>${p?num(+p.indexPrice,+p.indexPrice<1?6:2):'—'}</b></div><div><small>Funding rate</small><b>${p?pct(+p.lastFundingRate*100):'—'}</b></div><div><small>Open interest</small><b>${oi?num(+oi.openInterest,2):'—'}</b></div><div><small>24h change</small><b class="${t&&+t.priceChangePercent>=0?'up':'dn'}">${t?pct(+t.priceChangePercent):'—'}</b></div><div><small>24h quote volume</small><b>${t?money(+t.quoteVolume,0):'—'}</b></div></div><p class="mu" style="margin:10px 0 0">Next funding: ${p&&p.nextFundingTime?new Date(+p.nextFundingTime).toLocaleTimeString():'—'} · OI is contract open interest, not directional bias.</p>`;
      const st=document.getElementById('mav-ws-deriv-panel-state');if(st)st.textContent=(p||oi)?'LIVE':'OFFLINE';
    }
    const states=['chart','book','flow','deriv'].map(k=>document.getElementById(`mav-ws-${k}-panel-state`)?.textContent||'OFFLINE');
    if(connection)connection.textContent=states.includes('LIVE')?'BINANCE · LIVE / partial':'BINANCE · DATA UNAVAILABLE';
    renderWsWatchlist();
    try{sv();}catch(_){}
  }

  function applyWsLayout(){
    const ws=getWs(),grid=document.getElementById('mav-ws-grid');
    if(grid)grid.dataset.layout=ws.layout;
    document.querySelectorAll('[data-a="mav-ws-layout"]').forEach(b=>b.classList.toggle('on',b.dataset.layout===ws.layout));
  }

  document.addEventListener('click', e => {
    const b=e.target.closest('[data-a]'); if(!b)return;
    const a=b.dataset.a;
    if(a==='mav-ws-tf'){
      const ws=getWs();if(!tfList.includes(b.dataset.tf))return;
      ws.tf=b.dataset.tf;S.tf=ws.tf;try{sv();}catch(_){}
      document.querySelectorAll('[data-a="mav-ws-tf"]').forEach(x=>x.classList.toggle('on',x.dataset.tf===ws.tf));
      const range=document.getElementById('mav-ws-chart-range');if(range)range.textContent=`Binance USDⓈ-M · ${ws.tf}`;
      refreshWorkspace();
    }
    if(a==='mav-ws-refresh')refreshWorkspace();
    if(a==='mav-ws-layout'){
      const ws=getWs();ws.layout=b.dataset.layout||'2x2';applyWsLayout();try{sv();}catch(_){}
      if(wsLastCandles)requestAnimationFrame(()=>drawWsCandles(wsLastCandles));
    }
    if(a==='mav-ws-panel'){
      const panel=b.dataset.panel,ws=getWs();if(!panel)return;ws.panels[panel]=!!b.checked;
      const card=document.querySelector(`.mav-ws-panel[data-panel="${panel}"]`);if(card)card.hidden=!ws.panels[panel];
      try{sv();}catch(_){}
    }
    if(a==='mav-ws-save'){
      try{sv();}catch(_){}
      if(typeof note==='function')note('Workspace layout saved locally');
      const s=document.getElementById('mav-ws-connection');if(s)s.textContent='Workspace saved locally';
    }
    if(a==='mav-ws-add'){
      const ws=getWs(),s=ws.symbol;S.wl=Array.isArray(S.wl)?S.wl:[];
      if(!S.wl.includes(s))S.wl.push(s);else S.wl=S.wl.filter(x=>x!==s);
      try{sv();}catch(_){}
      b.textContent=S.wl.includes(s)?'In Watchlist':'＋ Watchlist';renderWsWatchlist();
    }
    if(a==='mav-ws-select'){
      const s=safeSymbol(b.dataset.s),ws=getWs();ws.symbol=s;S.sel=s;try{sv();}catch(_){};
      const select=document.getElementById('mav-ws-symbol');if(select)select.value=s;
      refreshWorkspace();
    }
    if(a==='mav-ws-remove'){
      const s=b.dataset.s;S.wl=(S.wl||[]).filter(x=>x!==s);try{sv();}catch(_){}renderWsWatchlist();
      const add=document.querySelector('[data-a="mav-ws-add"]');if(add)add.textContent=(S.wl||[]).includes(getWs().symbol)?'In Watchlist':'＋ Watchlist';
    }
  });

      const s=safeSymbol(e.target.value),ws=getWs();ws.symbol=s;S.sel=s;try{sv();}catch(_){}refreshWorkspace();

      const panel=e.target.dataset.panel,ws=getWs();if(!panel)return;ws.panels[panel]=!!e.target.checked;
      const card=document.querySelector(`.mav-ws-panel[data-panel="${panel}"]`);if(card)card.hidden=!ws.panels[panel];try{sv();}catch(_){}
    }
  });
